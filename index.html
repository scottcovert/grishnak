     much was written. -->

/* ---------------- THE WOLF ROUNDS — rails ----------------
   A rail wolf walks a fixed rectangular circuit at a constant pace, ignoring
   the player entirely, and cannot be killed: a round with a hole punched in
   it is not a round, and this screen is about reading a gap rather than
   clearing a room. The sword still matters — a hit shoves a wolf backwards
   along its rail and stuns it, which is how you MAKE a gap when the one you
   were given has closed. Same law as the Woods Run through the trees next
   door: wolves in this wood do not die, they give ground.
   Rails move by direct assignment, never moveBox — the circuits are laid on
   boardwalk by construction, and a rail that could be nudged off its ring by
   collision resolution is not a rail. */
const RAILS={
  A:{c0:4, r0:2, c1:15, r1:9},    // outer round — both doors touch it
  B:{c0:7, r0:4, c1:12, r1:7}     // inner round — reached only by the west spoke
};
for(const rk in RAILS){
  const R=RAILS[rk];
  R.w=(R.c1-R.c0)*T; R.h=(R.r1-R.r0)*T; R.per=2*(R.w+R.h);
}
/* t runs 0..1 clockwise from the ring's north-west corner */
function railPos(ring, t){
  const R=RAILS[ring];
  let dd=(((t%1)+1)%1)*R.per;
  const x0=R.c0*T+16, y0=R.r0*T+24;
  if(dd<R.w) return {x:x0+dd, y:y0};
  dd-=R.w; if(dd<R.h) return {x:x0+R.w, y:y0+dd};
  dd-=R.h; if(dd<R.w) return {x:x0+R.w-dd, y:y0+R.h};
  dd-=R.w; return {x:x0, y:y0+R.h-dd};
}

let AC=null, muted=false;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function beep(f0,f1,dur,type,vol){
  const ac=audio(); if(!ac||muted) return;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f0,ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),ac.currentTime+dur);
  g.gain.setValueAtTime(vol||0.1,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+dur+0.02);
}
function melody(notes,step,type,vol){
  const ac=audio(); if(!ac||muted) return;
  notes.forEach((n,i)=>{
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'square'; o.frequency.value=n;
    const t0=ac.currentTime+i*step;
    g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(vol||0.09,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t0+step*0.95);
    o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+step);
  });
}

/* ---------------- A GENERIC POINTER FEED (2026-08-17) ----------------
   The only mouse plumbing here before this was scoped hard to
   state==='sentinel', deliberately, so that a stray click could never reach
   the overworld. The wall builder needs a real pointer — drag-painting, a
   palette you click, a right-click menu — so the FEED becomes generic and the
   scoping moves to the consumer: events queue up, whoever is on screen decides
   whether to read them, and anything unread is dropped at the end of the frame
   rather than banking into a burst the next time some layer looks.
   Coordinates are LOGICAL game pixels with no HUD offset, because the layer
   that wants them owns the whole canvas.

   The note that used to sit here said the sentinel kept its own aim/click pair
   because "it works, and rewiring a working thing to prove a point is how you
   break it". That was wrong twice over. aimX, aimY and clickQueue are WRITTEN
   AND NEVER READ — nothing anywhere consumes them, so the pair was not working,
   it was merely not observably failing. And because the new feed was written to
   match that pair's formula, it inherited its arithmetic without ever inheriting
   a test. An unread expression is not a worked example. */
const ptr={x:0, y:0, down:false, btn:0};
let ptrQ=[];
/* SCREEN PIXELS -> LOGICAL GAME PIXELS. There are two conversions to make and
   the old code made neither, which is what Scott was seeing on 2026-08-16:
   "an offset diagonally up and to the left, of where my windows cursor appears
   and where the interface seems to think the cursor is". Up-and-left, and
   growing with distance from the corner, is the signature of a bad MULTIPLIER
   rather than a missing constant — the interface was tracking a point roughly
   twice as far down and right as the real arrow.

     1. SCALE. The backing store is 1280x864, but every drawing call goes
        through setTransform(SCALE,0,0,SCALE,0,0), so game code — including
        every hit test in the builder — lives in 640x432. A point in backing
        pixels is exactly SCALE times the number those tests want.

     2. THE BORDER. getBoundingClientRect() returns the BORDER box. r.left is
        the outer edge of the 3px frame and r.width counts 6px that no pixel of
        the game is ever drawn into, so it is the wrong origin AND the wrong
        divisor. The CONTENT box is what maps to the backing store. Taking the
        border as a measured difference rather than a hard 3 means this keeps
        working if the frame changes or disappears.

   One function, used by every mouse path on the page, because the way this bug
   happened was a second copy of the arithmetic that nobody could check. */
function cvPoint(e){
  const r=cv.getBoundingClientRect();
  if(!cv.clientWidth || !cv.clientHeight) return {x:-1, y:-1};   // not laid out yet
  const bx=(r.width-cv.clientWidth)/2, by=(r.height-cv.clientHeight)/2;
  return { x:(e.clientX-r.left-bx)*(cv.width /cv.clientWidth )/SCALE,
           y:(e.clientY-r.top -by)*(cv.height/cv.clientHeight)/SCALE };
}
function ptrPush(t,e){
  const p=cvPoint(e); ptr.x=p.x; ptr.y=p.y;
  if(ptrQ.length<64) ptrQ.push({t, x:p.x, y:p.y, btn:e.button});  // 64 = a hard cap, not a guess
}
addEventListener('mousemove', e=>ptrPush('move',e));
addEventListener('mousedown', e=>{ ptr.down=true; ptr.btn=e.button; ptrPush('down',e); });
addEventListener('mouseup',   e=>{ ptr.down=false; ptrPush('up',e); });
/* the browser menu is suppressed ONLY where a layer says it wants the button,
   so right-click still behaves normally everywhere else on the page */
function wantsMouse(){
  return state==='breakout' && window.BreakoutLayer && window.BreakoutLayer.wantsMouse
      && window.BreakoutLayer.wantsMouse();
}
cv.addEventListener('contextmenu', e=>{ if(wantsMouse()) e.preventDefault(); });

/* CURRENTLY UNCONSUMED. Nothing reads aimX, aimY or clickQueue — mini-sentinel
   only clears the queue. They are kept because the sentinel may want a reticle
   later, but they go through cvPoint like everything else, so if something does
   start reading them it reads the same coordinates the rest of the page uses.
   Leaving a private copy of the arithmetic here is precisely what cost us the
   builder's cursor. */
let aimX=RW/2, aimY=RH/2, clickQueue=[];
addEventListener('mousemove',e=>{
  if(state!=='sentinel') return;
  const p=cvPoint(e); aimX=p.x; aimY=p.y-HUD;
});
addEventListener('click',e=>{

  const p=cvPoint(e); clickQueue.push({x:p.x, y:p.y-HUD});
});

});
/* arcade states -> their layer globals, for the P pause / R restart keys
   (workings is excluded from R — its own R restarts the current level) */
const ARCADE_LAYERS={cave:'CaveLayer', maze:'MazeLayer', asteroids:'AsteroidsLayer',
  sentinel:'SentinelLayer', squirrel:'SquirrelLayer', jungle:'JungleLayer',
  quarry:'QuarryLayer', highroads:'HighMazeLayer', workings:'WorkingsLayer',
  rose:'RoseLayer', chess:'ChessLayer', breakout:'BreakoutLayer',
  hazymaze:'HazyLayer', robotron:'RobotronLayer', moonwalk:'MoonwalkLayer',
  pacsphere:'PacsphereLayer', woodsrun:'WoodsRunLayer', contraption:'ContraptionLayer',
  river:'RiverLayer'};
addEventListener('keydown',e=>{
  if(gardenOpen) return;          // the gratitude input owns the keyboard
  const k=e.key;
  /* ALT+ENTER — the old mainstay fullscreen toggle (Scott, 2026-08-20;
     Alt-Tab is OS-owned and unreachable). Scales EVERY layer, since the
     whole game family draws to this one canvas. */
  if(e.altKey && k==='Enter'){
    e.preventDefault();
    if(document.fullscreenElement){ document.exitFullscreen&&document.exitFullscreen(); }
    else if(cv.requestFullscreen){ cv.requestFullscreen(); }
    return;
  }
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter'].includes(k)) e.preventDefault();
  if(state==='archive') return;   // the Archive terminal owns the whole keyboard
  if(k==='m'||k==='M'){ muted=!muted; return; }
  audio();
  if(held[k]) return; held[k]=true;
  if((k==='p'||k==='P') && (ARCADE_LAYERS[state]||state==='play')){ paused=!paused; return; }
  if((k==='r'||k==='R') && ARCADE_LAYERS[state] && state!=='workings' && window[ARCADE_LAYERS[state]]){
    paused=false; window[ARCADE_LAYERS[state]].enter(); return;
  }
  if((k==='n'||k==='N') && state==='title') beginFromTitle(()=>newGame());
  if(k==='Enter'){
    if(state==='title'){ beginFromTitle(()=>{ if(!(hasSave()&&loadGame())) newGame(); }); }
    else if(state==='win'){
      startWarp(()=>{
        arcadeFrom={scr:11, x:16*T+16, y:2*T+8};
        loadScreen(12); PL.x=10*T+16; PL.y=9*T+20; unstick(PL); PL.iframes=45;
        toast('The FIREBALL MAZE cabinet hums to life...');
      });
    }
    else if(paused) paused=false;
  }
  if((k==='r'||k==='R') && state==='win') newGame();
});
addEventListener('keyup',e=>{ if(gardenOpen) return; held[e.key]=false; });
addEventListener('blur',()=>{ if(state==='play'||state==='cave'||state==='maze'||state==='asteroids'||state==='sentinel'||state==='squirrel'||state==='robotron'||state==='chess'||state==='rose'||state==='jungle'||state==='quarry'||state==='workings'||state==='highroads'||state==='breakout'||state==='hazymaze'||state==='moonwalk'||state==='pacsphere'||state==='woodsrun'||state==='contraption'||state==='river') paused=true; });
function dirHeld(){
  let x=0,y=0;
  if(held['ArrowLeft']||held['a']||held['A']) x-=1;
  if(held['ArrowRight']||held['d']||held['D']) x+=1;
  if(held['ArrowUp']||held['w']||held['W']) y-=1;
  if(held['ArrowDown']||held['s']||held['S']) y+=1;
  return {x,y};
}

/* PHASE-IN (Scott 2026-08-18): every game refresh drops you into the middle
   of the Town Square in a materialise shimmer, announced by the wav he picked.
   The keypress that leaves the title screen is the user gesture the browser
   needs, so the audio is allowed to play. Progress keeps; place resets. */
function playPhaseWav(){
  if(muted) return;
  try{ const a=new Audio('soundeffects/deffreem.wav'); a.volume=0.15; a.play().catch(()=>{}); }catch(e){}
}
function phaseHome(){
  loadScreen(5);
  PL.x=10*T+16; PL.y=6*T+24; unstick(PL);
  PL.iframes=90; phaseT=64;
  if(phaseWavDone) phaseWavDone=false;     // already played over the splash savor
  else playPhaseWav();
}
function newGame(){
  res.wood=0; res.stone=0; res.gold=0;
  built.clear(); killed.clear(); openedChests.clear(); chopped.clear(); visited.clear();
  Object.keys(flags).forEach(k=>delete flags[k]);
  slain=0; millT=0; quarryT=0; farmT=0; breadPending=false; playFrames=0; bossDead=0; winStats=null;
  keysHeld.length=0;
  PL.hp=6; PL.maxhp=6; PL.swing=0;
  if(window.CaveLayer) CaveLayer.reset();
  arcadeFrom=null;
  phaseHome();
  state='play'; paused=false;
  toast('Top-right = valley map. The gold square is you.');
}

function restartGame(){
  if(!confirm('Restart Grishnak from the very beginning?\n\nYour valley progress and saved game will be erased. (The Adventure! text-game keeps its own separate save.)')) return;
  try{
    localStorage.removeItem(SAVEKEY);
    localStorage.removeItem('rose_jump');
    localStorage.removeItem('cr_treasure');   // cross-game breadcrumbs
  }catch(e){}
  // drop any active mini-game layer back to the overworld before wiping state
  paused=false;
  newGame();
}

/* ---------------- SAVE / LOAD ---------------- */
function hasSave(){ try{ return !!localStorage.getItem(SAVEKEY); }catch(e){ return false; } }
function saveGame(){
  if(state!=='play') return;
  try{
    localStorage.setItem(SAVEKEY, JSON.stringify({
      v:1, res:{...res}, built:[...built], killed:[...killed], openedChests:[...openedChests],
      visited:[...visited], flags:{...flags}, keysHeld:[...keysHeld],
      slain, playFrames, bossDead, breadPending, curScr, px:PL.x, py:PL.y, hp:PL.hp, maxhp:PL.maxhp,
      cave: window.CaveLayer&&CaveLayer.save ? CaveLayer.save() : null
    }));
    saveFlash=100;
  }catch(e){}
}
function loadGame(){
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(SAVEKEY)); }catch(e){}
  if(!d) return false;
  res.wood=d.res.wood; res.stone=d.res.stone; res.gold=d.res.gold;
  built.clear(); d.built.forEach(x=>built.add(x));
  killed.clear(); d.killed.forEach(x=>killed.add(x));
  openedChests.clear(); d.openedChests.forEach(x=>openedChests.add(x));
  visited.clear(); (d.visited||[]).forEach(x=>visited.add(x));
  Object.keys(flags).forEach(k=>delete flags[k]); Object.assign(flags, d.flags||{});
  keysHeld.length=0; (d.keysHeld||[]).forEach(k=>keysHeld.push(k));
  chopped.clear();
  slain=d.slain||0; playFrames=d.playFrames||0; bossDead=d.bossDead||0;
  winStats = bossDead ? {time:playFrames, buildings:built.size, slain, gold:res.gold} : null;
  millT=0; quarryT=0; farmT=0; breadPending=!!d.breadPending;
  PL.hp=d.hp; PL.maxhp=d.maxhp;
  PL.swing=0; PL.kb.x=0; PL.kb.y=0;
  arcadeFrom=null;
  if(window.CaveLayer){ CaveLayer.reset(); if(d.cave&&CaveLayer.load) CaveLayer.load(d.cave); }
  /* saved px/py/curScr still ride the save format but are deliberately NOT
     restored (Scott 2026-08-18): a refresh phases you home instead */
  phaseHome();
  state='play'; paused=false;
  toast('Welcome back — game loaded.');
  return true;
}

/* ---------------- SCREEN LOADING ---------------- */
let solid=new Set(), grid=[];
function key(c,r){ return c+','+r; }

function loadScreen(idx){
  if(idx===13 && !visited.has(13)) toast('Push The Boulders!');
  curScr=idx; visited.add(idx);
  const S=SCREENS[idx];
  nodes=[]; foes=[]; npcs=[]; chests=[]; spots=[]; decos=[]; pickups=[]; hearts=[]; portals=[]; pushables=[]; diamonds=[]; doors=[]; keyItems=[]; sockets=[]; gaps=[]; ducks=[]; critters=[]; playerTrail=[];
  particles=[]; floats=[];
  solid=new Set(); grid=[];
  for(let r=0;r<ROWS;r++){
    const line=(S.map[r]||"").padEnd(COLS,'#').slice(0,COLS);
    const row=[];
    for(let c=0;c<COLS;c++){
      let ch=line[c];
      const border = (r===0||r===ROWS-1||c===0||c===COLS-1);
      if((ch==='T'||ch==='R'||ch==='C') && !border){
        const id=idx+':'+c+':'+r;
        const resp=chopped.get(id);
        if(resp===undefined || playFrames>=resp){
          chopped.delete(id);
          nodes.push({kind:ch==='T'?'tree':ch==='C'?'corn':'rock', id, c, r, hp:ch==='T'?3:ch==='C'?1:4, shake:0});
          solid.add(key(c,r));
        }
        row.push('.');   // ground under node
      } else if(ch==='V' && !border){
        const id=idx+':'+c+':'+r;
        if(flags['gapfill:'+id]) row.push('.');
        else { gaps.push({id,c,r}); solid.add(key(c,r)); row.push('V'); }
      } else row.push(ch);
    }
    grid.push(row);
  }
  ENTS[idx].forEach((e,i)=>{
    const id=idx+':e'+i;
    const x=e.c*T+16, y=e.r*T+24;
    if(e.t==='npc') npcs.push({who:e.who, x, y});
    /* carry lift through — the label-lane field. The first fix set lift on the
       deco entries and tested the SOURCE, but this line rebuilt the portal
       with only {key,x,y}, so the renderer never saw it and the labels kept
       colliding on screen. Fields the draw code reads must survive this hop. */
    else if(e.t==='portal') portals.push({key:e.key, x, y, lift:e.lift||0, sign:e.sign||0});
    else if(e.t==='trail') decos.push({kind:'trail', x:e.c*T, y:e.r*T, to:e.to, tx:e.tx, ty:e.ty, gate:e.gate});
    else if(e.t==='teleport') decos.push({kind:'teleport', x:e.c*T, y:e.r*T, tx:e.tx, ty:e.ty});
    else if(e.t==='rosedoor') decos.push({kind:'rosedoor', x:e.c*T, y:e.r*T});
    else if(e.t==='riverraft') decos.push({kind:'riverraft', x:e.c*T, y:e.r*T});
    else if(e.t==='trellis') decos.push({kind:'trellis', x:e.c*T, y:e.r*T});
    else if(e.t==='tomato'){ decos.push({kind:'tomato', x:e.c*T, y:e.r*T}); if(!flags.tomatoAt) flags.tomatoAt=playFrames; }
    else if(e.t==='cropsign') decos.push({kind:'cropsign', x:e.c*T, y:e.r*T});
    else if(e.t==='trough'){
      decos.push({kind:'trough', x:e.c*T, y:e.r*T});
      solid.add(key(e.c,e.r));
      /* mother duck at the trough (ALWAYS ducks[0]) + three ducklings, one
         lost in each sealed corn region until walked home. duckhome flags
         persist in the save; the imprint itself is screen-local. */
      const hx=e.c*T+16, hy=e.r*T+36;
      ducks.push({kind:'mom', x:hx, y:hy+4, hx, hy, tx:hx, ty:hy, wt:40, fx:1, quackT:0, step:0});
      const LOST=[{c:14,r:1},{c:1,r:9},{c:18,r:9}];
      for(let i=0;i<3;i++){
        const home=!!flags['duckhome'+i];
        const sx=home? hx+(i-1)*14 : LOST[i].c*T+16, sy=home? hy+6+(i%2)*5 : LOST[i].r*T+20;
        ducks.push({kind:'kid', i, st:home?'home':'lost', x:sx, y:sy,
          hx: home? hx : sx, hy: home? hy+6 : sy, lx:sx, ly:sy,
          tx:sx, ty:sy, wt:30+i*50, fx:1, quackT:0, step:0, fi:0});
      }
    }
    else if(e.t==='radtomato'){ if(!flags.radtomato) decos.push({kind:'radtomato', x:e.c*T, y:e.r*T}); }
    else if(e.t==='wellrope') decos.push({kind:'wellrope', x:e.c*T, y:e.r*T});
    else if(e.t==='threaddoor') decos.push({kind:'threaddoor', x:e.c*T, y:e.r*T});
    else if(e.t==='feather'){ if(!flags.greyFeather) decos.push({kind:'feather', x:e.c*T, y:e.r*T}); }
    else if(e.t==='fallenstar'){ if(flags.wellStar && !flags.wellStarTaken) decos.push({kind:'fallenstar', x:e.c*T, y:e.r*T}); }
    else if(e.t==='gratbed') decos.push({kind:'gratbed', x:e.c*T, y:e.r*T});
    else if(e.t==='statue'){ decos.push({kind:'statue', g:e.g, n:e.n, x:e.c*T, y:e.r*T}); solid.add(key(e.c,e.r)); }
    else if(e.t==='cypherstone'){ decos.push({kind:'cypherstone', x:e.c*T, y:e.r*T}); solid.add(key(e.c,e.r)); }
    else if(e.t==='extlink'){ decos.push({kind:'extlink', key:e.key, x:e.c*T, y:e.r*T}); solid.add(key(e.c,e.r)); }
    else if(e.t==='wreck'){ decos.push({kind:'wreck', x:e.c*T, y:e.r*T}); solid.add(key(e.c,e.r)); }
    else if(e.t==='shelf'){ decos.push({kind:'shelf', x:e.c*T, y:e.r*T, w:e.w||2}); for(let dc=0;dc<(e.w||2);dc++) solid.add(key(e.c+dc,e.r)); }
    else if(e.t==='boxes'){ decos.push({kind:'boxes', x:e.c*T, y:e.r*T}); solid.add(key(e.c,e.r)); }
    else if(e.t==='desk'){ decos.push({kind:'desk', x:e.c*T, y:e.r*T}); solid.add(key(e.c,e.r)); solid.add(key(e.c+1,e.r)); }
    else if(e.t==='cropwand') decos.push({kind:'cropwand', x:e.c*T, y:e.r*T});
    else if(e.t==='board') decos.push({kind:'board', x:e.c*T, y:e.r*T});
    else if(e.t==='stall') decos.push({kind:'stall', x:e.c*T, y:e.r*T});
    else if(e.t==='bench') decos.push({kind:'bench', x:e.c*T, y:e.r*T});
    else if(e.t==='lamp') decos.push({kind:'lamp', x:e.c*T, y:e.r*T});
    else if(e.t==='push') pushables.push({x:e.c*T+16, y:e.r*T+16, w:26, h:22, dust:0});
    else if(e.t==='socket') sockets.push({id, c:e.c, r:e.r, x:e.c*T+16, y:e.r*T+16});
    else if(e.t==='diam'){ if(!flags['diam'+id]) diamonds.push({id, x, y:y-6}); }
    else if(e.t==='doorkey'){ if(!flags['kt_'+e.kcol]) keyItems.push({kcol:e.kcol, x, y:y-8}); }
    else if(e.t==='lockdoor'){ if(!flags['door_'+e.kcol]){ doors.push({kcol:e.kcol, c:e.c, r:e.r, x, y:e.r*T+16}); solid.add(key(e.c,e.r)); } }
    else if(e.t==='chest'){ if(!openedChests.has(id)) chests.push({id, x, y, gold:e.gold, lock:e.lock}); else chests.push({id,x,y,gold:0,open:true}); }
    else if(e.t==='heart'){ if(!flags['heart'+id]) hearts.push({id, x, y}); }
    else if(e.t==='spot') spots.push({key:e.key, x, y, c:e.c, r:e.r});
    else if(e.t==='house'||e.t==='tent'||e.t==='well'||e.t==='cavemouth'||e.t==='arcadedoor'||e.t==='govhall'){
      decos.push({kind:e.t, x:e.c*T, y:e.r*T});
      if(e.t==='house'){ for(const [dc,dr] of [[0,0],[1,0],[0,1],[1,1]]) solid.add(key(e.c+dc,e.r+dr)); }
      else if(e.t==='govhall'){ for(let dc=0;dc<3;dc++) for(let dr=0;dr<2;dr++) solid.add(key(e.c+dc,e.r+dr)); }
      else solid.add(key(e.c,e.r));
    }
    else if(e.t==='railwolf'){
      const p=railPos(e.ring, e.at);
      const f=mkFoe('wolf', id, p.x, p.y, e);
      f.rail={ring:e.ring, at:e.at, dir:e.dir||1, spd:e.spd||1, stun:0};
      foes.push(f);
    }
    else if(e.t==='runhead') decos.push({kind:'runhead', x:e.c*T, y:e.r*T, side:e.side});
    else if(e.t==='critter'){
      const kx=e.c*T+16, ky=e.r*T+22;
      critters.push({kind:e.kind, swim:e.kind==='platypus', fly:e.kind==='dragonfly',
                     mode:'perch', x:kx, y:ky, hx:kx, hy:ky,
                     tx:kx, ty:ky, wt:20+Math.random()*80, fx:1, step:Math.random()*6});
    }
    else { // enemy
      if(!killed.has(id)) foes.push(mkFoe(e.t, id, x, y, e));
    }
  });
  // gate rubble solidity (fortress)
  if(idx===11 && !built.has('gate')){ for(const c of [9,10,11]) solid.add(key(c,3)); }
  /* -------- THE AFTERMATH (Scott, 2026-08-18: keep the Warlord screens alive
     after the Warlord). Two ideas from the brainstorm, shipped as one braid:
     THE SURRENDERED — his bandits give up the day he falls. The camp stops
       being a combat room and becomes a testimony room: three of them strike
       the tents, feed the fire, stack wood for the town, and TALK. Their
       confessions are the only account anywhere of why the Warlord rose.
     THE DIG — two more asked for shovels. The fortress yard becomes an
       excavation that goes down one layer per visit, and what comes up
       (old coins, older floors, a burned horizon, a toy soldier, and at the
       bottom a warm slab humming ONE LOW NOTE) says the fortress was never
       built to keep people out. Ties the Lamplighter's and Brit's door lines
       to ground you can stand on. The slab does not open. Canon stays shut. */
  if(bossDead>0 && (idx===7||idx===11)){
    /* the boss splice is belt-and-braces: killFoe() books him into killed[]
       before bossDead is ever set, but a save that says the Warlord fell must
       never render the Warlord standing in his own excavation */
    for(let i=foes.length-1;i>=0;i--) if(foes[i].t==='bandit'||foes[i].t==='boss') foes.splice(i,1);
    if(idx===7){
      npcs.push({who:'surr', i:0, pose:'strike', x:5*T+16,  y:3*T+24});
      npcs.push({who:'surr', i:1, pose:'fire',   x:10*T+16, y:7*T+24});
      npcs.push({who:'surr', i:2, pose:'stack',  x:14*T+16, y:8*T+24});
      decos.push({kind:'armpile',  x:8*T,  y:5*T}); solid.add(key(8,5));
      decos.push({kind:'cookfire', x:11*T, y:7*T}); solid.add(key(11,7));
    } else {
      digVisit=false;
      npcs.push({who:'surr', i:3, pose:'dig', x:9*T+16,  y:5*T+24});
      npcs.push({who:'surr', i:4, pose:'dig', x:13*T+16, y:6*T+24});
      decos.push({kind:'digsite', x:11*T, y:5*T});
      solid.add(key(11,5)); solid.add(key(12,5));   // nobody walks into the pit
    }
  }
  /* Cameron, beta 2026-08-15: "Enemies at South Meadow don't move." They could
     not. Entities spawn at y = r*T+24, so a foe posted on the LAST walkable row
     hangs its 18px-tall box 9px into the solid border row underneath — and
     moveBox() only ever accepts a step whose DESTINATION is clear, so every
     0.5px wander step was rejected and the two boars stood there for ever. The
     player has had unstick() for exactly this since the beginning; the foes
     never got it. Screen 8's boars are the only enemies posted on row 10 today,
     which is why it read as a South Meadow bug rather than a spawn bug.
     Runs AFTER every solid is registered, or a foe listed before a house would
     be freed against a map that is still being built. */
  for(const f of foes) if(!f.rail) unstick(f);   // a rail wolf is never "stuck" — it is ON a rail
  shopOpen=false; wellOpen=false; cyOpen=false; cinderTaught=false;
  /* the sluices arm themselves the moment you set foot in the Riverlands —
     after solid[] is built, because sluReset writes straight into it */
  if(idx===SLU_SCR) sluReset();
  // TOWN FUND stages (bought at the Token Booth) make the square visibly better
  if(idx===5){
    const ts=flags.townStage||0;
    if(ts>=1){ decos.push({kind:'lamp',x:12*T,y:6*T}); decos.push({kind:'lamp',x:14*T,y:8*T}); }
    if(ts>=2){ for(const [fc,fr] of [[5,2],[6,2],[13,2],[15,8]]) decos.push({kind:'flowers',x:fc*T,y:fr*T}); }
    /* bunting hangs at r3 — street level in FRONT of the town hall (which
       occupies r1-2 and would otherwise draw over the line) */
    if(ts>=3){ decos.push({kind:'stall',x:5*T,y:4*T}); decos.push({kind:'bunting',x:7*T,y:3*T,w:7*T}); }
  }
  if(idx===9 && !flags.sawCorn){
    flags.sawCorn=true;
    toast('The corn came in twelve feet tall this season. Cut through — it grows back fast enough to be insulting.');
  }
}
/* ---------------- AMBIENT WILDLIFE (Scott, 2026-08-16) ----------------
   "I want some art of a platypus, capabara, and dodo as game screen pieces
   that move (walk)."
   Three animals that live on their screens and do nothing else: no damage, no
   collision, no quest, no drop. They are residents. Every other moving thing
   in the valley is either an enemy or an errand, and a place with nothing in
   it that is merely ALIVE reads as a level rather than a valley.
   Each keeps to a home patch and only ever picks a target it can actually
   occupy — walkable ground for the walkers, open water for the platypus — so
   one can never wander into a tree or paddle up a bank. They also stand still
   about a third of the time, which is most of what an animal does. */
const CRIT_HOME=54;
function inWater(px,py){
  const c=Math.floor(px/T), r=Math.floor(py/T);
  return c>=0&&c<COLS&&r>=0&&r<ROWS && grid[r][c]==='W';
}
function updateDragonfly(k){
  /* dart-hover-perch: a real dragonfly perches most of the time, then
     relocates in one straight burst. The dart is fast enough that the eye
     catches it as an event, and the wings only blur while airborne. Flight
     ignores walkability — it is air — but targets prefer open water so the
     pair stays over the lake instead of drifting into the treeline. */
  if(--k.wt<=0){
    if(k.mode==='perch'){
      for(let tries=0;tries<12;tries++){
        const a=Math.random()*6.28, dd=24+Math.random()*CRIT_HOME;
        const nx=k.hx+Math.cos(a)*dd, ny=k.hy+Math.sin(a)*dd;
        if(tries<8? inWater(nx,ny) : (nx>T&&nx<(COLS-1)*T&&ny>T&&ny<(ROWS-1)*T)){
          k.tx=nx; k.ty=ny; k.mode='fly'; k.wt=900; break;
        }
      }
      if(k.mode!=='fly') k.wt=40;
    } else if(k.mode==='hover'){
      k.mode='perch';
      k.wt= Math.random()<0.3 ? 1 : 160+Math.random()*300;  // 30%: dart straight on
    }
  }
  if(k.mode==='fly'){
    const dx=k.tx-k.x, dy=k.ty-k.y, dn=Math.hypot(dx,dy);
    if(dn<3){ k.mode='hover'; k.wt=26+Math.random()*40; }
    else{
      k.x+=dx/dn*1.5+Math.sin(k.step*0.7)*0.22;   // slight waver on the line
      k.y+=dy/dn*1.5+Math.cos(k.step*0.9)*0.18;
      if(Math.abs(dx)>0.4) k.fx=dx<0?-1:1;
    }
  }
  k.step+= k.mode==='perch'? 0.03 : 0.95;
}
function updateCritters(){
  for(const k of critters){
    if(k.fly){ updateDragonfly(k); continue; }
    if(--k.wt<=0){
      k.wt=70+Math.random()*170;
      k.tx=k.x; k.ty=k.y;                       // default: stand and look about
      if(Math.random()>0.32){
        for(let tries=0;tries<10;tries++){
          const a=Math.random()*6.28, dd=Math.random()*CRIT_HOME;
          const nx=k.hx+Math.cos(a)*dd, ny=k.hy+Math.sin(a)*dd;
          if(k.swim? inWater(nx,ny) : walkable(nx,ny)){ k.tx=nx; k.ty=ny; break; }
        }
      }
    }
    const dx=k.tx-k.x, dy=k.ty-k.y, dn=Math.hypot(dx,dy);
    if(dn>2){
      const sp=k.swim?0.42:0.34;
      const nx=k.x+dx/dn*sp, ny=k.y+dy/dn*sp;
      /* the STEP has to be legal, not just the destination. A straight line
         between two patches of open water crosses the island in the middle of
         the Lakeside lake, and a platypus strolling over dry land is a worse
         bug than one that never moves — 414 frames of it before this check,
         and 14 of the capybara clipping the river bank. Blocked = give up on
         this target and pick another shortly, which reads as an animal
         thinking better of it. */
      if(k.swim? inWater(nx,ny) : walkable(nx,ny)){
        k.x=nx; k.y=ny;
        if(Math.abs(dx)>0.4) k.fx=dx<0?-1:1;
        k.step+=k.swim?0.09:0.13;
      } else { k.tx=k.x; k.ty=k.y; k.wt=Math.min(k.wt,8); }
    }
  }
}
function mkFoe(t,id,x,y,e){
  const d=ENEMY_DEF[t];
  /* per-entity stat overrides (spd/wspd/aggro on the ENTS row) let one
     screen post slower or tamer specimens of a shared species */
  return {t, id, x, y, hp:d.hp, w:d.w, h:d.h, dir:{x:0,y:1}, wt:0, hurt:0, flash:0, dash:0, dashT:0,
          face:1, anim:0, aggroed:false,   // facing + gait phase + temper, all fed by updateFoes
          spd:(e&&e.spd)||0, wspd:(e&&e.wspd)||0, aggro:(e&&e.aggro)||0};
}

function walkable(px,py){
  const c=Math.floor(px/T), r=Math.floor(py/T);
  if(c<0||c>=COLS||r<0||r>=ROWS) return true;  // edges handled by transitions/clamps
  if(solid.has(key(c,r))) return false;
  const ch=grid[r][c];
  if(ch==='W'){
    if(curScr===6 && built.has('bridge') && (r===5||r===6) && (c===12||c===13)) return true;
    return false;
  }
  if(ch==='T'||ch==='R'||ch==='F'||ch==='#') return false;
  return true;
}
function boxFree(x,y,w,h){
  return walkable(x-w/2,y-h/2)&&walkable(x+w/2,y-h/2)&&walkable(x-w/2,y+h/2)&&walkable(x+w/2,y+h/2);
}
function pushAt(x,y,w,h,skip){
  for(const pb of pushables){
    if(pb===skip) continue;
    if(Math.abs(pb.x-x)<(pb.w+w)/2 && Math.abs(pb.y-y)<(pb.h+h)/2) return pb;
  }
  return null;
}
function moveBox(o,dx,dy){
  if(dx!==0 && boxFree(o.x+dx,o.y,o.w,o.h) && !pushAt(o.x+dx,o.y,o.w,o.h,o)) o.x+=dx;
  if(dy!==0 && boxFree(o.x,o.y+dy,o.w,o.h) && !pushAt(o.x,o.y+dy,o.w,o.h,o)) o.y+=dy;
}
function slopeFactor(px,py){
  const c=Math.floor(px/T), r=Math.floor(py/T);
  if(c<0||c>=COLS||r<0||r>=ROWS) return 1;
  const ch=grid[r][c];
  return ch==='2'?0.34 : ch==='1'?0.65 : 1;
}
function unstick(o){
  if(boxFree(o.x,o.y,o.w,o.h)) return;
  for(let rad=4;rad<=96;rad+=4)
    for(const [dx,dy] of [[rad,0],[-rad,0],[0,rad],[0,-rad],[rad,rad],[-rad,rad],[rad,-rad],[-rad,-rad]])
      if(boxFree(o.x+dx,o.y+dy,o.w,o.h)){ o.x+=dx; o.y+=dy; return; }
}
// a boulder shoved into a gap tile wedges in permanently and becomes solid ground
function tryFillGap(pb, nx, ny){
  // check the boulder's LEADING edge in the direction of travel, not its center —
  // otherwise a half-tile-tall/wide boulder bonks the gap tile's near wall (blocked as
  // solid) a step before its center would ever register as "inside" the gap.
  const dx=nx-pb.x, dy=ny-pb.y;
  const ex = nx + (dx>0 ? pb.w/2 : dx<0 ? -pb.w/2 : 0);
  const ey = ny + (dy>0 ? pb.h/2 : dy<0 ? -pb.h/2 : 0);
  const c=Math.floor(ex/T), r=Math.floor(ey/T);
  for(const gp of gaps){
    if(gp.c===c && gp.r===r && !flags['gapfill:'+gp.id]){
      flags['gapfill:'+gp.id]=true;
      solid.delete(key(c,r));
      if(grid[r]) grid[r][c]='.';
      groundScr=-1;   // force the cached ground layer to redraw now that this tile changed
      pb.x=gp.c*T+16; pb.y=gp.r*T+16;   // snap square into the gap tile it just filled
      const i=pushables.indexOf(pb);
      if(i>=0) pushables.splice(i,1);
      puff(pb.x,pb.y,'#8a7458',10); sfx.chest();
      toast('The boulder wedges into the gap — solid ground!');
      return true;
    }
  }
  return false;
}
// socket puzzles: all pushables resting on their marked sockets fires a per-screen payoff
function checkSockets(){
  if(!sockets.length) return;
  const covered = sockets.every(sk => pushables.some(pb=>Math.hypot(pb.x-sk.x,pb.y-sk.y)<16));
  if(!covered) return;
  if(curScr===13 && !flags.summitSockets){
    flags.summitSockets=true;
    toast('The boulders lock into place — a path opens beyond the summit.');
    sfx.task();
    for(const sk of sockets) puff(sk.x, sk.y, '#7fdb7f', 8);
  } else if(curScr===15 && !flags.stonePawn){
    flags.stonePawn=true;
    toast('CHECKMATE — a thousand years late. The granite pawn hums: it will fight for you in The Frozen Game.');
    sfx.win();
    for(const sk of sockets) puff(sk.x, sk.y, '#ffd76e', 10);
    saveGame();
  }
}

/* ---------------- THE CYPHER (Scott, 2026-08-19) ----------------
   Rune substitution, taught by the world: five petrified soldiers on the
   Battlefield each bear ONE glyph and a tally (the tallies give the order),
   the sealed stone bears all five and takes an answer, and the KEY is
   discovered, not given — OLD CINDER at the dig reads one glyph per visit
   (his own one-a-visit cadence, reused). Nothing stops a sharp player from
   guessing the word off two or three letters — partial information IS the
   fun. The stone pays a max heart: a real reward, per the set-piece rule. */
const CY_WORD='MASON';                            // he was a mason first
const CY_TEACH=['N','M','O','S','A'];             // Cinder's order, not the word's
const CY_DESC={M:'the hooked stave', A:'the tent', S:'the lightning',
               O:'the square eye', N:'the twin staves'};
/* glyph strokes in a 0..1 box — deliberately NOT letter-shaped */
const GLYPHS={
  M:[[0.5,0.95,0.5,0.05],[0.5,0.05,0.85,0.3],[0.85,0.3,0.6,0.45]],
  A:[[0.5,0.05,0.15,0.55],[0.5,0.05,0.85,0.55],[0.15,0.55,0.85,0.55],[0.5,0.55,0.5,0.95]],
  S:[[0.8,0.1,0.2,0.4],[0.2,0.4,0.8,0.6],[0.8,0.6,0.2,0.9]],
  O:[[0.2,0.2,0.8,0.2],[0.8,0.2,0.8,0.8],[0.8,0.8,0.2,0.8],[0.2,0.8,0.2,0.2],[0.2,0.2,0.5,0.5]],
  N:[[0.25,0.9,0.25,0.1],[0.75,0.9,0.75,0.1],[0.25,0.5,0.75,0.5]]
};
const CY_ORD=['first','second','third','fourth','fifth'];
let cyOpen=false, cySel=0, cyPick=[0,0,0,0,0], cyNavLatch=false;
let cinderTaught=false;                           // one glyph per visit, screen-local
function cyKnownSet(){ return new Set(CY_TEACH.slice(0, flags.cyKnown||0)); }
function drawGlyph(letter,x,y,s,color,lw){
  const segs=GLYPHS[letter]; if(!segs) return;
  ctx.strokeStyle=color; ctx.lineWidth=lw||2; ctx.lineCap='round'; ctx.lineJoin='round';
  for(const [x1,y1,x2,y2] of segs){
    ctx.beginPath(); ctx.moveTo(x+(x1-0.5)*s, y+(y1-0.5)*s); ctx.lineTo(x+(x2-0.5)*s, y+(y2-0.5)*s); ctx.stroke();
  }
}
function cypherInput(){
  const lt=held['ArrowLeft'], rt=held['ArrowRight'], up=held['ArrowUp'], dn=held['ArrowDown'];
  if((lt||rt||up||dn) && !cyNavLatch){
    cyNavLatch=true;
    if(lt) cySel=(cySel+4)%5;
    else if(rt) cySel=(cySel+1)%5;
    else if(up) cyPick[cySel]=(cyPick[cySel]+25)%26;
    else if(dn) cyPick[cySel]=(cyPick[cySel]+1)%26;
    sfx.pick&&sfx.pick();
  }
  if(!lt&&!rt&&!up&&!dn) cyNavLatch=false;
  if((held[' ']||held['Enter']) && !PL.actLatch){
    PL.actLatch=true;
    const word=cyPick.map(i=>String.fromCharCode(65+i)).join('');
    if(word===CY_WORD){
      cyOpen=false; flags.cypherSolved=true;
      PL.maxhp+=2; PL.hp=PL.maxhp;
      addFloat(PL.x, PL.y-34, 'MAX HEART UP!', '#ff6a6a');
      for(let i=0;i<10;i++) dropPickup(PL.x, PL.y-10, 'gold');
      toast('The seam parts with a breath of old air. MASON — his own word, cut before he ever raised a wall. Inside: a soldier\'s heart, still warm.');
      sfx.build&&sfx.build(); sfx.heart&&sfx.heart();

    } else {

      sfx.denied&&sfx.denied();
    }
  }
  if(!held[' ']&&!held['Enter']) PL.actLatch=false;
  if(held['Escape']) cyOpen=false;
}
function drawCypher(){
  const PW=380, PH2=230, x=RW/2-PW/2, y=HUD+52;

/* ---------------- THE GRATITUDE GARDEN ----------------
   flags.garden = [{m:message, h:hash32, p:playFrames-at-planting}] — persists
   via the flags spread in the save. Everything about a flower (variety,
   color, petal count, jitter) derives from the hash of the words; SIZE
   derives from how much was written. Same thanks, same flower, forever. */
let gardenOpen=false;
const GARDEN={c:11, r:9, cols:6, rows:2, cap:24};
function hash32(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
const FLOWER_KINDS=['daisy','tulip','rose','bellflower','sunflower','star-lily'];
const FLOWER_COLS =['#e87a96','#e8c15a','#b088e0','#f0eede','#ff8a5a','#7ab8e8','#d84a44','#e26ad8'];
const FLOWER_COLNAMES=['rose-pink','gold','violet','white','ember','sky-blue','deep red','magenta'];
function flowerSpec(g){
  const h=g.h;
  return {
    kind: h%6,
    col:  (h>>>3)%8,
    petals: 5+((h>>>6)%4),
    size: Math.min(1.5, 0.7+g.m.length/60) + ((h>>>12)%10)/50,
    jx: ((h>>>16)%11)-5, jy: ((h>>>20)%7)-3
  };
}
function flowerPos(i, spec){
  const ti=i%12;
  const x=(GARDEN.c+(ti%GARDEN.cols))*T+16 + (i>=12?7:-3) + spec.jx;
  const y=(GARDEN.r+((ti/GARDEN.cols)|0))*T+26 + spec.jy;
  return {x,y};
}
function openGarden(){
  gardenOpen=true;

}
function closeGarden(){

}
function plantGratitude(msg){
  msg=msg.trim();
  if(!msg){ closeGarden(); return; }
  flags.garden=flags.garden||[];
  const g={m:msg, h:hash32(msg), p:playFrames};
  flags.garden.push(g);

  puff(pos.x, pos.y-6, FLOWER_COLS[sp.col], 7); sfx.heart();
  toast('Your thanks takes root — a '+FLOWER_COLNAMES[sp.col]+' '+FLOWER_KINDS[sp.kind]+' unfurls.');

document.addEventListener('DOMContentLoaded',()=>{

/* ---------------- THE WISHING WELL (THREAD gold sink) ----------------
   Lifetime gold tossed is flags.wellTotal. Thresholds all end in nine —
   the number recurs quietly, never remarked upon. At 999 the water lets
   go and the well becomes the way down to THE WELL BOTTOM (screen 16). */
let wellOpen=false, wellSel=0;
const wellFx={frogs:0, bread:0, star:0};
function wellItems(){
  const tot=flags.wellTotal||0;
  if(tot>=999) return [
    {name:'CLIMB DOWN', desc:'the water is gone. the rope is not.', act:'climb'},
    {name:'LEAVE', desc:'', act:'leave'}];
  return [
    {name:'TOSS 9 GOLD',      amt:9},
    {name:'TOSS 99 GOLD',     amt:99},
    {name:'TOSS EVERYTHING',  amt:res.gold, all:true},
    {name:'LEAVE', act:'leave'}];
}
function wellToss(amt){
  amt=Math.min(amt, res.gold);
  if(amt<=0){ toast('Your purse is empty. The well waits. It is good at that.'); sfx.denied(); return; }
  const prev=flags.wellTotal||0;
  res.gold-=amt; flags.wellTotal=prev+amt;
  sfx.coin(); addFloat(PL.x, PL.y-30, '-'+amt+' gold', '#ffd23f');
  puff(5*T+16, 9*T+10, '#8ab4d8', 6);
  const now=flags.wellTotal;
  const cross=n=> prev<n && now>=n;
  if(cross(9))   toast('The well accepts. Far below, something exhales.');
  if(cross(99)){ wellFx.frogs=900; toast('Frogs you have never seen before climb the well stones and begin to sing.'); }
  if(cross(299)){ wellFx.bread=480; toast('The clouds over the square smell, briefly, like a bakery.'); }
  if(cross(599)){ flags.wellStar=true; wellFx.star=140;
    toast('Somewhere far off, a light lets go of the sky. It fell past the horizon — or further down than that.'); }
  if(cross(899)){ flags.wellGlow=true;
    toast('The water is glowing now. It does not ripple. It remembers.'); }
  if(cross(999)){ sfx.win();
    toast('The well drinks the last coin — and the water lets go. Far below: stone, a rope, and a light that was waiting. SPACE at the well to climb down.'); }
  saveGame();
}
function wellInput(){
  const n=wellItems().length;
  const up=held['ArrowUp']||held['w']||held['W'], dn=held['ArrowDown']||held['s']||held['S'];
  if(up && !shopNavLatch){ wellSel=(wellSel+n-1)%n; shopNavLatch=true; }
  else if(dn && !shopNavLatch){ wellSel=(wellSel+1)%n; shopNavLatch=true; }
  else if(!up && !dn) shopNavLatch=false;
  if(held[' '] && !PL.actLatch){
    PL.actLatch=true;
    const it=wellItems()[Math.min(wellSel, n-1)];

    else if(it.act==='climb'){

}
