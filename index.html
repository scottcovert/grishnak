    const tr=f.anim||0;
    ctx.strokeStyle=C('#3f2c18'); ctx.lineWidth=3; ctx.lineCap='round';
    for(let i=0;i<2;i++){                                  // four short sturdy legs
      const sw=Math.sin(tr+i*Math.PI)*1.9;
      ctx.beginPath(); ctx.moveTo(-8+i*3.4,-7); ctx.lineTo(-8+i*3.4+sw,-0.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo( 5+i*3.4,-7); ctx.lineTo( 5+i*3.4-sw,-0.5); ctx.stroke();
    }
    const bg=ctx.createLinearGradient(0,-18,0,-5);
    bg.addColorStop(0, C('#7d5a38')); bg.addColorStop(1, C('#4f3820'));
    ctx.beginPath();                                       // the wedge: hump high, hips low
    ctx.moveTo(-13,-7);
    ctx.quadraticCurveTo(-14.5,-11.5, -11,-13);            // small rounded rump
    ctx.quadraticCurveTo(-3,-18.5, 4,-17.5);               // up the crest to the hump
    ctx.quadraticCurveTo(9,-16.5, 12,-13);                 // forehead slopes down
    ctx.lineTo(17.5,-9.4);                                 // long head drops to the snout
    ctx.lineTo(17.5,-6.6);
    ctx.quadraticCurveTo(10,-4.8, 2,-5);                   // jaw and belly
    ctx.quadraticCurveTo(-8,-5.2, -13,-7);
    ctx.closePath(); outlined(bg);
    ctx.strokeStyle=C('#38260f'); ctx.lineWidth=1.5; ctx.lineCap='round';
    for(let i=0;i<5;i++){                                  // the bristle mane on the crest
      const bx=-9+i*4;
      ctx.beginPath(); ctx.moveTo(bx,-13.5-i*0.9+(i>2?i*0.5:0)); ctx.lineTo(bx+1.2,-16.5-i*0.7+(i>2?i*0.9:0)); ctx.stroke();
    }
    ctx.fillStyle=C('#c9a191');                            // snout disc, nostrils forward
    ctx.beginPath(); ctx.ellipse(18,-8,1.9,2.5,0,0,7); ctx.fill();
    ctx.strokeStyle='rgba(40,20,10,.55)'; ctx.lineWidth=0.8; ctx.stroke();
    ctx.fillStyle='#3a1f12';
    ctx.beginPath(); ctx.arc(18.2,-8.8,0.5,0,7); ctx.arc(18.2,-7.2,0.5,0,7); ctx.fill();
    ctx.strokeStyle=C('#f2ede0'); ctx.lineWidth=1.9;       // tusks curl UP past the snout
    ctx.beginPath(); ctx.moveTo(14.5,-5.6); ctx.quadraticCurveTo(17.5,-5.2, 18.2,-8.2); ctx.stroke();
    ctx.strokeStyle=C('#d8d2c2'); ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(12.5,-5.8); ctx.quadraticCurveTo(15.5,-5.6, 16,-8.6); ctx.stroke();
    ctx.fillStyle=C('#5d4326');                            // leaf ear, dark inner
    ctx.beginPath(); ctx.moveTo(6,-15.5); ctx.quadraticCurveTo(8,-20, 10.5,-17.5); ctx.quadraticCurveTo(10,-15, 8,-14); ctx.closePath(); ctx.fill();
    ctx.fillStyle=C('#33210f');
    ctx.beginPath(); ctx.moveTo(7.4,-16); ctx.quadraticCurveTo(8.4,-18.2, 9.6,-17); ctx.quadraticCurveTo(9.2,-15.6, 8.2,-15.2); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#14100c';                               // small mean eye, brow line
    ctx.beginPath(); ctx.arc(12.2,-11.6,1,0,7); ctx.fill();
    ctx.strokeStyle=C('#38260f'); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(10.6,-13); ctx.lineTo(13.6,-12.4); ctx.stroke();
    ctx.strokeStyle=C('#4f3820'); ctx.lineWidth=1.6;       // wisp of tail with a tuft
    ctx.beginPath(); ctx.moveTo(-13,-11); ctx.quadraticCurveTo(-16,-10+wob, -15.5,-7+wob); ctx.stroke();
    ctx.fillStyle=C('#38260f'); ctx.beginPath(); ctx.arc(-15.5,-6.5+wob,1.1,0,7); ctx.fill();
    ctx.restore();
  } else if(f.t==='bandit'){
    const bg=ctx.createLinearGradient(0,y-24,0,y);
    bg.addColorStop(0, fl?'#fff':'#4a4a56'); bg.addColorStop(1, fl?'#fff':'#2c2c34');
    ctx.beginPath();
    ctx.moveTo(x-8,y); ctx.quadraticCurveTo(x-9,y-18,x-4,y-22);
    ctx.lineTo(x+4,y-22); ctx.quadraticCurveTo(x+9,y-18,x+8,y);
    ctx.closePath(); outlined(bg);
    ctx.fillStyle= fl?'#fff':'#22222a';   // hood
    ctx.beginPath(); ctx.arc(x,y-24,6.5,Math.PI*0.95,Math.PI*2.05); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#0c0c10'; ctx.beginPath(); ctx.ellipse(x,y-23,4.5,3,0,0,7); ctx.fill();
    ctx.fillStyle='#e04040'; ctx.beginPath(); ctx.arc(x-2,y-23.5,1.1,0,7); ctx.arc(x+2,y-23.5,1.1,0,7); ctx.fill();
    ctx.strokeStyle='#c9c4ba'; ctx.lineWidth=2.2; ctx.lineCap='round';   // dagger
    ctx.beginPath(); ctx.moveTo(x+9,y-12); ctx.lineTo(x+15,y-15); ctx.stroke();
    ctx.strokeStyle='#6d4e24'; ctx.beginPath(); ctx.moveTo(x+8,y-11.5); ctx.lineTo(x+10,y-12.5); ctx.stroke();
  } else if(f.t==='scorp'){
    ctx.fillStyle= fl?'#fff':'#993d2b';
    ctx.beginPath(); ctx.ellipse(x,y-5,9,5,0,0,7); outlined(fl?'#fff':'#993d2b');
    for(const s of [-1,1]){   // claws
      ctx.beginPath(); ctx.arc(x+s*11,y-7,3.4,0,7); outlined(fl?'#fff':'#7d3222');
    }
    ctx.strokeStyle= fl?'#fff':'#7d3222'; ctx.lineWidth=2.6; ctx.lineCap='round';  // tail
    const tw=Math.sin(f.wt*0.3)*2;
    ctx.beginPath(); ctx.moveTo(x,y-9); ctx.quadraticCurveTo(x+2,y-16+tw, x-3,y-17+tw); ctx.stroke();
    ctx.fillStyle='#3a1810'; ctx.beginPath(); ctx.arc(x-4,y-17+tw,1.6,0,7); ctx.fill();
    ctx.fillStyle='#0f0f14'; ctx.beginPath(); ctx.arc(x-3,y-7,1,0,7); ctx.arc(x+3,y-7,1,0,7); ctx.fill();
  } else if(f.t==='boss'){
    const chg=f.dash>0;
    // cape
    ctx.fillStyle= fl?'#fff':'#8a2626';
    ctx.beginPath(); ctx.moveTo(x-9,y-26); ctx.quadraticCurveTo(x-18,y-14+wob,x-13,y-1);
    ctx.lineTo(x-7,y-4); ctx.closePath(); ctx.fill();
    // armor body
    const bg=ctx.createLinearGradient(0,y-30,0,y);
    bg.addColorStop(0, fl?'#fff': chg?'#6e2222':'#3c3c48'); bg.addColorStop(1, fl?'#fff': chg?'#4a1414':'#22222a');
    ctx.beginPath();
    ctx.moveTo(x-11,y); ctx.quadraticCurveTo(x-13,y-22,x-8,y-28);
    ctx.lineTo(x+8,y-28); ctx.quadraticCurveTo(x+13,y-22,x+11,y);
    ctx.closePath(); outlined(bg);
    ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.lineWidth=1.4;   // armor lines
    ctx.beginPath(); ctx.moveTo(x-8,y-18); ctx.lineTo(x+8,y-18); ctx.moveTo(x-9,y-10); ctx.lineTo(x+9,y-10); ctx.stroke();
    // helm
    const hg=ctx.createLinearGradient(0,y-38,0,y-26);
    hg.addColorStop(0,'#5c5c6c'); hg.addColorStop(1,'#3c3c48');
    ctx.fillStyle= fl?'#fff':hg;
    rr(ctx,x-8,y-38,16,11,3); ctx.fill();
    ctx.strokeStyle='rgba(16,20,12,.5)'; ctx.lineWidth=1.4; ctx.stroke();
    ctx.strokeStyle='#d5d0c6'; ctx.lineWidth=3; ctx.lineCap='round';   // horns
    ctx.beginPath(); ctx.moveTo(x-8,y-35); ctx.quadraticCurveTo(x-13,y-38,x-13,y-44); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+8,y-35); ctx.quadraticCurveTo(x+13,y-38,x+13,y-44); ctx.stroke();
    ctx.fillStyle= chg?'#ff5030':'#e03030';
    ctx.beginPath(); ctx.arc(x-3.5,y-33,1.6,0,7); ctx.arc(x+3.5,y-33,1.6,0,7); ctx.fill();
    // greatsword
    const sg=ctx.createLinearGradient(x+12,0,x+17,0);
    sg.addColorStop(0,'#c9c4ba'); sg.addColorStop(1,'#8a857a');
    ctx.fillStyle=sg;
    ctx.beginPath(); ctx.moveTo(x+12,y-26); ctx.lineTo(x+17,y-26); ctx.lineTo(x+14.5,y-2); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#6d4e24'; rr(ctx,x+10,y-28,9,3.5,1.5); ctx.fill();

}
function drawPhaseIn(){
  /* the materialise — bright columns wheel in and tighten onto the spot */
  const x=PL.x, y=PL.y+HUD-14;
  const p=1-phaseT/64;
  const COLS4=['#9fd8ff','#fff6c8','#ff9fd0','#b8ffd0'];
  for(let i=0;i<14;i++){
    const a=i/14*Math.PI*2 + phaseT*0.13;
    const rr2=(1-p)*46+4;
    const lx=x+Math.cos(a)*rr2;
    const hgt=10+((i*37)%17)*(1-p*0.5);
    ctx.strokeStyle=COLS4[i%4];
    ctx.globalAlpha=Math.min(1,(1-p)*1.4)*0.9;
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(lx, y-hgt); ctx.lineTo(lx, y+hgt); ctx.stroke();
  }
  ctx.globalAlpha=Math.min(1,(1-p)*1.2);
  ctx.strokeStyle='#eaf6ff'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(x,y,p*40+6,0,7); ctx.stroke();
  ctx.globalAlpha=1;
}
function drawPlayerSprite(){
  if(phaseT>44){ drawPhaseIn(); return; }    // still assembling — sparks before flesh
  const x=PL.x, y=PL.y+HUD;
  if(PL.iframes>0 && (state==='play'||state==='maze')) ctx.globalAlpha=0.55;
  const bob = Math.abs(Math.sin(PL.walkT))*2;
  const ft = footOffsets();          // world-anchored; the fix for the moonwalk
  // legs, ending in boots
  ctx.strokeStyle='#5c4320'; ctx.lineWidth=3.6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x-3,y-8); ctx.lineTo(x-3+ft.a,y-0.5-ft.la); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+3,y-8); ctx.lineTo(x+3+ft.b,y-0.5-ft.lb); ctx.stroke();
  ctx.fillStyle='#3a2a14';
  ctx.beginPath(); ctx.ellipse(x-3+ft.a+0.6,y-1-ft.la,2.7,1.8,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+3+ft.b+0.6,y-1-ft.lb,2.7,1.8,0,0,7); ctx.fill();
  // tunic
  const bg=ctx.createLinearGradient(0,y-20,0,y-6);
  bg.addColorStop(0,'#4a86f2'); bg.addColorStop(1,'#2352b8');
  ctx.beginPath();
  ctx.moveTo(x-7,y-6+bob*0.3); ctx.quadraticCurveTo(x-8,y-18+bob*0.3,x-5,y-20+bob*0.3);
  ctx.lineTo(x+5,y-20+bob*0.3); ctx.quadraticCurveTo(x+8,y-18+bob*0.3,x+7,y-6+bob*0.3);
  ctx.closePath(); outlined(bg);
  ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=1.1;   // shoulder catch-light
  ctx.beginPath(); ctx.moveTo(x-4.5,y-19+bob*0.3); ctx.lineTo(x+2,y-19.4+bob*0.3); ctx.stroke();
  ctx.strokeStyle='#5a3f1e'; ctx.lineWidth=1.6;                 // baldric strap, shoulder to hip
  ctx.beginPath();
  if(PL.fx>=0){ ctx.moveTo(x-4,y-18.5+bob*0.3); ctx.lineTo(x+6,y-11+bob*0.3); }
  else        { ctx.moveTo(x+4,y-18.5+bob*0.3); ctx.lineTo(x-6,y-11+bob*0.3); }
  ctx.stroke();
  ctx.strokeStyle='#3a2c16'; ctx.lineWidth=2;                   // leather belt + buckle
  ctx.beginPath(); ctx.moveTo(x-6.5,y-10+bob*0.3); ctx.lineTo(x+6.5,y-10+bob*0.3); ctx.stroke();
  ctx.fillStyle='#e8c15a'; ctx.fillRect(x-1.6,y-11.4+bob*0.3,3.2,2.6);
  ctx.strokeStyle='rgba(60,40,10,.7)'; ctx.lineWidth=0.8; ctx.strokeRect(x-1.6,y-11.4+bob*0.3,3.2,2.6);
  // arms: the free arm swings with the stride; the sword arm rests at the hilt
  {
    const swA=Math.sin(PL.walkT)*2.2;
    const fs = PL.fx>=0? 1:-1;                                  // sword side
    ctx.strokeStyle='#2a55b5'; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x-6*fs,y-17+bob*0.3); ctx.lineTo(x-7*fs+swA,y-9+bob*0.3); ctx.stroke();
    ctx.fillStyle='#eab98a';
    ctx.beginPath(); ctx.arc(x-7*fs+swA,y-8.6+bob*0.3,1.7,0,7); ctx.fill();
    if(PL.swing<=0){                                            // hand on the hilt when at rest
      ctx.strokeStyle='#2a55b5'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(x+6*fs,y-17+bob*0.3); ctx.lineTo(x+8*fs,y-12); ctx.stroke();
      ctx.fillStyle='#eab98a';
      ctx.beginPath(); ctx.arc(x+8*fs,y-11.8,1.7,0,7); ctx.fill();
    }
  }
  // head
  ctx.beginPath(); ctx.arc(x,y-25+bob*0.3,6.5,0,7); outlined('#eab98a');
  // an ear on the trailing side (both when facing the player)
  ctx.fillStyle='#dfa878';
  if(PL.fx>0){ ctx.beginPath(); ctx.arc(x-6,y-25+bob*0.3,1.6,0,7); ctx.fill(); }
  else if(PL.fx<0){ ctx.beginPath(); ctx.arc(x+6,y-25+bob*0.3,1.6,0,7); ctx.fill(); }
  else { ctx.beginPath(); ctx.arc(x-6.2,y-25+bob*0.3,1.5,0,7); ctx.arc(x+6.2,y-25+bob*0.3,1.5,0,7); ctx.fill(); }
  // hair fringe under the cap
  ctx.fillStyle='#6b4a26';
  ctx.beginPath();
  ctx.moveTo(x-5.6,y-27+bob*0.3);
  ctx.quadraticCurveTo(x-2,y-25.6+bob*0.3, x+2,y-26.8+bob*0.3);
  ctx.quadraticCurveTo(x+4.5,y-27.6+bob*0.3, x+5.6,y-27+bob*0.3);
  ctx.quadraticCurveTo(x,y-30+bob*0.3, x-5.6,y-27+bob*0.3);
  ctx.closePath(); ctx.fill();
  // eyes by facing (none when facing up/away)
  ctx.fillStyle='#1a1a20';
  if(PL.fx>0) ctx.fillRect(x+2,y-26+bob*0.3,2,2);
  else if(PL.fx<0) ctx.fillRect(x-4,y-26+bob*0.3,2,2);
  else if(PL.fy>=0){ ctx.beginPath(); ctx.arc(x-2.5,y-25+bob*0.3,1.1,0,7); ctx.arc(x+2.5,y-25+bob*0.3,1.1,0,7); ctx.fill(); }
  // red cap
  const cg=ctx.createLinearGradient(0,y-33,0,y-27);
  cg.addColorStop(0,'#f25050'); cg.addColorStop(1,'#c22828');
  ctx.fillStyle=cg;
  ctx.beginPath(); ctx.arc(x,y-28+bob*0.3,6.8,Math.PI*0.95,Math.PI*2.05); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(90,15,15,.6)'; ctx.lineWidth=1.2; ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=1;      // cap seam highlight
  ctx.beginPath(); ctx.arc(x,y-28+bob*0.3,5,Math.PI*1.15,Math.PI*1.7); ctx.stroke();
  ctx.fillStyle='#f2d060';                                      // the button on top
  ctx.beginPath(); ctx.arc(x,y-34.6+bob*0.3,1.2,0,7); ctx.fill();
  ctx.fillStyle='#c22828';   // brim toward facing
  const bx = PL.fx>=0? x+1 : x-9;
  rr(ctx,bx,y-28+bob*0.3,8,2.6,1.3); ctx.fill();
  // sword
  const ang=Math.atan2(PL.fyn(),PL.fxn());
  if(PL.swing>0){
    const p=1-PL.swing/14;
    const a=ang - 1.2 + p*2.4;
    ctx.strokeStyle='rgba(240,244,255,.28)'; ctx.lineWidth=9; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(x,y-12,19,a-0.8,a+0.1); ctx.stroke();
    const gb=ctx.createLinearGradient(x,y-12,x+Math.cos(a)*26,y-12+Math.sin(a)*26);
    gb.addColorStop(0,'#f5f5fa'); gb.addColorStop(1,'#b8bdc9');
    ctx.strokeStyle=gb; ctx.lineWidth=3.4;
    ctx.beginPath(); ctx.moveTo(x+Math.cos(a)*7, y-12+Math.sin(a)*7);
    ctx.lineTo(x+Math.cos(a)*26, y-12+Math.sin(a)*26); ctx.stroke();
    ctx.strokeStyle='#6d4e24'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(x+Math.cos(a)*4, y-12+Math.sin(a)*4);
    ctx.lineTo(x+Math.cos(a)*8, y-12+Math.sin(a)*8); ctx.stroke();
  } else {
    const sx = PL.fx>=0? x+8 : x-8;
    ctx.strokeStyle='#d5d0c6'; ctx.lineWidth=2.6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(sx,y-13); ctx.lineTo(sx,y-4); ctx.stroke();
    ctx.strokeStyle='#4a3018'; ctx.lineWidth=3.4;   // the scabbard holds the lower half
    ctx.beginPath(); ctx.moveTo(sx,y-7); ctx.lineTo(sx+(PL.fx>=0?1:-1),y-2); ctx.stroke();
    ctx.strokeStyle='#6d4e24'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(sx-2.5,y-14); ctx.lineTo(sx+2.5,y-14); ctx.stroke();
  }
  ctx.globalAlpha=1;
  if(phaseT>0) drawPhaseIn();                // the last sparks fade over the walked-in hero
}

/* ---------------- VIEW TRANSITION (plan view <-> section view) ---------------- */
/* Generic: any "layer" module (CaveLayer, MazeLayer, ...) exposing {enter,exitDone,draw} can ride this. */
let trans=null;
/* Where each layer was entered FROM, so it can put you back there.
   Layers used to hardcode their exit state, which broke any screen
   reachable by two routes: JUNGLE HUNT entered from the arcade would
   exit into 'cave' — a layer that was never entered — leaving a black
   screen with no player and no menu. The entry point is the truth. */
const layerReturn={};
function startLayerTrans(dir, layer, enterState, outState){
  const snap=document.createElement('canvas');
  snap.width=cv.width; snap.height=cv.height;
  snap.getContext('2d').drawImage(cv,0,0);
  const es=enterState||'cave';
  let back=outState||'play';
  if(dir==='in'){
    // remember the screen we're leaving, but never a transition state
    if(state!=='cavetrans') layerReturn[es]=state;
  } else if(dir==='out'){
    if(layerReturn[es]) back=layerReturn[es];
  }
  trans={dir, t:0, snap, switched:false, layer, enterState:es, outState:back};
  state='cavetrans';
  beep(150,35,1.1,'sawtooth',0.18); beep(90,50,1.1,'triangle',0.12);
}

function startMazeTrans(dir){ startLayerTrans(dir, window.MazeLayer, 'maze'); }

function startRiverTrans(dir){ startLayerTrans(dir, window.RiverLayer, 'river'); }
function startWarp(fn){
  const snap=document.createElement('canvas');
  snap.width=cv.width; snap.height=cv.height;
  snap.getContext('2d').drawImage(cv,0,0);
  trans={dir:'warp', t:0, snap, switched:false, fn};
  state='cavetrans';
  beep(220,660,0.5,'triangle',0.12);
}
function updateCaveTrans(){
  trans.t+=0.024;
  if(trans.t>=0.5 && !trans.switched){
    trans.switched=true;
    if(trans.dir==='in') trans.layer.enter();
    else if(trans.dir==='out') trans.layer.exitDone();
    else if(trans.fn) trans.fn();
  }
  if(trans.t>=1){ state = trans.dir==='in' ? trans.enterState : (trans.outState||'play'); trans=null; }
}
function drawCaveTrans(){
  const t=trans.t, H2=(RH+HUD)/2;
  if(t<0.5){
    const s=Math.max(0.02,1-t*2);
    ctx.save(); ctx.translate(0,H2*(1-s)); ctx.scale(1,s);
    ctx.drawImage(trans.snap,0,0,RW,RH+HUD);
    ctx.restore();
  } else if(trans.switched){
    const p=Math.min(1,(t-0.5)*2);
    ctx.save(); ctx.translate(0,H2*(1-p)); ctx.scale(1,Math.max(0.02,p));
    if(trans.dir==='in'){ trans.layer.draw(); }
    else if(trans.outState==='cave' && window.CaveLayer){ CaveLayer.draw(); }
    else { drawWorld(); drawHUDbar(); }
    ctx.restore();
  }
  const glow=Math.max(0,0.9-Math.abs(t-0.5)*1.9);
  ctx.fillStyle='rgba(255,225,150,'+glow.toFixed(3)+')';
  ctx.fillRect(0,H2-2,RW,4);
}

function drawGratBed(d){
  const x=d.x, y=d.y+HUD, w=GARDEN.cols*T, h=GARDEN.rows*T;
  ctx.fillStyle='#4a3826';                                       // tilled soil
  rr(ctx, x-4, y-6, w+8, h+8, 8); ctx.fill();
  ctx.fillStyle='#3c2e1e';
  for(let r=0;r<GARDEN.rows;r++)
    for(let f=0;f<4;f++) ctx.fillRect(x, y+r*T+4+f*7, w, 2);     // furrows
  ctx.strokeStyle='#5c4a32'; ctx.lineWidth=2;
  rr(ctx, x-4, y-6, w+8, h+8, 8); ctx.stroke();
  // the little sign, left end
  ctx.fillStyle='#6a5638'; ctx.fillRect(x+2, y-22, 3, 18);
  ctx.fillStyle='#8a7048'; rr(ctx, x-6, y-30, 22, 12, 2); ctx.fill();
  drawHeartShape(x+5, y-24, 3.5, '#e87a96');
  const near = curScr===5 && PL.x>x-40 && PL.x<x+w+40 && PL.y>d.y-40 && PL.y<d.y+h+40;
  if(near){
    const n=(flags.garden||[]).length;
    drawLabel('GRATITUDE GARDEN — '+n+' thanks', x+w/2, y-34, '#a0d888');
    drawLabel('[SPACE] '+(n>=GARDEN.cap?'walk among them':'plant one'), x+w/2, y-22, '#ffffff');
  }
}
function drawGratFlower(x, fy, sp, gt){
  const y=fy+HUD;
  const s=sp.size*(0.25+0.75*gt);                                // grow-in
  const col=FLOWER_COLS[sp.col];
  const sway=Math.sin(playFrames*0.03 + x*0.31)*2*s;
  const stemH=(16+sp.petals)*s;
  const hx=x+sway, hy=y-stemH;                                   // flower head
  ctx.strokeStyle='#4e7d33'; ctx.lineWidth=1.8*s; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo(x+sway*0.4, y-stemH*0.6, hx, hy); ctx.stroke();
  ctx.fillStyle='#5c8f3c';                                       // one leaf
  ctx.beginPath(); ctx.ellipse(x+3*s, y-stemH*0.45, 4*s, 1.6*s, -0.5, 0, 7); ctx.fill();
  const K=FLOWER_KINDS[sp.kind];
  if(K==='daisy'){
    ctx.fillStyle=col;
    for(let p=0;p<sp.petals+3;p++){
      const a=p/(sp.petals+3)*Math.PI*2;
      ctx.beginPath(); ctx.ellipse(hx+Math.cos(a)*4.6*s, hy+Math.sin(a)*4.6*s, 3.4*s, 1.7*s, a, 0, 7); ctx.fill();
    }
    ctx.fillStyle='#e8b830'; ctx.beginPath(); ctx.arc(hx,hy,2.6*s,0,7); ctx.fill();
  } else if(K==='tulip'){
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.moveTo(hx-4.5*s,hy+3*s);
    ctx.quadraticCurveTo(hx-5.5*s,hy-5*s, hx-2*s,hy-4*s);
    ctx.quadraticCurveTo(hx,hy-7*s, hx+2*s,hy-4*s);
    ctx.quadraticCurveTo(hx+5.5*s,hy-5*s, hx+4.5*s,hy+3*s);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.18)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(hx,hy+2*s); ctx.lineTo(hx,hy-4*s); ctx.stroke();
  } else if(K==='rose'){
    for(let ring=3;ring>=1;ring--){
      ctx.fillStyle=ring===1? '#fff' : col;
      ctx.globalAlpha= ring===1? 0.7 : 1;
      ctx.beginPath(); ctx.arc(hx,hy,ring*1.9*s,0,7); ctx.fill();
      ctx.globalAlpha=1;
      ctx.strokeStyle='rgba(60,20,30,.35)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(hx,hy,ring*1.9*s, ring, ring+4.4); ctx.stroke();
    }
  } else if(K==='bellflower'){
    ctx.fillStyle=col;
    for(let b=0;b<3;b++){
      const bx=hx+(b-1)*4.5*s, by=hy+b%2*2*s;
      ctx.beginPath(); ctx.moveTo(bx-2.6*s,by); ctx.quadraticCurveTo(bx,by-4.5*s, bx+2.6*s,by);
      ctx.lineTo(bx+2*s,by+3.5*s); ctx.lineTo(bx-2*s,by+3.5*s); ctx.closePath(); ctx.fill();
    }
  } else if(K==='sunflower'){
    ctx.fillStyle=col;
    for(let p=0;p<sp.petals+7;p++){
      const a=p/(sp.petals+7)*Math.PI*2;
      ctx.beginPath(); ctx.ellipse(hx+Math.cos(a)*5.4*s, hy+Math.sin(a)*5.4*s, 3.6*s, 1.4*s, a, 0, 7); ctx.fill();
    }
    ctx.fillStyle='#5c4222'; ctx.beginPath(); ctx.arc(hx,hy,3.6*s,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,220,120,.35)'; ctx.beginPath(); ctx.arc(hx-1*s,hy-1*s,1.6*s,0,7); ctx.fill();
  } else {                                                       // star-lily
    ctx.fillStyle=col;
    ctx.beginPath();
    for(let p=0;p<12;p++){
      const a=p*Math.PI/6, rr2=(p%2? 2.2 : 6.2)*s;
      ctx[p?'lineTo':'moveTo'](hx+Math.cos(a)*rr2, hy+Math.sin(a)*rr2);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff'; ctx.globalAlpha=0.6;
    ctx.beginPath(); ctx.arc(hx,hy,1.8*s,0,7); ctx.fill(); ctx.globalAlpha=1;
  }
}

  ctx.strokeStyle='#4a3a24'; ctx.lineWidth=1.4;

/* ---- VILLAGE FIELDS art ----
   EVERY FUNCTION IN THIS SECTION MUST ADD HUD TO ITS Y. The whole batch was
   written without it, and because the pieces were consistent WITH EACH OTHER
   the field looked internally sane — corn, trough, ducks and critters all
   agreed among themselves, 48px (1.5 tiles) above the ground truth that the
   player, the collision grid and the shadow pass live on. That one omission
   was BOTH of Scott's 2026-08-18 reports: critters "floating several feet up"
   (their sprite hung 46px above the shadow, which was in the right place all
   along), and crops that "don't match up with the actual location the player
   needs to be while hacking at them" — you had to stand 1.5 tiles below the
   corn you could see, because the corn you could see was drawn 1.5 tiles
   above the tile it logically occupied. The swing itself was already exact;
   it was the PICTURE that lied. test_critters.js now runs these functions
   against a recording canvas and measures painted feet against the shadow. */
function drawCorn(x, base, shake){
  base+=HUD;                       // callers pass world y; the picture is 48 lower
  const sw = Math.sin(playFrames*0.045 + x*0.13)*1.6 + (shake>0? Math.sin(playFrames*1.2)*2.5 : 0);
  // flat contact shading instead of the round shadow pass
  ctx.fillStyle='rgba(40,60,20,.18)';
  ctx.beginPath(); ctx.ellipse(x, base+1, 14, 4, 0, 0, 7); ctx.fill();
  // leafy base clump so each tile reads as a solid hedge, not loose wires
  ctx.fillStyle='#4f7c33'; ctx.beginPath(); ctx.ellipse(x, base-6, 13, 8, 0, 0, 7); ctx.fill();
  /* a SECOND clump higher up (Scott, 2026-08-16: "it looks like there is space
     to walk through"). The dense mass used to stop at the tile's mid-line —
     base-6 with ry 8 covers r*T+16..r*T+32 — so the top half of a corn tile was
     nothing but thin stalks with daylight between them, which reads as ground
     you can walk on. It is solid. The hedge fills its tile now: this one covers
     r*T+5..r*T+21, and between them there is no gap to misread. */
  ctx.fillStyle='#476f2d'; ctx.beginPath(); ctx.ellipse(x, base-17, 12, 8, 0, 0, 7); ctx.fill();
  ctx.fillStyle='#5c8f3c';
  ctx.beginPath(); ctx.ellipse(x-5, base-9, 8, 6, -0.3, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+5, base-9, 8, 6, 0.3, 0, 7); ctx.fill();
  for(let i=-1;i<=1;i++){
    const bx=x+i*8, h=32+((i+2)*7)%8;
    ctx.strokeStyle='#3f6a28'; ctx.lineWidth=3.2;
    ctx.beginPath(); ctx.moveTo(bx, base-4); ctx.quadraticCurveTo(bx+sw*0.4, base-h*0.6, bx+sw, base-h); ctx.stroke();
    ctx.strokeStyle='#66a04a'; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(bx, base-h*0.4); ctx.quadraticCurveTo(bx-8, base-h*0.5, bx-10, base-h*0.34); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx, base-h*0.62); ctx.quadraticCurveTo(bx+8, base-h*0.74, bx+10, base-h*0.58); ctx.stroke();
    if(i===0){ ctx.fillStyle='#e8c15a'; ctx.beginPath(); ctx.ellipse(bx+3, base-h*0.5, 2.6, 5, 0.5, 0, 7); ctx.fill(); }
    ctx.fillStyle='#e3c264';
    ctx.beginPath(); ctx.ellipse(bx+sw, base-h-3, 2.2, 5, sw*0.05, 0, 7); ctx.fill();
  }
}
function drawCornStubble(){
  if(curScr!==9) return;
  for(const [id,resp] of chopped){
    if(!id.startsWith('9:')) continue;
    const parts=id.split(':'); const c=+parts[1], r=+parts[2];
    if(SCREENS[9].map[r][c]!=='C') continue;
    const x=c*T+16, base=r*T+30+HUD;
    ctx.strokeStyle='#8a7a4a'; ctx.lineWidth=2;
    for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(x+i*8,base); ctx.lineTo(x+i*8+1,base-5); ctx.stroke(); }
    const left=resp-playFrames;
    if(left<300){                                  // the regrow telegraph
      ctx.strokeStyle='#7cc45a'; ctx.lineWidth=2;
      const h=6+(300-left)/300*10;
      for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(x+i*8,base); ctx.lineTo(x+i*8-1,base-h); ctx.stroke(); }
    }
  }
}

function drawDuck(dk){
  const fly=dk.st==='fly';
  const y=dk.y+HUD+Math.sin(dk.step*2)*0.8-(fly?6:0);
  const s=dk.kind==='mom'?1.25:dk.kind==='kid'?0.72:1;
  const body=dk.kind==='kid'?'#f4dc6e':'#f2ead8';
  const wing=dk.kind==='kid'?'#e0c052':'#ddd2b8';
  ctx.save(); ctx.translate(dk.x,y); ctx.scale((dk.fx||1)*s,s);
  ctx.fillStyle=body; ctx.beginPath(); ctx.ellipse(0,0,6,4.4,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(4.5,-4.5,3,0,7); ctx.fill();
  ctx.fillStyle='#e8a13c'; ctx.beginPath(); ctx.moveTo(7,-4.8); ctx.lineTo(10.5,-4); ctx.lineTo(7,-3.2); ctx.closePath(); ctx.fill();
  ctx.fillStyle=wing;
  if(fly){ const fl=Math.sin(dk.step*4)*3; ctx.beginPath(); ctx.ellipse(-1,-2-Math.abs(fl),3.6,2.6,-0.5,0,7); ctx.fill(); }
  else { ctx.beginPath(); ctx.ellipse(-1,-0.5,3.4,2.4,0,0,7); ctx.fill(); }
  ctx.fillStyle='#1c1c1c'; ctx.fillRect(4.6,-5.6,1.2,1.2);
  ctx.restore();
}
/* THE PLATYPUS — Lakeside, swimming. Drawn at the waterline with a wake,
   because a platypus waddling on grass is just a small brown animal; the bill
   and the flat paddle tail are what make it unmistakable, and both read best
   in silhouette against water. */
function drawPlatypus(k){
  /* v2 (Scott: "whatevers swimming in the lake"): the old one was an
     unidentifiable brown blob. The fixes are the two things only a platypus
     has — a BIG flat duck-bill and a beaver paddle tail — plus a waterline
     ACROSS the body so it reads as swimming IN the lake, not lying on it. */
  const y=k.y+HUD+Math.sin(k.step*1.6)*0.7;
  ctx.save(); ctx.translate(k.x,y); ctx.scale(k.fx||1,1);
  ctx.strokeStyle='#d2ebff'; ctx.lineWidth=1.3;
  for(let i=0;i<3;i++){                                   // the wake, a spreading V
    const p=((k.step*0.35+i*0.34)%1);
    ctx.globalAlpha=0.32*(1-p);
    ctx.beginPath(); ctx.moveTo(-8-p*14, 1.2-p*3.2); ctx.lineTo(2-p*4, 2.6); ctx.lineTo(-8-p*14, 2.6+p*4.2); ctx.stroke();
  }
  ctx.globalAlpha=1;
  const kick=Math.sin(k.step*2.2)*0.22;                   // the paddle tail, kicking
  ctx.save(); ctx.translate(-11,1); ctx.rotate(kick);
  const tg=ctx.createLinearGradient(0,-2,0,3);
  tg.addColorStop(0,'#5a4430'); tg.addColorStop(1,'#3a2b1c');
  ctx.fillStyle=tg;

  ctx.beginPath(); ctx.moveTo(1.2+pad,2.4); ctx.lineTo(4.8+pad,2.4); ctx.stroke();
  /* the waterline: a translucent band across the lower body says SWIMMING */
  ctx.fillStyle='rgba(84,140,178,.42)';
  ctx.beginPath();
  ctx.moveTo(-20,1.2+Math.sin(k.step*1.1)*0.5);
  for(let wx=-20;wx<=21;wx+=4) ctx.lineTo(wx, 1.2+Math.sin(k.step*1.1+wx*0.5)*0.7);
  ctx.lineTo(21,7); ctx.lineTo(-20,7); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(210,235,255,.5)'; ctx.lineWidth=0.9;   // the line itself glints
  ctx.beginPath();
  for(let wx=-13;wx<=19;wx+=4){

    if(wx===-13) ctx.moveTo(wx,wy); else ctx.lineTo(wx,wy);

/* THE CAPYBARA — Riverlands bank. A loaf on four short legs, and the whole
   character is in the proportions: blunt rectangular head, no visible tail,
   ears too small, and an eye set high and half-shut. Nothing about a capybara
   is in a hurry, so it moves slower than anything else on screen. */
function drawCapybara(k){
  /* v2: the capybara IS its proportions — a brick of an animal with a
     blunt vertical-fronted head, ears too small and too far back, a high
     half-shut eye, and no urgency whatsoever. The old head was a rounded
     box that read "generic rodent"; this one is the brick. */
  const bob=Math.abs(Math.sin(k.step))*0.6;
  ctx.save(); ctx.translate(k.x,k.y+HUD-bob); ctx.scale(k.fx||1,1);
  ctx.strokeStyle='#5f4626'; ctx.lineWidth=3.6; ctx.lineCap='round';
  for(let i=0;i<2;i++){                                   // four short thick legs
    const sw=Math.sin(k.step*2+i*Math.PI)*1.8;
    ctx.beginPath(); ctx.moveTo(-7+i*3.4, 2); ctx.lineTo(-7+i*3.4+sw, 8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo( 5+i*3.4, 2); ctx.lineTo( 5+i*3.4-sw, 8); ctx.stroke();
  }
  ctx.fillStyle='#4a3319';                                // little toes at rest
  ctx.beginPath(); ctx.ellipse(-6,8.2,2,0.9,0,0,7); ctx.ellipse(7,8.2,2,0.9,0,0,7); ctx.fill();
  const g=ctx.createLinearGradient(0,-9,0,5);             // the loaf
  g.addColorStop(0,'#b08a52'); g.addColorStop(1,'#7c5a30');
  ctx.fillStyle=g; rr(ctx,-13,-8,25,13,6); ctx.fill();
  ctx.strokeStyle='#4a3319'; ctx.lineWidth=1.1; ctx.stroke();
  ctx.strokeStyle='rgba(60,40,18,.4)'; ctx.lineWidth=0.8; // coarse fur streaks on the flank
  for(let i=0;i<5;i++){ const bx=-10+i*4.6; ctx.beginPath(); ctx.moveTo(bx,-6.5); ctx.lineTo(bx+1.8,-2.8); ctx.stroke(); }
  const hg=ctx.createLinearGradient(8,-12,8,0);           // the head: a brick with a blunt front
  hg.addColorStop(0,'#a67e46'); hg.addColorStop(1,'#8a6236');
  ctx.fillStyle=hg;
  ctx.beginPath();
  ctx.moveTo(6,-10.5);                                    // flat forehead...
  ctx.quadraticCurveTo(15,-11.5, 17.5,-8.5);
  ctx.lineTo(18.2,-2.2);                                  // ...dropping VERTICALLY at the front
  ctx.quadraticCurveTo(17.8,0.4, 15,0.4);                 // squared chin
  ctx.quadraticCurveTo(10,0.4, 7,-1);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#4a3319'; ctx.lineWidth=1.1; ctx.stroke();
  ctx.fillStyle='#c4a06a';                                // pale muzzle band on the blunt front
  ctx.beginPath();
  ctx.moveTo(17.6,-6.5); ctx.lineTo(18.2,-2.2);
  ctx.quadraticCurveTo(17.8,0.4, 15,0.4);
  ctx.quadraticCurveTo(14.4,-3, 15.2,-6.2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='#3a2814';                                // nostril, set HIGH on the front
  ctx.beginPath(); ctx.ellipse(16.9,-6.3,0.9,0.6,0.3,0,7); ctx.fill();
  ctx.strokeStyle='#3a2814'; ctx.lineWidth=0.8;           // the unimpressed mouth
  ctx.beginPath(); ctx.moveTo(17.4,-2.6); ctx.quadraticCurveTo(16,-1.8, 14.6,-2.2); ctx.stroke();
  const flick=Math.sin(k.step*0.7)>0.94? 1:0;             // an ear flick, occasionally
  ctx.fillStyle='#8a6236';                                // two small round ears, set far back
  ctx.beginPath(); ctx.ellipse(7.6,-11.4,1.8,1.6+flick*0.5,-0.2,0,7); ctx.fill();
  ctx.strokeStyle='#4a3319'; ctx.lineWidth=0.9; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(11.4,-11.8,1.7,1.5,0.15,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#553c1e';
  ctx.beginPath(); ctx.ellipse(11.4,-11.6,0.9,0.7,0.15,0,7); ctx.fill();
  ctx.fillStyle='#17120c';                                // the eye: high, and half-shut
  ctx.beginPath(); ctx.ellipse(13.2,-7.6,1.3,0.9,0,0,7); ctx.fill();
  ctx.strokeStyle='#8a6236'; ctx.lineWidth=1.1;           // the heavy lid doing the half-shutting
  ctx.beginPath(); ctx.moveTo(11.8,-8.3); ctx.lineTo(14.6,-8.1); ctx.stroke();
  ctx.fillStyle='rgba(255,244,220,.5)';
  ctx.beginPath(); ctx.arc(13.6,-7.8,0.35,0,7); ctx.fill();
  ctx.restore();
}
/* THE DODO — South Meadow. Big hooked grey bill, thick yellow legs, a body
   too heavy for the wings it has left, and a pigeon's head-bob on every step
   (it was a pigeon, which is the fact worth drawing). */
function drawDodo(k){
  const bob=Math.abs(Math.sin(k.step))*1.1;
  const nk=Math.sin(k.step)*1.3;
  ctx.save(); ctx.translate(k.x,k.y+HUD-bob); ctx.scale(k.fx||1,1);
  ctx.strokeStyle='#c9a032'; ctx.lineWidth=2.6; ctx.lineCap='round';
  for(let i=0;i<2;i++){
    const sw=Math.sin(k.step*2+i*Math.PI)*3;
    ctx.beginPath(); ctx.moveTo(-1+i*4, 1); ctx.lineTo(-1+i*4+sw, 8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-1+i*4+sw, 8.2); ctx.lineTo(2+i*4+sw, 8.6); ctx.stroke();
  }
  ctx.fillStyle='#d8d2c6';
  for(let i=0;i<3;i++){ ctx.beginPath(); ctx.ellipse(-12,-6-i*2.3,3.8,1.5,-0.55+i*0.26,0,7); ctx.fill(); }
  const g=ctx.createLinearGradient(0,-11,0,4);
  g.addColorStop(0,'#b5ac9e'); g.addColorStop(1,'#7c7366');
  ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(-1,-3,10,8,0,0,7); ctx.fill();
  ctx.strokeStyle='#4a443c'; ctx.lineWidth=1.1; ctx.stroke();
  ctx.fillStyle='#9a9184'; ctx.beginPath(); ctx.ellipse(-2.5,-3,4.2,2.7,0.3,0,7); ctx.fill();
  ctx.fillStyle='#a79e90';
  ctx.beginPath(); ctx.ellipse(6,-9.4+nk*0.4,4.1,4.7,0.1,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#6d6154';                                 // the bill
  ctx.beginPath();
  ctx.moveTo(7.6,-11.6+nk*0.4);
  ctx.quadraticCurveTo(17.4,-11+nk*0.4, 16.6,-6.2+nk*0.4);
  ctx.quadraticCurveTo(13.6,-6.8+nk*0.4, 7.6,-7.8+nk*0.4);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#3f382f'; ctx.lineWidth=0.9; ctx.stroke();
  ctx.fillStyle='#8b7f70'; ctx.beginPath(); ctx.ellipse(11.2,-10+nk*0.4,3,1.1,-0.16,0,7); ctx.fill();
  ctx.fillStyle='#141210'; ctx.beginPath(); ctx.arc(7.2,-10.8+nk*0.4,1.15,0,7); ctx.fill();
  ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(7.5,-11.1+nk*0.4,0.42,0,7); ctx.fill();
  ctx.restore();
}
/* DRAGONFLY (Scott, 2026-08-20: "keep coming back to the dragonfly concept —
   I like them"). Ambient-first per the roadmap filing: two residents of the
   Lakeside water, no gameplay yet. Sprite spec honored: side view, faces both
   ways, three wing readings — the flight flap cycles up / level / down, and a
   perched dragonfly folds the wings flat along its back. */
function drawDragonfly(k){
  const fly=k.mode!=='perch';
  const lift= fly? 9+Math.sin(k.step*0.21)*2 : 0;
  if(fly){                                    // tiny ground shadow sells the height
    ctx.fillStyle='rgba(20,26,20,.18)';
    ctx.beginPath(); ctx.ellipse(k.x,k.y+HUD+3,5,1.8,0,0,7); ctx.fill();
  }
  ctx.save(); ctx.translate(k.x,k.y+HUD-lift); ctx.scale(k.fx,1);
  ctx.globalAlpha=0.55; ctx.fillStyle='#d6f0fa';
  if(fly){
    for(const o of [0,1]){                    // fore + hind wing, offset phase
      const ang=-0.2 - Math.sin(k.step*1.9+o*2.1)*0.75;
      ctx.save(); ctx.translate(-1-o*3,-2); ctx.rotate(ang);
      ctx.beginPath(); ctx.ellipse(6,0,6.5,1.8,0,0,7); ctx.fill();
      ctx.strokeStyle='rgba(120,160,180,.4)'; ctx.lineWidth=0.5; ctx.stroke();
      ctx.restore();
    }
  } else {
    ctx.beginPath(); ctx.ellipse(-6,-2.6,7,1.4,0.08,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.fillStyle='#2fa8a0';                    // tapering two-tone abdomen
  ctx.beginPath(); ctx.ellipse(-5,0,7.5,1.4,0,0,7); ctx.fill();
  ctx.fillStyle='#237f7a';
  for(let i=0;i<4;i++) ctx.fillRect(-3-i*2.4,-1.1,1.1,2.2);
  ctx.fillStyle='#1f6e6a'; ctx.beginPath(); ctx.ellipse(1,-0.6,2.6,2.2,0,0,7); ctx.fill();
  ctx.fillStyle='#284a58'; ctx.beginPath(); ctx.arc(3.6,-1,1.9,0,7); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(4.2,-1.6,0.6,0,7); ctx.fill();
  ctx.restore();
}
function drawCritter(k){
  if(k.kind==='platypus') drawPlatypus(k);
  else if(k.kind==='capybara') drawCapybara(k);
  else if(k.kind==='dragonfly') drawDragonfly(k);
  else drawDodo(k);
}
function drawRadTomato(d){
  const x=d.x+16, y=d.y+20+HUD, p=0.5+0.5*Math.sin(playFrames*0.09);
  const g=ctx.createRadialGradient(x,y,2,x,y,16+p*5);
  g.addColorStop(0,'rgba(120,255,90,'+(0.30+p*0.25).toFixed(2)+')'); g.addColorStop(1,'rgba(120,255,90,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,16+p*5,0,7); ctx.fill();
  ctx.fillStyle='#d84a3a'; ctx.beginPath(); ctx.ellipse(x,y,7,6,0,0,7); ctx.fill();
  ctx.fillStyle='rgba(150,255,120,.55)'; ctx.beginPath(); ctx.ellipse(x-2,y-2,3,2.2,0,0,7); ctx.fill();
  ctx.fillStyle='#4e7d33'; ctx.beginPath(); ctx.moveTo(x,y-5); ctx.lineTo(x-3,y-9); ctx.lineTo(x+1,y-6); ctx.lineTo(x+3,y-8); ctx.closePath(); ctx.fill();
}

function drawWorld(){
  if(groundScr!==curScr || groundBuiltHash!==[...built].join(',')) renderGround();
  ctx.drawImage((frame>>5)%2?groundB:groundA, 0, HUD, RW, RH);

  drawGateRubble();
  drawCornStubble();
  if(curScr===CROP_SCR) drawCropField();   // under everything that walks
  if(curScr===SLU_SCR) drawSluiceChannel();

  // shadows (flat pass) — everything that stands on the ground gets one.
  // Recessed things (cave mouths, doors set into rock, sockets, teleport
  // pads) are deliberately absent: they're IN the ground, not ON it.
  // corn is EXCLUDED from the round-shadow pass: at one blob per tile the
  // overlaps read as mud between belt rows. It shades its own base instead.
  for(const nd of nodes){ if(nd.kind==='corn') continue; drawShadow(nd.c*T+16, nd.r*T+28, nd.kind==='tree'?13:14); }
  for(const f of foes) drawShadow(f.x, f.y, f.t==='boss'?15:12);
  for(const dk of ducks) drawShadow(dk.x, dk.y+4, dk.kind==='kid'?3.5:dk.kind==='mom'?6:5, 0.3);
  for(const k of critters) if(!k.swim) drawShadow(k.x, k.y+6, k.kind==='capybara'?11:8, 0.28);
  for(const n of npcs) if(n.who!=='yogi') drawShadow(n.x, n.y, 10);
  for(const pb of pushables) drawShadow(pb.x, pb.y+pb.h/2, 15);
  for(const d of decos){
    const s=DECO_SHADOW[d.kind];
    if(s) drawShadow(d.x+s[0], d.y+s[1], s[2]);
  }
  for(const s of spots){
    if(!built.has(s.key)) continue;
    if(s.key==='mill') drawShadow(s.x, s.y+8, 26);
    else if(s.key==='quarry') drawShadow(s.x, s.y+8, 24);
    else if(s.key==='farm') drawShadow(s.x, s.y+8, 26);
  }
  for(const c of chests) drawShadow(c.x, c.y+2, 11);
  for(const p of pickups) drawShadow(p.x, p.y, 6, 0.26);
  for(const h of hearts) drawShadow(h.x, h.y, 6, 0.26);
  for(const dm of diamonds) drawShadow(dm.x, dm.y, 7, 0.26);
  for(const kk of keyItems) drawShadow(kk.x, kk.y, 7, 0.26);
  drawShadow(PL.x, PL.y, 10);

  for(const p of pickups) drawPickup(p);
  for(const h of hearts) drawHeartItem(h);
  for(const dm of diamonds) drawDiamond(dm);
  for(const sk of sockets) drawSocket(sk);
  for(const kk of keyItems) drawKeyItem(kk);

  // y-sorted tall things
  const draws=[];
  for(const nd of nodes){
    if(nd.shake>0) nd.shake--;
    const yy=nd.r*T+30;
    if(nd.kind==='tree') draws.push({y:yy, f:()=>drawTree(nd.c*T+16, yy, nd.shake, SCREENS[curScr].theme)});
    else if(nd.kind==='corn') draws.push({y:yy, f:()=>drawCorn(nd.c*T+16, yy, nd.shake)});
    else draws.push({y:yy, f:()=>drawRock(nd.c*T+16, yy, nd.shake)});
  }
  for(const d of decos){
    if(d.kind==='house') draws.push({y:d.y+62, f:()=>drawHouse(d.x,d.y)});
    else if(d.kind==='govhall') draws.push({y:d.y+64, f:()=>drawGovHall(d.x,d.y)});
    else if(d.kind==='tent') draws.push({y:d.y+30, f:()=>drawTent(d.x,d.y)});
    else if(d.kind==='cavemouth') draws.push({y:d.y+34, f:()=>drawCaveMouth(d.x,d.y)});
    else if(d.kind==='arcadedoor') draws.push({y:d.y+34, f:()=>drawArcadeDoor(d.x,d.y)});
    else if(d.kind==='trail') draws.push({y:d.y+30, f:()=>drawTrailSign(d)});
    else if(d.kind==='runhead') draws.push({y:d.y+30, f:()=>drawRunHead(d)});
    else if(d.kind==='teleport') draws.push({y:d.y+30, f:()=>drawTeleportPad(d)});
    else if(d.kind==='rosedoor') draws.push({y:d.y+30, f:()=>drawRoseDoor(d)});
    else if(d.kind==='riverraft') draws.push({y:d.y+28, f:()=>drawRiverRaftDeco(d)});
    else if(d.kind==='trellis') draws.push({y:d.y+30, f:()=>drawTrellis(d)});
    else if(d.kind==='tomato') draws.push({y:d.y+30, f:()=>drawTomato(d)});
    else if(d.kind==='cropsign') draws.push({y:d.y+26, f:()=>drawCropSign(d)});
    else if(d.kind==='cropwand') draws.push({y:d.y+30, f:()=>drawCropWand(d)});
    else if(d.kind==='shelf') draws.push({y:d.y+30, f:()=>drawShelf(d)});
    else if(d.kind==='boxes') draws.push({y:d.y+30, f:()=>drawBoxes(d)});
    else if(d.kind==='desk') draws.push({y:d.y+30, f:()=>drawDesk(d)});
    else if(d.kind==='board') draws.push({y:d.y+28, f:()=>drawBoard(d)});
    else if(d.kind==='stall') draws.push({y:d.y+30, f:()=>drawStall(d)});
    else if(d.kind==='bench') draws.push({y:d.y+28, f:()=>drawBench(d)});
    else if(d.kind==='lamp') draws.push({y:d.y+30, f:()=>drawLamp(d)});
    else if(d.kind==='trough') draws.push({y:d.y+28, f:()=>drawTrough(d)});
    else if(d.kind==='statue') draws.push({y:d.y+30, f:()=>drawStatue(d)});
    else if(d.kind==='cypherstone') draws.push({y:d.y+30, f:()=>drawCypherstone(d)});
    else if(d.kind==='extlink') draws.push({y:d.y+30, f:()=>drawExtlink(d)});
    else if(d.kind==='wreck') draws.push({y:d.y+30, f:()=>drawWreck(d)});
    else if(d.kind==='armpile') draws.push({y:d.y+28, f:()=>drawArmpile(d)});
    else if(d.kind==='cookfire') draws.push({y:d.y+26, f:()=>drawCookfire(d)});
    // the dig is a hole, not a thing standing in the yard — it sorts LOW so
    // the diggers and the player always walk in front of its far rim
    else if(d.kind==='digsite') draws.push({y:d.y+4, f:()=>drawDigsite(d)});
    else if(d.kind==='flowers') draws.push({y:d.y+8, f:()=>drawFlowers(d)});
    else if(d.kind==='bunting') draws.push({y:d.y+2, f:()=>drawBunting(d)});
    else if(d.kind==='wellrope') draws.push({y:d.y+30, f:()=>drawWellRope(d)});
    else if(d.kind==='threaddoor') draws.push({y:d.y+34, f:()=>drawThreadDoor(d)});
    else if(d.kind==='feather') draws.push({y:d.y+16, f:()=>drawFeather(d)});
    else if(d.kind==='fallenstar') draws.push({y:d.y+16, f:()=>drawFallenStar(d)});
    else if(d.kind==='gratbed') draws.push({y:d.y+2, f:()=>drawGratBed(d)});
    // the tomato ysorts LOW so live corn on its tile draws over it — you see
    // the green glow between the stalks before you can see the fruit
    else if(d.kind==='radtomato') draws.push({y:d.y+18, f:()=>drawRadTomato(d)});
    else draws.push({y:d.y+30, f:()=>{
      drawWell(d.x,d.y);
      if(curScr===5 && flags.wellGlow && (flags.wellTotal||0)<999){
        const p=0.16+0.08*Math.sin(playFrames*0.04);            // the water remembers
        const gg=ctx.createRadialGradient(d.x+16,d.y+HUD+18,2,d.x+16,d.y+HUD+18,24);
        gg.addColorStop(0,'rgba(140,220,240,'+p.toFixed(2)+')'); gg.addColorStop(1,'rgba(140,220,240,0)');
        ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(d.x+16,d.y+HUD+18,24,0,7); ctx.fill();
      }
      if(curScr===5 && wellFx.frogs>0){
        drawFrog(d.x-4, d.y+30, 0); drawFrog(d.x+36, d.y+26, 1); drawFrog(d.x+16, d.y+40, 2);
      }
    }});
  }
  for(const dk of ducks) draws.push({y:dk.y+4, f:()=>drawDuck(dk)});
  for(const k of critters) draws.push({y:k.y+5, f:()=>drawCritter(k)});
  /* citizens sort by feet+8 so a sitter (y=bench tile+22 -> 158) draws AFTER
     the bench itself (sorts at tile+28 -> 156) and reads as ON it */
  if(curScr===5) for(const cz of citizens) draws.push({y:cz.y+8, f:()=>drawCitizen(cz)});
  if(curScr===5) for(let i=0;i<(flags.garden||[]).length;i++){
    const g=flags.garden[i], sp=flowerSpec(g), pos=flowerPos(i,sp);
    const gt=Math.min(1,(playFrames-(g.p||0))/90);
    draws.push({y:pos.y, f:()=>drawGratFlower(pos.x,pos.y,sp,gt)});
  }
  for(const p of portals) draws.push({y:p.y, f:()=>drawPortal(p)});
  for(const dr of doors) draws.push({y:dr.y+8, f:()=>drawLockDoor(dr)});
  for(const pb of pushables) draws.push({y:pb.y+pb.h/2, f:()=>drawPushBoulder(pb)});
  for(const s of spots){
    const b=built.has(s.key);
    if(s.key==='mill') draws.push({y:s.y+6, f:()=> b?drawMillBuilt(s.x,s.y+6):drawGhostSpot(s)});
    else if(s.key==='quarry') draws.push({y:s.y+6, f:()=> b?drawQuarryBuilt(s.x,s.y+6):drawGhostSpot(s)});
    else if(s.key==='farm') draws.push({y:s.y+6, f:()=> b?drawFarmBuilt(s.x,s.y+6):drawGhostSpot(s)});
    else if(s.key==='boat'){ if(b) draws.push({y:6.5*T+8, f:()=>drawBoat(10.6*T, 6.5*T)}); else draws.push({y:s.y, f:()=>drawGhostSpot(s)}); }
    else if(s.key==='bridge'){ if(!b) draws.push({y:s.y, f:()=>drawGhostSpot(s)}); }
    else if(s.key==='gate'){ if(!b) draws.push({y:s.y+14, f:()=>{
      drawLabel('RUBBLE', s.x, s.y+HUD-28, '#ffe9a0');
      if(Math.hypot(PL.x-s.x,PL.y-s.y)<70) drawLabel('8 stone  [SPACE]', s.x, s.y+HUD-15, '#ffffff');
    }}); }
  }
  if(curScr===SLU_SCR) for(let i=0;i<SLU_ROWS.length;i++){
    const gy=SLU_ROWS[i]*T+30;
    draws.push({y:gy, f:()=>drawSluiceGate(i)});
  }
  for(const c of chests) draws.push({y:c.y, f:()=>drawChest(c)});
  for(const n of npcs) draws.push({y:n.y, f:()=>drawNPC(n)});
  for(const f of foes) draws.push({y:f.y, f:()=>drawFoe(f)});
  draws.push({y:PL.y, f:drawPlayerSprite});
  draws.sort((a,b)=>a.y-b.y);
  for(const d of draws) d.f();
  drawSluicePrompt();

  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life--;
    if(p.life<=0){ particles.splice(i,1); continue; }
    ctx.globalAlpha=Math.min(1,p.life/15)*0.85;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y+HUD,2.2,0,7); ctx.fill();
    ctx.globalAlpha=1;
  }
  // floating texts
  ctx.font='bold 12px '+FONT; ctx.textAlign='center'; ctx.lineJoin='round';
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i]; f.y-=0.4; f.life--;
    if(f.life<=0){ floats.splice(i,1); continue; }
    ctx.globalAlpha=Math.min(1,f.life/20);
    ctx.lineWidth=3; ctx.strokeStyle='rgba(10,14,8,.85)';
    ctx.strokeText(f.text, f.x, f.y+HUD);
    ctx.fillStyle=f.color||'#fff'; ctx.fillText(f.text, f.x, f.y+HUD);
    ctx.globalAlpha=1;
  }

  // depth gradient + vignette
  const gr=ctx.createLinearGradient(0,HUD,0,HUD+130);
  gr.addColorStop(0,'rgba(0,0,24,.24)'); gr.addColorStop(1,'rgba(0,0,24,0)');
  ctx.fillStyle=gr; ctx.fillRect(0,HUD,RW,130);
  const vg=ctx.createRadialGradient(RW/2,HUD+RH/2,RH*0.55,RW/2,HUD+RH/2,RH*0.95);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,10,.22)');
  ctx.fillStyle=vg; ctx.fillRect(0,HUD,RW,RH);

  /* The ADVENTURE! teaser owns the bottom-left corner of the Arcade floor
     (roughly c0-c5, r8-r11). Nothing may be placed under it — it buried the
     EXIT cabinet once already. C64_PANEL is the single source of that fact
     so the layout test can check against the same numbers the draw uses. */
  if(curScr===12) drawC64Terminal(C64_PANEL.x, C64_PANEL.y, C64_PANEL.w, C64_PANEL.h);
  if(curScr===17) drawRemnantsRoom();
}

function drawHUDbar(nameStr, objStr){
  const hg=ctx.createLinearGradient(0,0,0,HUD);
  hg.addColorStop(0,'#10160e'); hg.addColorStop(1,'#0a0e08');
  ctx.fillStyle=hg; ctx.fillRect(0,0,RW,HUD);
  ctx.fillStyle='rgba(232,193,90,.25)'; ctx.fillRect(0,HUD-2,RW,2);
  // hearts
  for(let i=0;i<PL.maxhp/2;i++){
    const hx=16+i*19, hy=13, full=PL.hp>=(i+1)*2, half=PL.hp===i*2+1;
    drawHeartShape(hx,hy,7, full||half ? '#ff4a5a' : '#3a2a2c');
    ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=1.2; ctx.stroke();
    if(half){
      ctx.save(); ctx.beginPath(); ctx.rect(hx,hy-9,10,18); ctx.clip();
      drawHeartShape(hx,hy,7,'#3a2a2c'); ctx.restore();
    }
    if(full||half){ ctx.fillStyle='rgba(255,255,255,.45)'; ctx.beginPath(); ctx.ellipse(hx-2.5,hy-3,2,1.4,-0.5,0,7); ctx.fill(); }
  }
  // resources
  ctx.font='bold 13px '+FONT; ctx.textAlign='left';
  let rx=16;
  // wood icon
  ctx.save(); ctx.translate(rx+6,33); ctx.rotate(-0.3);
  ctx.fillStyle='#96713d'; rr(ctx,-6,-2.5,12,5,2.5); ctx.fill();
  ctx.fillStyle='#d4b06a'; ctx.beginPath(); ctx.ellipse(-6,0,1.6,2.5,0,0,7); ctx.fill();
  ctx.restore();
  ctx.fillStyle='#e8dcc0'; ctx.fillText(String(res.wood), rx+16, 38);
  rx+=52;
  const sg=ctx.createRadialGradient(rx+4,31,1,rx+6,33,6);
  sg.addColorStop(0,'#c2bdb0'); sg.addColorStop(1,'#7d7869');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(rx+6,33,5.5,0,7); ctx.fill();
  ctx.fillStyle='#e8dcc0'; ctx.fillText(String(res.stone), rx+16, 38);
  rx+=52;
  const gg=ctx.createRadialGradient(rx+4,31,1,rx+6,33,6);
  gg.addColorStop(0,'#ffe98a'); gg.addColorStop(1,'#e0a818');
  ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(rx+6,33,5.5,0,7); ctx.fill();
  ctx.strokeStyle='#a87808'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(rx+6,33,3.4,0,7); ctx.stroke();
  ctx.fillStyle='#e8dcc0'; ctx.fillText(String(res.gold), rx+16, 38);
  // keys on the belt (top row, right of hearts)
  keysHeld.forEach((kc,i)=>{ drawKeyIcon(126+i*24, 13, KEYCOL[kc], 1); });
  // name + objective
  ctx.textAlign='center';
  ctx.fillStyle='#f2ecd8'; ctx.font='bold 15px '+FONT;
  ctx.fillText(nameStr || SCREENS[curScr].name, RW/2, 19);
  const obj = objStr!==undefined ? objStr : objective();
  if(obj){
    ctx.fillStyle='#ffd76e'; ctx.font='bold 12px '+FONT;
    ctx.fillText('◆ '+obj, RW/2, 38);
  }
  // minimap — the valley, screen by screen
  const mx=RW-64, my=7;
  ctx.fillStyle='rgba(255,255,255,.06)'; rr(ctx,mx-4,my-3,60,40,4); ctx.fill();
  for(let r=0;r<GRIDH;r++) for(let c=0;c<GRIDW;c++){
    const i=r*GRIDW+c;
    ctx.fillStyle = i===curScr ? '#ffd76e' : visited.has(i) ? '#55684c' : '#232a1f';
    rr(ctx,mx+c*14, my+r*11.5, 12, 9.5, 2); ctx.fill();
    if(i===curScr && (frame>>4)%2){   // you-are-here dot
      ctx.fillStyle='#3a2c08'; ctx.beginPath(); ctx.arc(mx+c*14+6, my+r*11.5+4.7, 1.8, 0, 7); ctx.fill();
    }
  }
  ctx.textAlign='right'; ctx.font='bold 9px '+FONT;
  if(curScr>=12){ ctx.fillStyle='#ffd76e'; ctx.fillText(curScr===12?'OFF-MAP: ARCADE':curScr===13?'OFF-MAP: SUMMIT':curScr===16?'OFF-MAP: WELL BOTTOM':curScr===17?'OFF-MAP: REJECTS':'OFF-MAP: FAR PEAK', mx-8, 14); }
  else { ctx.fillStyle='#8a957e'; ctx.fillText('MAP', mx-8, 14); }
  if(saveFlash>0){ saveFlash--; ctx.fillStyle='#7fdb7f'; ctx.font='bold 9px '+FONT;
    ctx.globalAlpha=Math.min(1,saveFlash/30); ctx.fillText('✓ SAVED', mx-8, 26); ctx.globalAlpha=1; }
  if(muted){ ctx.fillStyle='#6a7562'; ctx.textAlign='right'; ctx.font='bold 10px '+FONT; ctx.fillText('MUTED', mx-8, 38); }
}
/* wrapText — break to a PIXEL width, not a character count. Shared by the
   dialog bubble and the toasts, both of which used to guess. */
function wrapText(text, maxw){
  const out=[]; let line='';
  for(const wd of String(text).split(' ')){
    const t= line? line+' '+wd : wd;
    if(line && ctx.measureText(t).width>maxw){ out.push(line); line=wd; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
/* THE SPEECH BUBBLE (fixed 2026-08-20 — Scott: "Old Cinder has some phrases
   that overlap the speech bubble space"). Two faults, both here: the box was a
   fixed 72px tall, and the wrap counted CHARACTERS. In a proportional font 66
   characters is a different pixel width every line, so a long speech both
   over-ran the right edge and painted its third line through the bottom border.
   Now it wraps by measured width and the box grows to hold whatever it wrapped
   to — no line of dialogue anyone writes later can overflow it again. */
function drawDialog(){
  if(!dialog) return;
  const w=540, x=(RW-w)/2;
  ctx.font='13px '+FONT;
  const lines=wrapText(dialog.text, w-32);
  const h=Math.max(72, 48+lines.length*16);
  const y=HUD+RH-12-h;                        // the bubble stays pinned to the bottom
  ctx.fillStyle='rgba(8,12,7,.9)'; rr(ctx,x,y,w,h,8); ctx.fill();
  ctx.strokeStyle='rgba(232,193,90,.8)'; ctx.lineWidth=1.6; rr(ctx,x+2,y+2,w-4,h-4,6); ctx.stroke();
  ctx.fillStyle='#ffd76e'; ctx.font='bold 13px '+FONT; ctx.textAlign='left';
  ctx.fillText(dialog.name, x+16, y+20);
  ctx.fillStyle='#e8e8dc'; ctx.font='13px '+FONT;
  lines.forEach((L,i)=>ctx.fillText(L, x+16, y+38+i*16));
}
/* Same fault class as the bubble, found while fixing it: a toast was drawn as
   ONE unwrapped line, its plate sized to the measured text. The dig reports run
   ~140 characters, which is about 830px of bold 12px on a 640px screen — they
   ran off both edges every time a layer was dug. Wrap first, size the plate to
   the widest line, and stack by real heights instead of a flat 24px. */
function drawToasts(){
  ctx.textAlign='center'; ctx.font='bold 12px '+FONT;
  let ty=HUD+10;
  for(const t of toasts){
    t.life--;
    const lines=wrapText(t.text, RW-64);
    let ww=0; for(const L of lines) ww=Math.max(ww, ctx.measureText(L).width);
    const w=ww+26, h=6+lines.length*15;
    ctx.globalAlpha=Math.min(1,t.life/40);
    ctx.fillStyle='rgba(8,12,7,.85)';
    rr(ctx,RW/2-w/2, ty, w, h, 9); ctx.fill();
    ctx.strokeStyle='rgba(232,193,90,.35)'; ctx.lineWidth=1; rr(ctx,RW/2-w/2, ty, w, h, 9); ctx.stroke();
    ctx.fillStyle='#ffe9a0';
    lines.forEach((L,j)=>ctx.fillText(L, RW/2, ty+13.5+j*15));
    ctx.globalAlpha=1;
    ty+=h+5;
  }
  for(let i=toasts.length-1;i>=0;i--) if(toasts[i].life<=0) toasts.splice(i,1);
}
/* SPLASH ART (Scott, 2026-08-19) — one of the generated title paintings is
   picked at random on every load and drawn behind the title. The images are
   flavor, not furniture: if the pick hasn't loaded (or ever fails), the
   original all-text title draws instead, so the game never waits on art. */
/* SLOTS, NOT A MANIFEST (2026-08-20). Scott makes the paintings; he should
   never need a code change from me to hang a new one. More slots are declared
   than exist and the loader tries candidates in random order — an empty slot
   just 404s and the next one is asked. Only a completely empty folder falls
   through to the text title. Drop images/splash-6.jpg and it is in the rotation
   on the next reload, no deploy of mine required. */
const SPLASHES=['splash-1.jpg','splash-2.jpg','splash-3.jpg','splash-4.jpg','splash-5.jpg',
                'splash-6.jpg','splash-7.jpg','splash-8.jpg','splash-9.jpg','splash-10.jpg'];
let splashImg=null;
/* Starting from the title no longer cuts straight to the valley (Scott,
   2026-08-20: "allow more time for splash screen - 2 seconds, fade out into
   town square"). ENTER arms a savor: the painting holds ~2s, fades to black,
   THEN the game starts under a fade-up. With no painting loaded there is
   nothing to savor — just the short fade, never a wait on a text screen. */
let splashOutT=0, splashOutFn=null, fadeInT=0;
function beginFromTitle(fn){
  if(splashOutT>0) return;                 // already leaving — don't re-arm
  splashOutFn=fn;
  splashOutT= (splashImg&&splashImg.complete)? 150 : 26;
  /* the Defender wav starts NOW, on the keypress itself — the browser's
     user-gesture requirement, and the sound plays over the splash savor */
  phaseWavDone=true; playPhaseWav();
}
let phaseWavDone=false;
/* THE HALF-SECOND FLASH (Scott, 2026-08-20: "reload flashes one screen for a
   half second with instructions to defeat warlord etc, then replaced by the
   nice looking variety of splash pages — I think maybe just get rid of the
   first one").

   It was the never-wait-on-art fallback firing during the JPEG decode: no
   image yet, so the plain text title painted for a few frames and then got
   swapped out from under you. The fallback still EXISTS — if the art 404s or
   the player is offline they must still be told which keys to press — it just
   no longer shows up while we are merely waiting.

   So the title holds quiet for up to SPLASH_WAIT frames: dark ground and the
   wordmark, already sitting at its with-art position so NOTHING moves when the
   painting lands. The art then fades up behind it. Only a real failure (onerror
   or the budget running out) drops through to the text screen. */
const SPLASH_WAIT=64, SPLASH_IN=20;
let splashWaitT=SPLASH_WAIT, splashInT=0, splashDead=false;
const splashHolding=()=>!splashImg && !splashDead && splashWaitT>0;
(function(){
  const queue=SPLASHES.slice();               // shuffle, then pop until one loads
  for(let i=queue.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const tmp=queue[i]; queue[i]=queue[j]; queue[j]=tmp;
  }
  (function tryNext(){
    if(!queue.length){ splashDead=true; return; }   // no art at all: the text title is the point
    const name=queue.pop();
    try{
      const im=new Image();
      im.onload=()=>{ splashImg=im; splashInT=SPLASH_IN; };
      /* an empty slot costs one fast 404. Top the quiet-hold budget back up as
         we go, so hunting for art never reintroduces the half-second flash —
         and when the queue empties, splashDead ends the hold immediately. */
      im.onerror=()=>{ splashWaitT=SPLASH_WAIT; tryNext(); };
      im.src='images/'+name;
    }catch(e){ splashDead=true; }
  })();
})();
/* THE LURKER (Scott, 2026-08-19: "some sneaky way — dark figure looks in from
   the back or side"). On roughly a third of loads, a too-familiar silhouette
   watches the title from one edge, under the scrims, eyes barely lit. Most
   players will never notice. That is the point. */
let lurk=null;
(function(){
  try{
    if(Math.random()<0.34){
      const side=Math.random()<0.5? -1:1;
      const im=new Image();
      im.onload=()=>{
        const c=document.createElement('canvas');
        c.width=im.width; c.height=im.height;
        const g=c.getContext('2d');
        g.drawImage(im,0,0);
        g.globalCompositeOperation='source-in';     // keep his shape, drown his colors
        g.fillStyle='#0b1018'; g.fillRect(0,0,c.width,c.height);
        lurk={side, sil:c, iw:im.width, ih:im.height};
      };
      im.src='images/face-1.png';
    }
  }catch(e){}
})();
function drawLurk(){
  if(!lurk) return;
  const h2=250, w2=lurk.iw/lurk.ih*h2;
  const lx= lurk.side<0? -w2*0.45 : RW-w2*0.55;    // half of him stays outside
  const ly=RH+HUD-h2+26;
  ctx.save();
  ctx.globalAlpha=0.5;
  ctx.drawImage(lurk.sil, lx, ly, w2, h2);
  const p=0.5+0.5*Math.sin(frame*0.05);            // the eyes breathe, faintly
  ctx.globalAlpha=0.2+0.16*p;
  ctx.fillStyle='#e8c15a';
  ctx.beginPath();
  ctx.ellipse(lx+w2*0.36, ly+h2*0.27, 4, 2.6, 0, 0, 7);
  ctx.ellipse(lx+w2*0.63, ly+h2*0.27, 4, 2.6, 0, 0, 7);
  ctx.fill();
  ctx.restore(); ctx.globalAlpha=1;
}
function drawTitle(){
  const bg=ctx.createLinearGradient(0,0,0,RH+HUD);
  bg.addColorStop(0,'#0d130b'); bg.addColorStop(1,'#070a06');
  ctx.fillStyle=bg; ctx.fillRect(0,0,RW,RH+HUD);
  if(splashHolding()){
    /* still decoding. Wordmark only, at the WITH-ART position so the painting
       arriving moves nothing — the old code painted the whole text title here
       and then yanked it away half a second later. */
    ctx.textAlign='center'; ctx.font='bold 46px '+FONT;
    const hg=ctx.createLinearGradient(0,90,0,135);
    hg.addColorStop(0,'#ffe9a0'); hg.addColorStop(0.55,'#e8c15a'); hg.addColorStop(1,'#b8862a');
    ctx.save(); ctx.shadowColor='rgba(232,193,90,.45)'; ctx.shadowBlur=22;
    ctx.fillStyle=hg; ctx.fillText("GRISHNAK", RW/2, 96);
    ctx.restore();
    drawSplashOut();
    return;
  }
  if(splashImg){
    const s=Math.max(RW/splashImg.width,(RH+HUD)/splashImg.height);   // cover-fit
    const dw=splashImg.width*s, dh=splashImg.height*s;
    const a= splashInT>0? 1-splashInT/SPLASH_IN : 1;                  // fades up behind the wordmark
    if(a<1) ctx.globalAlpha=a;
    ctx.drawImage(splashImg,(RW-dw)/2,(RH+HUD-dh)/2,dw,dh);
    ctx.globalAlpha=1;
    drawLurk();                                                       // under the scrims, by design
    const sc=ctx.createLinearGradient(0,0,0,RH+HUD);                  // legibility scrims
    sc.addColorStop(0,'rgba(7,10,6,.5)'); sc.addColorStop(0.28,'rgba(7,10,6,.06)');
    sc.addColorStop(0.62,'rgba(7,10,6,.08)'); sc.addColorStop(1,'rgba(7,10,6,.82)');
    ctx.fillStyle=sc; ctx.fillRect(0,0,RW,RH+HUD);
  }
  ctx.textAlign='center';
  ctx.font='bold 46px '+FONT;
  const tg=ctx.createLinearGradient(0,90,0,135);
  tg.addColorStop(0,'#ffe9a0'); tg.addColorStop(0.55,'#e8c15a'); tg.addColorStop(1,'#b8862a');
  ctx.save(); ctx.shadowColor= splashImg? 'rgba(10,8,2,.9)':'rgba(232,193,90,.45)'; ctx.shadowBlur=22;
  ctx.fillStyle=tg; ctx.fillText("GRISHNAK", RW/2, splashImg? 96:124);
  ctx.restore();
  ctx.strokeStyle='rgba(60,40,10,.8)'; ctx.lineWidth=1.2;
  ctx.strokeText("GRISHNAK", RW/2, splashImg? 96:124);
  if(splashImg){
    /* the art carries the mood; the words compress into the bottom scrim */
    ctx.fillStyle='#dfe6d4'; ctx.font='13.5px '+FONT;
    ctx.fillText('Rebuild the wrecked valley — then take it back from the Warlord.', RW/2, 336);
    if((frame>>4)%2 && !splashOutT){
      ctx.font='bold 20px '+FONT;
      ctx.fillStyle='#ffd76e';
      ctx.fillText(hasSave()? 'ENTER — CONTINUE' : 'PRESS ENTER TO START', RW/2, 366);
    }
    if(hasSave()){
      ctx.font='12.5px '+FONT; ctx.fillStyle='#b8c2aa';
      ctx.fillText('N — new game (overwrites your save)  ·  ARROWS / WASD move  ·  SPACE acts', RW/2, 390);
    } else {
      ctx.font='12.5px '+FONT; ctx.fillStyle='#b8c2aa';
      ctx.fillText('ARROWS / WASD move  ·  SPACE swings, chops, talks, builds', RW/2, 390);
    }
    drawSplashOut();
    return;
  }
  drawLurk();                       // he watches the plain title too, when he comes
  ctx.font='15px '+FONT;
  ctx.fillStyle='#dfe6d4';
  ctx.fillText('The Warlord\'s bandits wrecked the valley.', RW/2, 172);
  ctx.fillText('Chop wood. Mine stone. Rebuild it all — and take it back.', RW/2, 194);
  ctx.fillStyle='#98a58c'; ctx.font='13.5px '+FONT;
  ctx.fillText('ARROWS / WASD move  ·  SPACE swings, chops, talks, builds', RW/2, 246);
  ctx.fillText('Rebuild the mill, farm, quarry, bridge & boat', RW/2, 268);
  ctx.fillText('Then clear the fortress gate and face the Warlord', RW/2, 290);
  if((frame>>4)%2 && !splashOutT){
    ctx.font='bold 20px '+FONT;
    ctx.fillStyle='#ffd76e';
    ctx.fillText(hasSave()? 'ENTER — CONTINUE' : 'PRESS ENTER TO START', RW/2, 350);
  }
  if(hasSave()){
    ctx.font='13.5px '+FONT; ctx.fillStyle='#98a58c';
    ctx.fillText('N — new game (overwrites your save)', RW/2, 378);
  }
  drawSplashOut();
}
/* the last ~half-second of the savor fades the title to black; the loop
   then starts the game under fadeInT's fade-up. Two ramps, one cut hidden. */
function drawSplashOut(){
  if(splashOutT<=0 || splashOutT>35) return;
  ctx.fillStyle='rgba(0,0,0,'+((35-splashOutT)/35).toFixed(2)+')';
  ctx.fillRect(0,0,RW,RH+HUD);
}
function drawWin(){
  ctx.fillStyle='rgba(0,0,0,.86)'; ctx.fillRect(0,0,RW,RH+HUD);
  ctx.textAlign='center';
  ctx.font='bold 38px '+FONT;
  const tg=ctx.createLinearGradient(0,105,0,140);
  tg.addColorStop(0,'#ffe9a0'); tg.addColorStop(1,'#d4a020');
  ctx.save(); ctx.shadowColor='rgba(232,193,90,.4)'; ctx.shadowBlur=18;
  ctx.fillStyle=tg; ctx.fillText('THE VALLEY IS FREE!', RW/2, 132);
  ctx.restore();
  const s=winStats, secs=Math.floor(s.time/60);
  ctx.font='bold 16px '+FONT; ctx.fillStyle='#e8e8dc'; ctx.textAlign='left';
  const lx=RW/2-108;
  ctx.fillText('TIME', lx, 192);          ctx.fillText(Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0'), lx+150, 192);
  ctx.fillText('REBUILT', lx, 220);       ctx.fillText(s.buildings+' / 6 structures', lx+150, 220);
  ctx.fillText('FOES SLAIN', lx, 248);    ctx.fillText(String(s.slain), lx+150, 248);
  ctx.fillText('GOLD', lx, 276);          ctx.fillText(String(s.gold), lx+150, 276);
  ctx.textAlign='center';
  if(s.buildings>=6){ ctx.fillStyle='#5ad4c8'; ctx.font='bold 17px '+FONT; ctx.fillText('★ MASTER BUILDER ★', RW/2, 312); }
  if((frame>>4)%2){
    ctx.font='bold 17px '+FONT;
    ctx.fillStyle='#ffd76e'; ctx.fillText('PRESS ENTER — THE ARCADE AWAITS', RW/2, 348);
  }
  ctx.font='13px '+FONT; ctx.fillStyle='#8890a8';
  ctx.fillText('a new cabinet has powered on  ·  press R to play again', RW/2, 376);
}

/* ---------------- MAIN LOOP ---------------- */
let last=performance.now(), acc=0;
function loop(now){
  requestAnimationFrame(loop);
  /* hide the Windows cursor over the game during overworld play. The Arcade
     (12) keeps it — the ADVENTURE! teaser's title bar is clickable there —
     and SENTINEL keeps it for mouse aim (different state, unaffected). */
  const wantCur=(state==='play' && curScr!==12)? 'none' : '';
  if(cv.style.cursor!==wantCur) cv.style.cursor=wantCur;
  acc+=Math.min(now-last,100); last=now;
  while(acc>=1000/60){
    acc-=1000/60; frame++;
    if(state==='title'){
      if(splashWaitT>0) splashWaitT--;        // the quiet hold, spent only at the title
      if(splashInT>0) splashInT--;            // ...then the painting fades up behind the wordmark
    }
    if(state==='title' && splashOutT>0){
      if(--splashOutT===0){
        const fn=splashOutFn; splashOutFn=null;
        fadeInT=40;                          // the valley fades up from black
        fn&&fn();
      }
    }
    if(fadeInT>0 && state!=='title') fadeInT--;
    if(state==='play' && !paused){
      playFrames++;
      updatePlayer();
      updateFoes();
      updateCritters();
      updateFields();
      updateCitizens();
      updateWellFx();
      updateEconomy();
    }
    else if(state==='cavetrans' && trans){ updateCaveTrans(); }
    else if(state==='cave' && !paused && window.CaveLayer){
      playFrames++;
      CaveLayer.update();
      updateEconomy();
    }
    else if(state==='maze' && !paused && window.MazeLayer){
      MazeLayer.update();
    }
    else if(state==='asteroids' && !paused && window.AsteroidsLayer){
      AsteroidsLayer.update();
    }
    else if(state==='sentinel' && !paused && window.SentinelLayer){
      SentinelLayer.update();
    }
    else if(state==='squirrel' && !paused && window.SquirrelLayer){
      SquirrelLayer.update();
    }
    else if(state==='robotron' && !paused && window.RobotronLayer){
      RobotronLayer.update();
    }
    else if(state==='chess' && !paused && window.ChessLayer){
      ChessLayer.update();
    }
    else if(state==='breakout' && !paused && window.BreakoutLayer){
      BreakoutLayer.update();
    }
    else if(state==='moonwalk' && !paused && window.MoonwalkLayer){
      MoonwalkLayer.update();
    }
    else if(state==='pacsphere' && !paused && window.PacsphereLayer){
      PacsphereLayer.update();
    }
    else if(state==='river' && !paused && window.RiverLayer){
      RiverLayer.update();
    }
    else if(state==='contraption' && !paused && window.ContraptionLayer){
      ContraptionLayer.update();
    }
    else if(state==='woodsrun' && !paused && window.WoodsRunLayer){
      WoodsRunLayer.update();
    }
    else if(state==='hazymaze' && !paused && window.HazyLayer){
      HazyLayer.update();
    }
    else if(state==='jungle' && !paused && window.JungleLayer){
      JungleLayer.update();
    }
    else if(state==='quarry' && !paused && window.QuarryLayer){
      QuarryLayer.update();
    }
    else if(state==='highroads' && !paused && window.HighMazeLayer){ window.HighMazeLayer.update(); }
    else if(state==='workings' && !paused && window.WorkingsLayer){
      WorkingsLayer.update();
    }
    else if(state==='rose' && !paused && window.RoseLayer){
      RoseLayer.update();
    }
    else if(state==='archive' && window.ArchiveLayer){
      ArchiveLayer.update();
    }
    /* unread pointer events are DROPPED, not banked. A queue that survives the
       frame turns "I moved the mouse while a menu was shut" into a burst of
       phantom drags the next time anything looks at it. */
    ptrQ.length=0;
  }
  draw();
  /* the fade-up from the splash savor — over EVERY state, one place */
  if(fadeInT>0 && state!=='title'){
    ctx.fillStyle='rgba(0,0,0,'+(fadeInT/40).toFixed(2)+')';
    ctx.fillRect(0,0,RW,RH+HUD);
  }
}
loadScreen(5);

/* ------------------ DIRECT LINKS TO A SINGLE CABINET ------------------
   Scott, 2026-08-21: "craft, somehow, direct links that I can share that go
   straight to stonebreaker, pac sphere, pac 3d, and moonwalk, and contraption".

   ?g=stonebreaker  (or #stonebreaker) boots that cabinet directly, instead of
   asking a stranger to walk the maze until they happen to find it.

   Two rules this obeys. First, the PORTAL_DEF gate is still checked, so a URL
   can never hand out a cabinet the maze is deliberately holding back — a link
   is a shortcut, never a key. Second, ESC leaves the cabinet INTO the maze,
   which is the nicest possible way for a visitor to discover there is one. */
const DEEP_LINKS={
  stonebreaker:'breakout', breakout:'breakout',
  pacsphere:'pacsphere', pacspere:'pacsphere',
  /* the rename (2026-08-21) — old slugs are already shared, so they stay */
  wakasphere:'pacsphere', waka:'highroads', waka3d:'highroads', '3dwaka':'highroads',
  pac3d:'highroads', '3dpac':'highroads', pac3:'highroads', highroads:'highroads',
  moonwalk:'moonwalk', moonwalker:'moonwalk',
  contraption:'contraption',
  /* the 2026-08-23 batch (Scott: "yes for jungle, omega run, bullfighting,
     tree trimmer, and monty... and fireball maze"). Values are STATE keys
     (see ARCADE_LAYERS) — which is why monty reads 'cave' and fireball
     reads 'maze'. */
  jungle:'jungle', junglehunt:'jungle',
  omega:'asteroids', omegarun:'asteroids',
  monty:'cave', montyzoom:'cave', caverns:'cave',
  fireball:'maze', fireballmaze:'maze'
};
/* FRONT DOORS (Scott, 2026-08-23: links "to share publicly and make videos
   about"). For these slugs the maze's own gate is deliberately NOT consulted
   — the owner opened this door himself. Every other slug still honours its
   gate: a link is a shortcut, never a key. */
const FREE_LINKS=new Set(['cave','maze','asteroids','jungle']);
/* whole PAGES outside the maze shell — the slug just goes there. When the
   final builds ship under their real filenames, repoint here and every link
   already shared keeps working. */
const PAGE_LINKS={
  bull:'wireframe-bullring.html', bullring:'wireframe-bullring.html',
  bullfight:'wireframe-bullring.html', bullfighting:'wireframe-bullring.html',
  trimmer:'wireframe-clearance.html', treetrimmer:'wireframe-clearance.html',
  clearance:'wireframe-clearance.html', trees:'wireframe-clearance.html'
};
function rawSlug(){
  const m = location.search.match(/[?&]g=([a-z0-9]+)/i) || location.hash.match(/^#([a-z0-9]+)/i);
  return m ? m[1].toLowerCase() : '';
}
function deepLinkKey(){ return DEEP_LINKS[rawSlug()] || ''; }
addEventListener('load', function(){
  const key = deepLinkKey();
  const page = PAGE_LINKS[rawSlug()];
  if(page){ location.replace(page); return; }
  if(!key) return;
  const def = PORTAL_DEF[key], L = window[ARCADE_LAYERS[key]];
  if(!FREE_LINKS.has(key)){
    if(!def || !def.live || !def.ok()) return;   // the gate still rules here
  }
  if(!L || !L.enter) return;
  if(!(hasSave() && loadGame())) newGame();
  layerReturn[key] = 'play';        // ESC drops them into the maze, not nowhere
  paused = false; state = key;
  try { L.enter(); } catch(e) { state = 'title'; }
});

requestAnimationFrame(loop);

  ['MOUNTAIN PASS',   null,  3],

];
function devJump(fn, scr){
  /* hard-return to solid ground first, so a layer entry always starts from
     the overworld no matter what state the game was left in */
  paused=false;
  state='play';
  loadScreen(scr!==undefined ? scr : 12);
  PL.x=10*T+16; PL.y=9*T+20; unstick(PL); PL.iframes=45; PL.kb.x=0; PL.kb.y=0;
  if(fn) fn();
}
(function(){
  const burger=document.getElementById('devburger'), list=document.getElementById('devlist');
  if(!burger) return;
  for(const row of DEV_SCREENS){
    if(row[0]==='sect'){
      const d=document.createElement('div'); d.className='sect'; d.textContent=row[1];
      list.appendChild(d); continue;
    }
    const btn=document.createElement('button');
    btn.textContent=row[0];
    btn.onclick=()=>{ list.classList.remove('open'); devJump(row[1], row[2]); };
    list.appendChild(btn);
  }
  burger.onclick=()=>list.classList.toggle('open');
  document.addEventListener('click',e=>{
    if(!e.target.closest('#devmenu')) list.classList.remove('open');
  });
})();
