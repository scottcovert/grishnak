/* ============================================================
   RENDERER v2 — smooth shapes, gradients, organic terrain
   ============================================================ */
function hexA(hex,a){
  const n=parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a.toFixed(3)})`;
}
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  const r=Math.min(255,((n>>16)&255)*f)|0, g=Math.min(255,((n>>8)&255)*f)|0, b=Math.min(255,(n&255)*f)|0;
  return `rgb(${r},${g},${b})`;
}
function rr(g,x,y,w,h,r){
  g.beginPath();
  if(g.roundRect) g.roundRect(x,y,w,h,r); else g.rect(x,y,w,h);
}
function hash2(c,r){ let h=(c*374761393 + r*668265263)^(c<<7)^(r<<3); h=(h^(h>>13))*1274126177; return ((h^(h>>16))>>>0)/4294967295; }

/* distinct tree crown seen from above — outline, gradient body, lobes, glint */
function paintCrown(g,x,y,rad,tone){
  const tones=[['#4c8a3a','#2a5220','#5e9c4c'],
               ['#3f7d30','#234718','#519448'],
               ['#468234','#2a4e1c','#57944a']][tone];
  g.fillStyle='rgba(12,26,8,.85)';                       // depth ring
  g.beginPath(); g.arc(x,y+1.5,rad+2,0,7); g.fill();
  let cg=g.createRadialGradient(x-rad*0.35,y-rad*0.45,1,x,y,rad);
  cg.addColorStop(0,tones[2]); cg.addColorStop(1,tones[1]);
  g.fillStyle=cg; g.beginPath(); g.arc(x,y,rad,0,7); g.fill();
  cg=g.createRadialGradient(x-rad*0.6,y-rad*0.55,1,x-rad*0.45,y-rad*0.35,rad*0.55);
  cg.addColorStop(0,tones[2]); cg.addColorStop(1,tones[0]);
  g.fillStyle=cg; g.beginPath(); g.arc(x-rad*0.45,y-rad*0.35,rad*0.55,0,7); g.fill();
  cg=g.createRadialGradient(x+rad*0.3,y-rad*0.6,1,x+rad*0.45,y-rad*0.4,rad*0.5);
  cg.addColorStop(0,tones[2]); cg.addColorStop(1,tones[0]);
  g.fillStyle=cg; g.beginPath(); g.arc(x+rad*0.45,y-rad*0.4,rad*0.5,0,7); g.fill();
  g.fillStyle='rgba(255,255,255,.22)';
  g.beginPath(); g.arc(x-rad*0.3,y-rad*0.5,rad*0.2,0,7); g.fill();
}
/* distinct boulder — outline, lit gradient, crack, highlight */
function paintBoulder(g,x,y,rad,tone){
  g.fillStyle='rgba(20,18,14,.8)';
  g.beginPath(); g.arc(x,y+1.5,rad+1.8,0,7); g.fill();
  const cg=g.createRadialGradient(x-rad*0.4,y-rad*0.5,1,x,y,rad);
  cg.addColorStop(0,['#8f8a7d','#a29d92','#7d7869'][tone]); cg.addColorStop(1,'#4c4840');
  g.fillStyle=cg; g.beginPath(); g.arc(x,y,rad,0,7); g.fill();
  g.strokeStyle='rgba(30,28,22,.5)'; g.lineWidth=1.1;
  g.beginPath(); g.moveTo(x-rad*0.3,y-rad*0.5); g.lineTo(x,y); g.lineTo(x-rad*0.25,y+rad*0.5); g.stroke();
  g.fillStyle='rgba(255,255,255,.25)';
  g.beginPath(); g.ellipse(x-rad*0.35,y-rad*0.45,rad*0.3,rad*0.18,-0.5,0,7); g.fill();
}

const groundA=document.createElement('canvas'), groundB=document.createElement('canvas');
groundA.width=groundB.width=RW*SCALE; groundA.height=groundB.height=RH*SCALE;
let groundScr=-1, groundBuiltHash='';

function renderGround(){
  const S=SCREENS[curScr], th=THEMES[S.theme];
  const inb=(c,r)=> c>=0&&c<COLS&&r>=0&&r<ROWS;
  const at=(c,r)=> inb(c,r)? grid[r][c] : '#';
  const walkCh=ch=> ch==='.'||ch==='P'||ch==='S'||ch===',';

  for(const [cnv,phase] of [[groundA,0],[groundB,1]]){
    const g=cnv.getContext('2d');
    g.setTransform(SCALE,0,0,SCALE,0,0);
    g.imageSmoothingEnabled=true;

    // --- base ground wash ---
    const bg=g.createLinearGradient(0,0,0,RH);
    bg.addColorStop(0, shade(th.g1,0.82));
    bg.addColorStop(0.5, th.g1);
    bg.addColorStop(1, shade(th.g1,1.06));
    g.fillStyle=bg; g.fillRect(0,0,RW,RH);

    // soft color variation blobs
    for(let i=0;i<70;i++){
      const hv=hash2(i*13+curScr*7, i*29);
      const x=hv*RW, y=hash2(i*3,curScr+i)*RH, rad=18+hv*30;
      const gg=g.createRadialGradient(x,y,2,x,y,rad);
      const col= i%2? th.g2 : th.g3;
      gg.addColorStop(0, col); gg.addColorStop(1,'rgba(0,0,0,0)');
      g.globalAlpha=0.35; g.fillStyle=gg;
      g.beginPath(); g.arc(x,y,rad,0,7); g.fill();
      g.globalAlpha=1;
    }
    // grass tufts / small details
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      const ch=at(c,r); if(ch!=='.') continue;
      const hv=hash2(c+curScr*31,r);
      const x=c*T, y=r*T;
      if(hv>0.72){
        g.strokeStyle='rgba(255,255,255,.14)'; g.lineWidth=1.4; g.lineCap='round';
        const bx=x+hv*24, by=y+((hv*77)%22)+6;
        g.beginPath(); g.moveTo(bx,by); g.lineTo(bx-2,by-5); g.moveTo(bx+3,by); g.lineTo(bx+4,by-5); g.stroke();
      }
      if(S.theme==='meadow' && hv>0.5&&hv<0.58){
        g.fillStyle=['#eddc72','#e78aa8','#f2f2e8'][Math.floor(hv*100)%3];
        g.beginPath(); g.arc(x+hv*26, y+(hv*60)%26, 2.2, 0, 7); g.fill();
        g.fillStyle='rgba(255,255,255,.5)'; g.beginPath(); g.arc(x+hv*26-0.7, y+(hv*60)%26-0.7, 0.8,0,7); g.fill();
      }
    }

    // --- cobblestone paths: autotiled bed + world-aligned stone courses ---
    const isPathN=(c,r)=> (c<0||c>=COLS||r<0||r>=ROWS) ? true : at(c,r)==='P';  // off-screen = road continues to next screen
    const pathTiles=[];
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(at(c,r)==='P') pathTiles.push([c,r]);
    const mortar=shade(th.path,0.5), mortar2=shade(th.path,0.74);
    const bedShape=(c,r,inset)=>{
      const up=isPathN(c,r-1),dn=isPathN(c,r+1),lf=isPathN(c-1,r),rt=isPathN(c+1,r);
      const x=c*T,y=r*T;
      const x0=x+(lf?0:inset), y0=y+(up?0:inset);
      const x1=x+T-(rt?0:inset), y1=y+T-(dn?0:inset);
      const rad=[(up||lf)?0:8,(up||rt)?0:8,(dn||rt)?0:8,(dn||lf)?0:8];
      g.beginPath();
      if(g.roundRect) g.roundRect(x0,y0,x1-x0,y1-y0,rad); else g.rect(x0,y0,x1-x0,y1-y0);
    };
    for(const [c,r] of pathTiles){ bedShape(c,r,0.5); g.fillStyle=shade(th.path,0.72); g.fill(); }
    for(const [c,r] of pathTiles){ bedShape(c,r,2); g.fillStyle=th.path; g.fill(); }
    // worn dirt track: sandy patches, mud, wheel ruts, pebbles, encroaching grass
    for(const [c,r] of pathTiles){
      const x=c*T, y=r*T;
      const up=isPathN(c,r-1),dn=isPathN(c,r+1),lf=isPathN(c-1,r),rt=isPathN(c+1,r);
      g.save(); bedShape(c,r,1); g.clip();
      for(let i=0;i<3;i++){                       // sandy light patches
        const hv=hash2(c*17+i*29, r*7+i*13+curScr);
        g.globalAlpha=0.28+hv*0.2;
        g.fillStyle=shade(th.path,1.22);
        g.beginPath(); g.ellipse(x+4+hv*24, y+4+((hv*53+i*11)%24), 5+hv*5, 3.5+hv*3, hv*3, 0, 7); g.fill();
      }
      for(let i=0;i<2;i++){                       // mud patches
        const hv=hash2(c*5+i*41, r*23+i*7);
        g.globalAlpha=0.22+hv*0.15;
        g.fillStyle=shade(th.path,0.78);
        g.beginPath(); g.ellipse(x+6+hv*20, y+6+((hv*37+i*19)%20), 4+hv*4, 3+hv*2, hv*2, 0, 7); g.fill();
      }
      g.globalAlpha=1;
      // wheel ruts along the road direction
      g.strokeStyle='rgba(60,45,25,.20)'; g.lineWidth=2.4; g.lineCap='round';
      const hv2=hash2(c*3,r*3);
      if(lf||rt){
        for(const ry of [11,21]){
          g.beginPath(); g.moveTo(x-1,y+ry+(hv2-0.5)*2);
          g.quadraticCurveTo(x+16, y+ry+(hv2-0.5)*4, x+T+1, y+ry+(hash2(c+1,r)-0.5)*2);
          g.stroke();
        }
      }
      if(up||dn){
        for(const rx of [11,21]){
          g.beginPath(); g.moveTo(x+rx+(hv2-0.5)*2, y-1);
          g.quadraticCurveTo(x+rx+(hv2-0.5)*4, y+16, x+rx+(hash2(c,r+1)-0.5)*2, y+T+1);
          g.stroke();
        }
      }
      for(let i=0;i<2;i++){                       // flat pebbles
        const hv=hash2(c*31+i*11, r*13+i*3);
        if(hv>0.4){
          g.fillStyle='rgba(110,100,85,.45)';
          g.beginPath(); g.arc(x+3+hv*26, y+5+((hv*71+i*23)%23), 1.2+hv*0.8, 0, 7); g.fill();
        }
      }
      g.restore();
      // worn grass creeping in from unconnected edges
      g.strokeStyle=th.g3; g.lineWidth=1.5; g.lineCap='round';
      const blades=(bx,by)=>{ g.beginPath(); g.moveTo(bx,by); g.lineTo(bx-1.5,by-4); g.moveTo(bx+2.5,by); g.lineTo(bx+3.5,by-4); g.stroke(); };
      const hv3=hash2(c*7,r*19);
      if(!up) blades(x+5+hv3*18, y+5);
      if(!dn) blades(x+7+hv3*16, y+T-1);
      if(!lf) blades(x+3, y+8+hv3*16);
      if(!rt) blades(x+T-5, y+10+hv3*14);
    }

    // --- sand: flat autotiled beach ---
    const isSandN=(c,r)=> (c<0||c>=COLS||r<0||r>=ROWS) ? true : (at(c,r)==='S');
    const sandTiles=[];
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(at(c,r)==='S') sandTiles.push([c,r]);
    const sandBed=(c,r,inset)=>{
      const up=isSandN(c,r-1),dn=isSandN(c,r+1),lf=isSandN(c-1,r),rt=isSandN(c+1,r);
      const x=c*T,y=r*T;
      const x0=x+(lf?0:inset), y0=y+(up?0:inset);
      const x1=x+T-(rt?0:inset), y1=y+T-(dn?0:inset);
      const rad=[(up||lf)?0:7,(up||rt)?0:7,(dn||rt)?0:7,(dn||lf)?0:7];
      g.beginPath();
      if(g.roundRect) g.roundRect(x0,y0,x1-x0,y1-y0,rad); else g.rect(x0,y0,x1-x0,y1-y0);
    };
    for(const [c,r] of sandTiles){ sandBed(c,r,0.5); g.fillStyle='#b3a26b'; g.fill(); }
    for(const [c,r] of sandTiles){ sandBed(c,r,2.5); g.fillStyle='#c9b878'; g.fill(); }
    for(const [c,r] of sandTiles){
      const x=c*T, y=r*T;
      for(let i=0;i<4;i++){
        const hv=hash2(c*11+i*7, r*3+i*13);
        g.fillStyle= hv>0.5 ? 'rgba(120,100,60,.35)' : 'rgba(255,246,220,.4)';
        g.beginPath(); g.arc(x+3+hv*26, y+3+((hv*67+i*17)%26), 1.1, 0, 7); g.fill();
      }
      // wet edge where sand meets water
      g.fillStyle='rgba(90,80,50,.30)';
      if(at(c,r-1)==='W') g.fillRect(x,y,T,4);
      if(at(c,r+1)==='W') g.fillRect(x,y+T-4,T,4);
      if(at(c-1,r)==='W') g.fillRect(x,y,4,T);
      if(at(c+1,r)==='W') g.fillRect(x+T-4,y,4,T);
    }

    // --- crops ---
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      if(at(c,r)!==',') continue;
      const x=c*T, y=r*T, hv=hash2(c*3,r*5);
      g.fillStyle='#6b5531';
      rr(g,x+1,y+1,T-2,T-2,6); g.fill();
      g.fillStyle='rgba(0,0,0,.12)';
      g.fillRect(x+4,y+8,T-8,1.5); g.fillRect(x+4,y+18,T-8,1.5); g.fillRect(x+4,y+27,T-8,1.5);
      for(let i=0;i<3;i++){
        const sx=x+6+i*10+(hv-0.5)*3;
        for(const sy of [y+6,y+16,y+25]){
          g.strokeStyle='#8ab04e'; g.lineWidth=1.8; g.lineCap='round';
          g.beginPath(); g.moveTo(sx,sy+5); g.quadraticCurveTo(sx+(hv-0.5)*4, sy, sx+(hv-0.5)*6, sy-2); g.stroke();
          g.strokeStyle='#a4c968'; g.lineWidth=1.2;
          g.beginPath(); g.moveTo(sx+2,sy+5); g.lineTo(sx+3,sy); g.stroke();
        }
      }
    }

    // --- slopes & plateau (highlands) ---
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      const ch=at(c,r);
      if(ch!=='1'&&ch!=='2'&&ch!=='3') continue;
      const x=c*T, y=r*T, hv=hash2(c*19+curScr,r*23);
      if(ch==='3'){
        g.fillStyle=shade(th.g3,1.12); g.fillRect(x,y,T,T);
        if(hv>0.65){ g.fillStyle='rgba(255,255,255,.15)'; g.fillRect(x+hv*24,y+(hv*53)%24,3,2); }
        const rim=(cc,rr)=> at(cc,rr)!=='3';
        g.lineCap='round';
        g.strokeStyle='rgba(28,38,18,.55)'; g.lineWidth=2.2;
        g.beginPath();
        if(rim(c,r+1)){ g.moveTo(x,y+T-1); g.lineTo(x+T,y+T-1); }
        if(rim(c-1,r)){ g.moveTo(x+1,y); g.lineTo(x+1,y+T); }
        if(rim(c+1,r)){ g.moveTo(x+T-1,y); g.lineTo(x+T-1,y+T); }
        g.stroke();
        if(rim(c,r-1)){ g.strokeStyle='rgba(255,255,240,.28)'; g.lineWidth=1.6;
          g.beginPath(); g.moveTo(x,y+1.5); g.lineTo(x+T,y+1.5); g.stroke(); }
      } else {
        const steep=ch==='2';
        g.fillStyle=shade(th.g1, steep?0.74:0.87); g.fillRect(x,y,T,T);
        g.strokeStyle= steep? 'rgba(0,0,0,.24)':'rgba(0,0,0,.16)';
        g.lineWidth=1.3; g.lineCap='round';
        const n=steep?4:3;
        for(let i=0;i<n;i++){                          // downhill hachures
          const hx=x+4+((hv*83+i*37)%24), hy=y+3+((hv*41+i*17)%22);
          g.beginPath(); g.moveTo(hx,hy); g.lineTo(hx-1.5, hy+(steep?7:5)); g.stroke();
        }
        if(steep && hv>0.4){                            // loose scree
          g.fillStyle='rgba(255,255,255,.12)';
          g.beginPath(); g.arc(x+6+hv*20, y+8+(hv*47)%16, 1.6, 0, 7); g.fill();
        }
      }
    }

    // --- chasm / gap (fillable pit) ---
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      if(at(c,r)!=='V') continue;
      const x=c*T, y=r*T;
      g.fillStyle='#0c0a08'; g.fillRect(x,y,T,T);
      const pg=g.createRadialGradient(x+16,y+16,2,x+16,y+16,18);
      pg.addColorStop(0,'rgba(0,0,0,.9)'); pg.addColorStop(1,'rgba(40,32,24,.3)');
      g.fillStyle=pg; g.beginPath(); g.arc(x+16,y+16,16,0,7); g.fill();
      g.strokeStyle='rgba(0,0,0,.6)'; g.lineWidth=2;
      g.beginPath(); g.ellipse(x+16,y+16,14,9,0,0,7); g.stroke();
    }

    // --- water ---
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      if(at(c,r)!=='W') continue;
      const x=c*T, y=r*T, hv=hash2(c+curScr,r*17);
      const nearLand = walkCh(at(c-1,r))||walkCh(at(c+1,r))||walkCh(at(c,r-1))||walkCh(at(c,r+1));
      const wg=g.createLinearGradient(x,y,x,y+T);
      wg.addColorStop(0, nearLand? '#3b83c8':'#2b66a8');
      wg.addColorStop(1, nearLand? '#3579bc':'#255c9a');
      g.fillStyle=wg; g.fillRect(x,y,T,T);
      // moving highlights (differ per phase)
      g.strokeStyle='rgba(255,255,255,.20)'; g.lineWidth=1.6; g.lineCap='round';
      const off= phase? 8 : 0;
      g.beginPath(); g.moveTo(x+4+((hv*20+off)%18), y+9+hv*6);
      g.quadraticCurveTo(x+10+((hv*20+off)%18), y+7+hv*6, x+15+((hv*20+off)%18)%T+ (x+15>x+T-2? -10:0), y+9+hv*6); g.stroke();
      g.strokeStyle='rgba(255,255,255,.12)';
      g.beginPath(); g.moveTo(x+2+((hv*32+off*1.5)%16), y+22);
      g.quadraticCurveTo(x+8+((hv*32+off*1.5)%16), y+20, x+13+((hv*32+off*1.5)%16), y+22); g.stroke();
    }
    // shorelines (after all water base)
    g.lineCap='round';
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      if(at(c,r)!=='W') continue;
      const x=c*T, y=r*T;
      const edges=[];
      if(walkCh(at(c,r-1))) edges.push(['h',x,y,x+T,y]);
      if(walkCh(at(c,r+1))) edges.push(['h',x,y+T,x+T,y+T]);
      if(walkCh(at(c-1,r))) edges.push(['v',x,y,x,y+T]);
      if(walkCh(at(c+1,r))) edges.push(['v',x+T,y,x+T,y+T]);
      for(const [o,x0,y0,x1,y1] of edges){
        // wet darkening just inside water
        g.strokeStyle='rgba(10,30,60,.35)'; g.lineWidth=5;
        g.beginPath();
        if(o==='h'){ const iy=y0===y? y0+2.5 : y0-2.5; g.moveTo(x0+1,iy); g.lineTo(x1-1,iy); }
        else { const ix=x0===x? x0+2.5 : x0-2.5; g.moveTo(ix,y0+1); g.lineTo(ix,y1-1); }
        g.stroke();
        // foam
        g.strokeStyle= phase? 'rgba(235,246,255,.75)':'rgba(220,238,255,.6)';
        g.lineWidth= phase? 2.2:2.8;
        g.beginPath();
        if(o==='h'){ g.moveTo(x0+2,y0); g.quadraticCurveTo((x0+x1)/2, y0+(y0===y? 2:-2)*(phase?1:0.4), x1-2,y0); }
        else { g.moveTo(x0,y0+2); g.quadraticCurveTo(x0+(x0===x? 2:-2)*(phase?1:0.4), (y0+y1)/2, x1,y1-2); }
        g.stroke();
      }
    }

    // --- fences ---
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      if(at(c,r)!=='F') continue;
      const x=c*T, y=r*T;
      g.strokeStyle='#5c4f3c'; g.lineWidth=3;
      g.beginPath(); g.moveTo(x,y+15); g.lineTo(x+T,y+15); g.moveTo(x,y+23); g.lineTo(x+T,y+23); g.stroke();
      for(const px of [x+6,x+22]){
        const pg=g.createLinearGradient(px-2.5,0,px+2.5,0);
        pg.addColorStop(0,'#75654c'); pg.addColorStop(0.5,'#61533e'); pg.addColorStop(1,'#4a3f30');
        g.fillStyle=pg;
        rr(g,px-2.5,y+8,5,21,2); g.fill();
        g.fillStyle='rgba(255,255,255,.10)'; g.beginPath(); g.arc(px,y+9,2,Math.PI,0); g.fill();
      }
    }

    // --- fortress walls ---
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      if(at(c,r)!=='#') continue;
      const x=c*T, y=r*T;
      g.fillStyle='#3c3934'; g.fillRect(x,y,T,T);
      const stones= (r%2)? [[1,1,14,13],[17,1,14,13],[1,17,30,13]] : [[1,1,30,13],[1,17,14,13],[17,17,14,13]];
      for(const [sx,sy,sw,sh] of stones){
        const sg=g.createLinearGradient(x+sx,y+sy,x+sx,y+sy+sh);
        sg.addColorStop(0,'#6e6a62'); sg.addColorStop(1,'#524e47');
        g.fillStyle=sg; rr(g,x+sx,y+sy,sw,sh,3); g.fill();
        g.fillStyle='rgba(255,255,255,.10)'; rr(g,x+sx+1.5,y+sy+1.5,sw-3,3,2); g.fill();
      }
    }

    // --- border forest / cliffs: continuous organic band, no tile seams ---
    const bTiles=[];
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      const ch=at(c,r);
      if((r===0||r===ROWS-1||c===0||c===COLS-1) && (ch==='T'||ch==='R')) bTiles.push([c,r,ch]);
    }
    const jit=(c,r,k)=> (hash2(c*13+k, r*7+curScr+k)-0.5);
    // 1) soft shadow spilling onto the ground
    g.fillStyle='rgba(0,0,0,.16)';
    for(const [c,r] of bTiles){
      g.beginPath(); g.arc(c*T+16+jit(c,r,1)*10, r*T+16+jit(c,r,2)*10, 21.5, 0, 7); g.fill();
    }
    // 2) dark under-band (forest floor / scree behind the crowns)
    for(const [c,r,ch] of bTiles){
      g.fillStyle= ch==='T' ? '#142c0f' : '#38342d';
      g.beginPath(); g.arc(c*T+16+jit(c,r,3)*8, r*T+16+jit(c,r,4)*8, 17.5+hash2(c,r)*3.5, 0, 7); g.fill();
    }
    // 3) fill hard to the outer screen edge (no gaps at corners)
    for(const [c,r,ch] of bTiles){
      g.fillStyle= ch==='T' ? '#142c0f' : '#38342d';
      const x=c*T, y=r*T;
      if(r===0) g.fillRect(x-1,y,T+2,17);
      if(r===ROWS-1) g.fillRect(x-1,y+15,T+2,17);
      if(c===0) g.fillRect(x,y-1,17,T+2);
      if(c===COLS-1) g.fillRect(x+15,y-1,17,T+2);
    }
    // 4) individual tree crowns / boulders, y-sorted so they overlap like a canopy
    const crowns=[];
    for(const [c,r,ch] of bTiles){
      for(let i=0;i<2;i++){
        const h1=hash2(c*29+i*17, r*11+curScr*3);
        const h2=hash2(c*7+i*23, r*31+curScr);
        crowns.push({ x:c*T+6+h1*20, y:r*T+6+h2*20,
          rad: 8+ (ch==='T'? h1:h2)*4.5, tone:Math.floor(h2*3)%3, kind:ch });
      }
    }
    crowns.sort((a,b)=>a.y-b.y);
    for(const cr of crowns){
      if(cr.kind==='T') paintCrown(g,cr.x,cr.y,cr.rad,cr.tone);
      else paintBoulder(g,cr.x,cr.y,cr.rad,cr.tone);
    }

    // --- bridge planks ---
    if(curScr===6 && built.has('bridge')){
      const bx=12*T, by=5*T;
      g.fillStyle='rgba(0,0,0,.25)'; rr(g,bx-3,by+2,2*T+6,2*T+4,4); g.fill();
      const wg2=g.createLinearGradient(bx,by,bx,by+2*T);
      wg2.addColorStop(0,'#b08a52'); wg2.addColorStop(1,'#96713d');
      g.fillStyle=wg2; rr(g,bx-3,by-2,2*T+6,2*T+4,4); g.fill();
      g.strokeStyle='rgba(60,40,15,.5)'; g.lineWidth=1.6;
      for(let i=1;i<8;i++){ g.beginPath(); g.moveTo(bx-3+i*8.5,by-2); g.lineTo(bx-3+i*8.5,by+2*T+2); g.stroke(); }
      g.fillStyle='#7d5c2e';
      rr(g,bx-5,by-7,2*T+10,5,2.5); g.fill();
      rr(g,bx-5,by+2*T+2,2*T+10,5,2.5); g.fill();
    }

    /* --- zone wash: the whole screen agrees on one light --- */
    if(th.washA>0){
      const wg3=g.createLinearGradient(0,0,RW*0.35,RH);
      wg3.addColorStop(0, hexA(th.wash, th.washA*0.65));
      wg3.addColorStop(1, hexA(th.wash, th.washA*1.25));
      g.fillStyle=wg3; g.fillRect(0,0,RW,RH);
    }
    if(th.sun>0){
      const sg=g.createRadialGradient(RW*0.22,-RH*0.15,10, RW*0.22,-RH*0.15, RH*1.5);
      sg.addColorStop(0,'rgba(255,250,225,'+th.sun.toFixed(3)+')');
      sg.addColorStop(1,'rgba(255,250,225,0)');
      g.fillStyle=sg; g.fillRect(0,0,RW,RH);
    }
    // edges settle down so the screen reads as a place, not a crop
    const vg=g.createRadialGradient(RW/2,RH/2,RH*0.42, RW/2,RH/2, RH*0.95);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.16)');
    g.fillStyle=vg; g.fillRect(0,0,RW,RH);
  }
  groundScr=curScr; groundBuiltHash=[...built].join(',');
}

/* --- soft shadow --- */
/* world-y in; GFX does the actual painting so every screen matches */
function drawShadow(x,y,w,a){ GFX.shadow(ctx, x, y+HUD, w, a); }
/* deco kind -> [dx from d.x, dy from d.y (contact point), half-width].
   Matches each painter's own base line; kinds omitted on purpose sit
   in the ground rather than on it and would look wrong with a blob. */
const DECO_SHADOW={
  house:[32,60,34], tent:[16,30,21], well:[16,28,16],
  stall:[16,30,22], bench:[16,28,15], lamp:[16,30,6],
  board:[16,28,13], cropsign:[16,26,9], trellis:[16,30,18],
  tomato:[16,30,12], trail:[16,30,8], rosedoor:[16,26,16],
  trough:[16,28,15], radtomato:[16,22,7],
  armpile:[16,28,18], cookfire:[16,26,13],
  statue:[16,28,13], cypherstone:[16,30,15], extlink:[16,28,10],
  wreck:[16,30,20]
};
function outlined(fill){
  ctx.fillStyle=fill; ctx.fill();
  ctx.strokeStyle=GFX.INK; ctx.lineWidth=1.6; ctx.lineJoin='round'; ctx.stroke();
}

/* --- sprite painters (feet-anchored: x=center, y=feet) --- */
function drawTree(x,y,shake,theme){
  const sx = shake>0 ? Math.sin(shake*2)*2 : 0;
  const Y=y+HUD;
  const tg=ctx.createLinearGradient(x-4,0,x+4,0);
  tg.addColorStop(0,'#7d5a32'); tg.addColorStop(1,'#5c3f1e');
  ctx.fillStyle=tg;
  rr(ctx,x-4+sx*0.3,Y-15,8,15,3); ctx.fill();
  const cols= theme==='rock'? ['#5d7d42','#4a662f','#6f955a'] : ['#3f7d30','#316327','#57944a'];
  const blob=(bx,by,rad,c0,c1)=>{
    const cg=ctx.createRadialGradient(bx-rad*0.35,by-rad*0.4,1,bx,by,rad);
    cg.addColorStop(0,c0); cg.addColorStop(1,c1);
    ctx.fillStyle=cg;
    ctx.beginPath(); ctx.arc(bx,by,rad,0,7); ctx.fill();
  };
  blob(x+sx, Y-25, 15, cols[0], shade(cols[1],0.85));
  blob(x-8+sx, Y-31, 11, cols[2], cols[1]);
  blob(x+8+sx, Y-32, 11, cols[2], cols[1]);
  blob(x-1+sx, Y-38, 10, shade(cols[2],1.12), cols[0]);
  ctx.fillStyle='rgba(255,255,255,.18)';
  ctx.beginPath(); ctx.arc(x-4+sx, Y-41, 4, 0, 7); ctx.fill();
}
function drawRock(x,y,shake){
  const sx = shake>0 ? Math.sin(shake*2)*1.5 : 0;
  const Y=y+HUD;
  const rg=ctx.createLinearGradient(x-13,Y-18,x+10,Y);
  rg.addColorStop(0,'#a8a396'); rg.addColorStop(0.6,'#87826f'); rg.addColorStop(1,'#5f5a4c');
  ctx.beginPath();
  ctx.moveTo(x-13+sx,Y); ctx.quadraticCurveTo(x-14+sx,Y-11, x-7+sx,Y-15);
  ctx.quadraticCurveTo(x-1+sx,Y-20, x+6+sx,Y-16);
  ctx.quadraticCurveTo(x+14+sx,Y-11, x+13+sx,Y);
  ctx.closePath();
  ctx.fillStyle=rg; ctx.fill();
  ctx.strokeStyle='rgba(30,28,22,.4)'; ctx.lineWidth=1.4; ctx.stroke();
  ctx.strokeStyle='rgba(40,38,30,.35)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(x-4+sx,Y-16); ctx.lineTo(x-1+sx,Y-8); ctx.lineTo(x-5+sx,Y-2); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.3)';
  ctx.beginPath(); ctx.ellipse(x-5+sx,Y-13,4,2.4,-0.5,0,7); ctx.fill();
}
function drawHouse(x,y){
  const bx=x, by=y+HUD;
  const wg=ctx.createLinearGradient(0,by+18,0,by+60);
  wg.addColorStop(0,'#d9c7a5'); wg.addColorStop(1,'#b5a17c');
  ctx.fillStyle=wg; rr(ctx,bx+2,by+18,60,42,3); ctx.fill();
  ctx.strokeStyle='rgba(60,45,25,.35)'; ctx.lineWidth=1.4; ctx.stroke();
  // timber frame
  ctx.strokeStyle='rgba(105,78,44,.55)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(bx+2,by+28); ctx.lineTo(bx+62,by+28); ctx.stroke();
  // door

/* Cabinet-name labels WORD-WRAP: any name with 2+ words and more than 11
   characters breaks into two lines at the most balanced word boundary, so
   long names (FIREBALL MAZE, SENTINEL'S NEST...) never collide with a
   neighbour's. y is the BOTTOM line's baseline — the wrap grows upward. */
function drawCabLabel(text,x,y,color){
  if(text.includes(' ') && text.length>11){
    const w=text.split(' ');
    let best=1, bd=1e9;
    for(let i=1;i<w.length;i++){
      const d=Math.abs(w.slice(0,i).join(' ').length - w.slice(i).join(' ').length);
      if(d<bd){ bd=d; best=i; }
    }
    drawLabel(w.slice(0,best).join(' '), x, y-11, color);
    drawLabel(w.slice(best).join(' '), x, y, color);
  } else drawLabel(text,x,y,color);
}

  bodyG.addColorStop(0,'#23253a'); bodyG.addColorStop(0.5,'#3a3d58'); bodyG.addColorStop(1,'#1a1b2c');
  ctx.fillStyle=bodyG; rr(ctx,bx-16,by-46,32,46,3); ctx.fill();
  ctx.strokeStyle='rgba(8,8,14,.85)'; ctx.lineWidth=1.6; ctx.stroke();
  // blinking marquee
  const on=(frame>>4)%2;
  ctx.fillStyle= on? '#ff4fa0':'#a03468';
  rr(ctx,bx-14,by-44,28,9,2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 7px '+FONT; ctx.textAlign='center';
  ctx.fillText('ARCADE', bx, by-37.5);
  // CRT attract mode
  ctx.fillStyle='#05060a'; rr(ctx,bx-12,by-33,24,15,2); ctx.fill();
  ctx.save(); ctx.beginPath(); rr(ctx,bx-12,by-33,24,15,2); ctx.clip();
  ctx.fillStyle='#5ad4c8'; ctx.fillRect(bx-10+((frame>>2)%22), by-28, 3,3);
  ctx.fillStyle='#ff7043'; ctx.fillRect(bx+7-((frame>>2)%22), by-23, 3,3);
  ctx.restore();
  const gl=ctx.createRadialGradient(bx,by-26,2,bx,by-26,20);
  gl.addColorStop(0,'rgba(90,212,200,.22)'); gl.addColorStop(1,'rgba(90,212,200,0)');
  ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(bx,by-26,20,0,7); ctx.fill();
  // control deck: joystick + buttons
  ctx.fillStyle='#23252f'; rr(ctx,bx-14,by-17,28,7,2); ctx.fill();
  ctx.strokeStyle='#c9c4ba'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(bx-7,by-14); ctx.lineTo(bx-7,by-19); ctx.stroke();
  ctx.fillStyle='#e05050'; ctx.beginPath(); ctx.arc(bx-7,by-20,2,0,7); ctx.fill();
  ctx.fillStyle='#f2d24b'; ctx.beginPath(); ctx.arc(bx+3,by-13.5,2,0,7); ctx.fill();
  ctx.fillStyle='#4fc3f7'; ctx.beginPath(); ctx.arc(bx+9,by-13.5,2,0,7); ctx.fill();
  // base + coin door
  ctx.fillStyle='#2a2c38'; rr(ctx,bx-14,by-9,28,9,2); ctx.fill();
  ctx.fillStyle='#3d4054'; rr(ctx,bx-4,by-7.5,8,6,1); ctx.fill();
  ctx.fillStyle='#c9c4ba'; ctx.fillRect(bx-1.2,by-6.5,2.4,1.4);
  drawLabel('ENTER THE ARCADE', bx, by-52, '#ff9ecf');
  if(Math.hypot(PL.x-bx,PL.y-(y+24))<56) drawLabel('[SPACE]', bx, by+10, '#ffffff');
}

/* Arcade hub cabinets: one per mini-world, locked until criteria met */
/* Scott's abstract card for the yards — 70x75 on white. Loaded the same way
   the title paintings are: the game NEVER waits on art, so if it is missing
   the sign still stands, just as a plain plate with the same pulsing mark. */
const SIGN_W=70, SIGN_H=75;
let signImg=null, signDead=false;
(function(){
  try{
    const im=new Image();
    im.onload=()=>{ signImg=im; };
    im.onerror=()=>{ signDead=true; };
    im.src='images/contraption.jpg';
  }catch(e){ signDead=true; }
})();
/* the sign: a picture on a post, and a question mark that will not sit still.
   Drawn with its FOOT on the portal's baseline so it grows upward out of the
   grass — anchored to the tile, never to the canvas, so it cannot drift if the
   screen is ever re-laid. */
function drawSignPortal(p){
  const x=p.x, y=p.y+HUD;
  const sx=x-SIGN_W/2, sy=y-SIGN_H;
  ctx.fillStyle='rgba(6,8,14,.34)';                       // it stands on the ground
  ctx.beginPath(); ctx.ellipse(x, y+2, SIGN_W*0.42, 5, 0, 0, 7); ctx.fill();
  ctx.fillStyle='rgba(8,10,16,.45)';                      // and casts down-right
  rr(ctx, sx+3, sy+4, SIGN_W, SIGN_H, 5); ctx.fill();
  ctx.fillStyle='#f4f1ea';                                // the card itself
  rr(ctx, sx, sy, SIGN_W, SIGN_H, 5); ctx.fill();
  if(signImg){
    ctx.save();
    ctx.beginPath(); rr(ctx, sx, sy, SIGN_W, SIGN_H, 5); ctx.clip();
    const sc=Math.max(SIGN_W/signImg.width, SIGN_H/signImg.height);
    const dw=signImg.width*sc, dh=signImg.height*sc;
    ctx.drawImage(signImg, sx+(SIGN_W-dw)/2, sy+(SIGN_H-dh)/2, dw, dh);
    ctx.restore();
  }
  ctx.strokeStyle='rgba(20,24,34,.75)'; ctx.lineWidth=1.6;
  rr(ctx, sx, sy, SIGN_W, SIGN_H, 5); ctx.stroke();
  /* THE QUESTION MARK. Scott asked for it to pulse, so it breathes in SIZE as
     well as in ink — a mark that only changes opacity reads as a flicker on a
     white card, where one that also swells reads as a heartbeat. */
  const pu=0.5+0.5*Math.sin(frame*0.075);
  const fs=Math.round(38+pu*7);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold '+fs+'px '+FONT;
  ctx.fillStyle='rgba(255,255,255,'+(0.55+0.35*pu).toFixed(2)+')';   // halo, for the light card
  ctx.fillText('?', x, sy+SIGN_H/2+1.5);
  ctx.fillStyle='rgba(24,28,40,'+(0.72+0.28*pu).toFixed(2)+')';
  ctx.fillText('?', x, sy+SIGN_H/2);
  ctx.textBaseline='alphabetic';
  drawLabel('CONTRAPTION  [SPACE]', x, sy-12, '#7fd0e8');
}
function drawPortal(p){
  if(p.sign){ drawSignPortal(p); return; }
  const def=PORTAL_DEF[p.key], x=p.x, y=p.y+HUD;
  if(p.key==='exit'||p.key==='arcback'){
    const pul=0.5+Math.sin(frame*0.08)*0.25;
    ctx.strokeStyle='rgba(232,193,90,'+pul.toFixed(2)+')'; ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.ellipse(x,y-3,16,7,0,0,7); ctx.stroke();
    ctx.strokeStyle='rgba(232,193,90,'+(pul*0.5).toFixed(2)+')';
    ctx.beginPath(); ctx.ellipse(x,y-3,10,4.4,0,0,7); ctx.stroke();
    drawLabel(p.key==='exit'?'EXIT  [SPACE]':'ARCADE  [SPACE]', x, y-22, '#ffe9a0');
    return;
  }
  if(p.key==='terminal'){ drawArchiveKeeper(p); return; }
  if(p.key==='remnants'){ drawRemnantsDoor(p); return; }
  const ok=def.ok();
  const bodyG=ctx.createLinearGradient(x-15,0,x+15,0);
  bodyG.addColorStop(0,'#20222e'); bodyG.addColorStop(0.5,'#343748'); bodyG.addColorStop(1,'#191a24');
  ctx.fillStyle=bodyG; rr(ctx,x-15,y-44,30,44,3); ctx.fill();
  ctx.strokeStyle='rgba(8,8,14,.8)'; ctx.lineWidth=1.5; ctx.stroke();
  // marquee
  ctx.fillStyle= ok? def.color : '#3a3d4a';
  rr(ctx,x-13,y-42,26,8,2); ctx.fill();
  // screen
  ctx.fillStyle='#05060a'; rr(ctx,x-11,y-32,22,14,2); ctx.fill();
  if(ok){
    ctx.save(); ctx.beginPath(); rr(ctx,x-11,y-32,22,14,2); ctx.clip();
    const t2=frame*0.05;
    if(p.key==='fireball'){
      ctx.fillStyle='#ff7043';
      ctx.beginPath(); ctx.arc(x-4+Math.sin(t2)*4, y-25, 3+Math.sin(t2*2), 0, 7); ctx.fill();
      ctx.fillStyle='#ffd23e';
      for(let i=0;i<3;i++) ctx.fillRect(x+2+i*4, y-26, 2, 2);
    } else if(p.key==='contraption'){
      // a ball forever turning the same two mirror corners
      const ph=(t2*2)%4, sx= ph<1? -7+ph*14 : ph<2? 7 : ph<3? 7-(ph-2)*14 : -7;
      const sy= ph<1? -29 : ph<2? -29+(ph-1)*7 : ph<3? -22 : -22-(ph-3)*7;
      ctx.fillStyle='#8fb4d8'; ctx.fillRect(x+5,y-31,4,4); ctx.fillRect(x+5,y-24,4,4);
      ctx.fillStyle='#e8f2ff';
      ctx.beginPath(); ctx.arc(x+sx,y+sy,2.2,0,7); ctx.fill();
      ctx.fillStyle='#7fdb7f'; ctx.fillRect(x-9,y-24,3,5);
    } else if(p.key==='shop'){
      // a coin tumbling into a slot, over and over, waiting for a shop
      ctx.fillStyle='#ffd23f';
      ctx.beginPath(); ctx.arc(x, y-30+((t2*7)%11), 3.2, 0, 7); ctx.fill();
      ctx.fillStyle='#8a6a10'; ctx.fillRect(x-6, y-21, 12, 2);
      ctx.fillStyle='#fff3c4'; ctx.fillRect(x-1, y-30+((t2*7)%11)-1, 1.5, 2);
    } else if(p.key==='caverns'){
      ctx.strokeStyle='#b08a52'; ctx.lineWidth=1.3;
      ctx.beginPath(); ctx.moveTo(x-8,y-30); ctx.lineTo(x+8,y-30); ctx.stroke();
      ctx.fillStyle='#5ad4c8'; ctx.fillRect(x-1+Math.sin(t2)*5, y-29, 3, 3);
      ctx.fillStyle='#8a857a'; ctx.fillRect(x-9,y-22,7,2); ctx.fillRect(x+3,y-24,7,2);
    } else if(p.key==='jungle'){
      ctx.strokeStyle='#7ac74f'; ctx.lineWidth=1.4;
      for(let i=0;i<3;i++){
        ctx.beginPath(); ctx.moveTo(x-7+i*7,y-32);
        ctx.quadraticCurveTo(x-7+i*7+Math.sin(t2+i)*3, y-26, x-7+i*7, y-19); ctx.stroke();
      }
    } else if(p.key==='quarry'){
      ctx.fillStyle='#8a857a';
      ctx.fillRect(x-9,y-21,18,2);
      ctx.fillStyle='#e8c15a';
      ctx.fillRect(x-6+Math.sin(t2)*4, y-27, 4, 4);
      ctx.fillStyle='#c9c2b4'; ctx.fillRect(x+4, y-31+((t2*6)%9), 3, 3);
    } else if(p.key==='workings'){
      ctx.fillStyle='#7d5334'; ctx.fillRect(x-11,y-24,22,6);   // the spoil line
      ctx.fillStyle='#9aa0b5';                                  // a rock coming down
      ctx.fillRect(x-6, y-32+((t2*7)%10), 4, 4);
      ctx.fillStyle='#4fe0c8';                                  // and a gem waiting
      ctx.beginPath();
      ctx.moveTo(x+5,y-30); ctx.lineTo(x+8,y-27); ctx.lineTo(x+5,y-24); ctx.lineTo(x+2,y-27);
      ctx.closePath(); ctx.fill();
    } else if(p.key==='pacsphere'){
      // a little globe of pellets with a pac orbiting it
      ctx.strokeStyle='#4a5aa8'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.arc(x,y-26,8,0,7); ctx.stroke();
      ctx.fillStyle='#ffe9a8';
      for(let i=0;i<5;i++){ const a=t2*0.7+i*1.256;
        ctx.fillRect(x+Math.cos(a)*8-1, y-26+Math.sin(a)*3.2-1, 2, 2); }
      const pa2=t2*1.3;
      ctx.fillStyle='#ffe14a';
      ctx.beginPath(); ctx.arc(x+Math.cos(pa2)*10, y-26+Math.sin(pa2)*4.5, 3, 0.5, 5.8); ctx.fill();
    } else if(p.key==='highroads'){
      // a raised block with a dot hopping over it — the whole game in 12px
      ctx.fillStyle='#1f3f8c'; ctx.fillRect(x-10,y-24,9,7);
      ctx.fillStyle='#3f7de8'; ctx.fillRect(x-10,y-26,9,3);
      ctx.fillStyle='#1f3f8c'; ctx.fillRect(x+2,y-24,9,7);
      ctx.fillStyle='#3f7de8'; ctx.fillRect(x+2,y-26,9,3);
      ctx.fillStyle='#ffd23f';
      ctx.beginPath(); ctx.arc(x-4+((t2*9)%12), y-31-Math.abs(Math.sin(t2*1.6))*6, 3, 0.5, 5.8); ctx.fill();
      ctx.fillStyle='#ffe9a8'; ctx.fillRect(x+6,y-31,2,2);
    } else if(p.key==='terminal'){
      ctx.fillStyle='#7fdb7f';
      for(let i=0;i<3;i++) ctx.fillRect(x-9, y-30+i*4, 6+(((frame>>3)+i)%3)*4, 1.6);
      if((frame>>4)%2) ctx.fillRect(x+1,y-22,3,1.6);
    }
    ctx.restore();
    const gl=ctx.createRadialGradient(x,y-25,2,x,y-25,17);
    gl.addColorStop(0,def.color+'3a'); gl.addColorStop(1,def.color+'00');
    ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(x,y-25,17,0,7); ctx.fill();
  } else {
    ctx.fillStyle='#8a8fa5';
    rr(ctx,x-4,y-27,8,6,1); ctx.fill();
    ctx.strokeStyle='#8a8fa5'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.arc(x,y-27,3,Math.PI,0); ctx.stroke();
  }
  // deck + buttons + base
  ctx.fillStyle='#23252f'; rr(ctx,x-13,y-16,26,6,2); ctx.fill();
  ctx.fillStyle='#e05050'; ctx.beginPath(); ctx.arc(x-5,y-13,1.8,0,7); ctx.fill();
  ctx.fillStyle='#f2d24b'; ctx.beginPath(); ctx.arc(x+1,y-13,1.8,0,7); ctx.fill();
  ctx.fillStyle='#2a2c38'; rr(ctx,x-13,y-9,26,9,2); ctx.fill();
  /* Two label lanes. Neighbours in a row alternate, so a long name never
     runs into the one beside it — set explicitly per cabinet (`lift`) rather
     than derived from the column, because the right stagger depends on how
     long the NAMES are, which no formula knows. test_arcade.js measures it. */
  drawCabLabel(def.label, x, y-48-(p.lift||0), ok? '#ffe9a0':'#9aa0b5');
  if(Math.hypot(PL.x-p.x,PL.y-p.y)<58){
    drawLabel(ok? (def.live? '[SPACE] play' : 'unlocked — cabinet soon') : 'LOCKED: '+def.req, x, y+13, ok? '#ffffff':'#ffb0b0');
  }
}

/* the shabby door to the REJECTS back room — hinges, gap-glow, one cobweb */
function drawRemnantsDoor(p){
  const x=p.x, y=p.y+HUD;
  // frame
  ctx.fillStyle='#171320'; rr(ctx,x-18,y-50,36,50,3); ctx.fill();
  ctx.strokeStyle='rgba(6,4,10,.9)'; ctx.lineWidth=2; ctx.stroke();
  // the door itself, hanging slightly crooked
  ctx.save(); ctx.translate(x,y-24); ctx.rotate(0.015);
  const dg=ctx.createLinearGradient(-14,0,14,0);
  dg.addColorStop(0,'#3a3046'); dg.addColorStop(0.5,'#4a3f5a'); dg.addColorStop(1,'#2c2438');
  ctx.fillStyle=dg; rr(ctx,-14,-22,28,46,2); ctx.fill();
  ctx.strokeStyle='rgba(10,6,16,.7)'; ctx.lineWidth=1.4; ctx.stroke();
  // planks + handle
  ctx.strokeStyle='rgba(10,6,16,.4)'; ctx.lineWidth=1;
  for(const px of [-5,4]){ ctx.beginPath(); ctx.moveTo(px,-21); ctx.lineTo(px,23); ctx.stroke(); }
  ctx.fillStyle='#8a8fa5'; ctx.beginPath(); ctx.arc(9,3,2,0,7); ctx.fill();
  ctx.restore();
  // flicker spilling through the gap under the door
  const fl=remnantsFlicker();
  ctx.fillStyle='rgba(255,230,170,'+(0.30*fl).toFixed(2)+')';
  ctx.fillRect(x-13,y-2,26,2.4);
  // one corner cobweb
  drawCobweb(x-18,y-50, 14, 0);
  drawCabLabel('ARCADE REJECTS', x, y-56, '#9aa0b5');
  if(Math.hypot(PL.x-p.x,PL.y-p.y)<58) drawLabel('[SPACE] enter', x, y+13, '#ffffff');
}

/* REJECTS furniture — all of it solid, all of it in the way. */
function drawShelf(d){
  const x=d.x+2, w=d.w*T-4, base=d.y+HUD+30;
  ctx.fillStyle='rgba(0,0,0,.32)'; ctx.beginPath(); ctx.ellipse(x+w/2,base+2,w/2,4,0,0,7); ctx.fill();
  const g=ctx.createLinearGradient(0,base-48,0,base);
  g.addColorStop(0,'#4a3a30'); g.addColorStop(1,'#302520');
  ctx.fillStyle=g; rr(ctx,x,base-48,w,48,2); ctx.fill();
  ctx.strokeStyle='rgba(12,8,6,.7)'; ctx.lineWidth=1.6; ctx.stroke();
  // side uprights
  ctx.fillStyle='rgba(12,8,6,.35)'; ctx.fillRect(x+1,base-47,3,46); ctx.fillRect(x+w-4,base-47,3,46);
  // two boards of forgotten stock, hash-cluttered
  for(const [bi,sy] of [[0,base-31],[1,base-14]]){
    ctx.fillStyle='#5c4736'; ctx.fillRect(x+3,sy,w-6,3);
    for(let i=0;i<Math.floor(w/15);i++){
      const hv=hash2(d.x+i*17+bi*7, d.y+bi*31);
      const ix=x+7+i*15+hv*4;
      if(hv<0.34){         // dusty little crate
        ctx.fillStyle='#6a5238'; ctx.fillRect(ix,sy-10,11,10);
        ctx.strokeStyle='rgba(20,12,6,.5)'; ctx.lineWidth=1; ctx.strokeRect(ix,sy-10,11,10);
      } else if(hv<0.62){  // jar with something best left unexamined
        ctx.fillStyle='rgba(140,160,150,.55)'; rr(ctx,ix+1,sy-11,8,11,2); ctx.fill();
        ctx.fillStyle='#3a4438'; ctx.fillRect(ix+2.5,sy-6,5,5);
        ctx.fillStyle='#5c4736'; ctx.fillRect(ix+1,sy-13,8,2.4);
      } else if(hv<0.85){  // a dead game cartridge, spine out
        ctx.fillStyle=['#8a4a44','#4a5a78','#4a6a58'][Math.floor(hv*100)%3];
        ctx.fillRect(ix,sy-9,4,9); ctx.fillRect(ix+5,sy-7,4,7);
        ctx.fillStyle='rgba(230,225,210,.4)'; ctx.fillRect(ix+0.8,sy-7.5,2.4,2);
      }                    // else: an empty gap where something was taken
    }
  }
  ctx.fillStyle='rgba(216,214,228,.10)'; ctx.fillRect(x,base-48,w,1.6);   // dust on top
}
function drawBoxes(d){
  const bx=d.x+16, base=d.y+HUD+30, hv=hash2(d.x,d.y);
  ctx.fillStyle='rgba(0,0,0,.32)'; ctx.beginPath(); ctx.ellipse(bx,base+2,15,4,0,0,7); ctx.fill();
  const crate=(cx,cy,s)=>{
    const g=ctx.createLinearGradient(cx,0,cx+s,0);
    g.addColorStop(0,'#6e563a'); g.addColorStop(1,'#4e3c28');
    ctx.fillStyle=g; rr(ctx,cx,cy-s,s,s,1.5); ctx.fill();
    ctx.strokeStyle='rgba(20,12,6,.55)'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.strokeStyle='rgba(20,12,6,.3)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(cx+2,cy-s/2); ctx.lineTo(cx+s-2,cy-s/2); ctx.stroke();
  };
  crate(bx-15,base,17);
  crate(bx+2,base,13+hv*3);
  crate(bx-9+hv*6,base-17,13);                       // one stacked, off-centre
  if(hv>0.5){ ctx.strokeStyle='rgba(216,214,228,.22)'; ctx.lineWidth=0.8;   // webbed over
    ctx.beginPath(); ctx.moveTo(bx-15,base-30); ctx.quadraticCurveTo(bx,base-24,bx+15,base-13); ctx.stroke(); }
}
function drawDesk(d){
  const x=d.x+3, w=2*T-6, base=d.y+HUD+30;
  ctx.fillStyle='rgba(0,0,0,.32)'; ctx.beginPath(); ctx.ellipse(x+w/2,base+2,w/2,4,0,0,7); ctx.fill();
  // side panels + kneehole shadow
  ctx.fillStyle='#3c2f26'; ctx.fillRect(x+2,base-16,10,16); ctx.fillRect(x+w-12,base-16,10,16);
  ctx.fillStyle='rgba(6,4,8,.6)'; ctx.fillRect(x+12,base-14,w-24,14);
  // top slab
  const g=ctx.createLinearGradient(0,base-22,0,base-16);
  g.addColorStop(0,'#5c4736'); g.addColorStop(1,'#443428');
  ctx.fillStyle=g; rr(ctx,x,base-22,w,7,2); ctx.fill();
  ctx.strokeStyle='rgba(12,8,6,.7)'; ctx.lineWidth=1.4; ctx.stroke();
  // a dead little monitor, a leaning paper stack, a mug nobody washed
  ctx.fillStyle='#2c2a34'; rr(ctx,x+6,base-38,18,16,2); ctx.fill();
  ctx.fillStyle='#101018'; rr(ctx,x+8,base-36,14,11,1); ctx.fill();
  ctx.fillStyle='rgba(120,200,160,.12)'; ctx.fillRect(x+9,base-35,4,3);   // ghost of a cursor
  ctx.fillStyle='#2c2a34'; ctx.fillRect(x+12,base-23,6,2);
  ctx.save(); ctx.translate(x+38,base-22); ctx.rotate(-0.06);
  ctx.fillStyle='#c9c2ae'; ctx.fillRect(0,-6,14,6);
  ctx.fillStyle='#b5ae9a'; ctx.fillRect(0.8,-9,13,3);
  ctx.fillStyle='#c9c2ae'; ctx.fillRect(1.6,-11,12,2); ctx.restore();
  ctx.fillStyle='#7a5a4a'; rr(ctx,x+w-8,base-28,6,6,1); ctx.fill();
  ctx.strokeStyle='#7a5a4a'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(x+w-1.5,base-25,2,-1.2,1.2); ctx.stroke();
}

/* One shared flicker signal so the door-gap glow and the room's bulb agree.
   Mostly on; occasional multi-frame dropouts; tiny mains shimmer on top. */
function remnantsFlicker(){
  const h=hash2((frame>>3)&2047, 91);
  if(h<0.07) return 0.10+hash2(frame,13)*0.25;          // dropout, sputtering
  if(h<0.13) return 0.55+Math.sin(frame*0.9)*0.2;       // struggling
  return 0.88+Math.sin(frame*0.21)*0.06;                // its version of steady
}
/* quarter-circle cobweb anchored at a corner. q: 0=hangs right-down from a
   top-left anchor, 1=left-down from a top-right anchor. */
function drawCobweb(ax,ay,rad,q){
  const sx=q? -1:1;
  ctx.strokeStyle='rgba(216,214,228,.30)'; ctx.lineWidth=0.9;
  for(let i=1;i<=3;i++){
    ctx.beginPath();
    ctx.arc(ax,ay,rad*i/3, q? Math.PI*0.5 : 0, q? Math.PI : Math.PI*0.5);
    ctx.stroke();
  }
  for(let i=0;i<=3;i++){
    const a=(q? Math.PI*0.5 : 0)+Math.PI*0.5*i/3;
    ctx.beginPath(); ctx.moveTo(ax,ay);
    ctx.lineTo(ax+Math.cos(a)*rad, ay+Math.sin(a)*rad); ctx.stroke();
  }
  // one dangling thread with a mote

/* scrolling Commodore-64 text-adventure teaser — white letters on blue */
function drawC64Terminal(bx,by,bw,bh){
  const g=ctx; g.save();

     collapsed, only the title strip remains and the floor shows through. */
  if(c64Min){
    g.fillStyle='#7b71d6'; rr(g,bx,by,bw,22,6); g.fill();
    g.fillStyle='#efe9ff'; g.font='bold 9px '+FONT; g.textAlign='left'; g.textBaseline='alphabetic';
    g.fillText('ADVENTURE!  ·  c64', bx+11, by+15);
    g.font='bold 12px '+FONT; g.fillText('+', bx+bw-16, by+16);
    g.restore(); return;
  }
  g.fillStyle='#7b71d6'; rr(g,bx,by,bw,bh,6); g.fill();              // light-blue shell
  g.fillStyle='#efe9ff'; g.font='bold 9px '+FONT; g.textAlign='left'; g.textBaseline='alphabetic';
  g.fillText('ADVENTURE!  ·  c64', bx+11, by+15);
  g.font='bold 12px '+FONT; g.fillText('−', bx+bw-16, by+16);
  g.fillStyle='#3f34ac'; rr(g,bx+9,by+22,bw-18,bh-31,3); g.fill();  // deep-blue screen
  g.beginPath(); rr(g,bx+9,by+22,bw-18,bh-31,3); g.clip();
  const total=C64_LINES.reduce((n,l)=>n+l[1].length+1,0), PAUSE=100;
  const rev=Math.floor(frame/3)%(total+PAUSE);
  const shown=[]; let acc=0, typing=false;
  for(let i=0;i<C64_LINES.length;i++){
    const s=C64_LINES[i][1], len=s.length+1;
    if(rev>=acc+len){ shown.push(C64_LINES[i]); acc+=len; }
    else { shown.push([C64_LINES[i][0], s.slice(0,Math.max(0,rev-acc))]); typing=true; break; }
  }
  const rows=Math.floor((bh-34)/13);
  const vis=shown.slice(Math.max(0,shown.length-rows));
  g.font='11px '+C64FONT;
  let ty=by+36;
  for(let i=0;i<vis.length;i++){
    const [k,s]=vis[i];
    g.fillStyle = k==='c' ? '#8be0ff' : '#ffffff';
    g.fillText(s, bx+12, ty);
    if(typing && i===vis.length-1 && (frame>>3)%2){
      g.fillStyle='#ffffff'; g.fillRect(bx+13+g.measureText(s).width, ty-8, 6, 9);
    }
    ty+=13;
  }
  g.restore();
}

const BEAN_MATURE=90000;   // ~25 minutes of played time — deliberately slow
const TOMATO_MATURE=63000, TOMATO_REGROW=9000;
function drawTrellis(d){
  const bx=d.x+16, base=d.y+HUD+30;
  const el = flags.beansAt? (playFrames-flags.beansAt) : -1;
  const p = el<0? 0 : Math.min(1, el/BEAN_MATURE);
  const TH=88, W=30;   // double-size trellis
  // frame: two weathered poles + crossbars + strings
  ctx.strokeStyle='#8a6a3a'; ctx.lineWidth=4.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(bx-W,base); ctx.lineTo(bx-W+5,base-TH); ctx.moveTo(bx+W,base); ctx.lineTo(bx+W-5,base-TH); ctx.stroke();
  ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(bx-W+4,base-TH+4); ctx.lineTo(bx+W-4,base-TH+4);
  ctx.moveTo(bx-W+2,base-TH*0.55); ctx.lineTo(bx+W-2,base-TH*0.55); ctx.stroke();
  ctx.strokeStyle='rgba(220,210,180,.5)'; ctx.lineWidth=1;
  for(let i=0;i<5;i++){ const sx=bx-24+i*12; ctx.beginPath(); ctx.moveTo(sx,base-2); ctx.lineTo(sx,base-TH+6); ctx.stroke(); }
  // soil bed
  ctx.fillStyle='#4d3a24'; ctx.beginPath(); ctx.ellipse(bx,base+3,38,7,0,0,7); ctx.fill();

  if(el<0){
    // basket of five beans, waiting
    ctx.fillStyle='#a5824a'; ctx.beginPath(); ctx.ellipse(bx+44,base,9,5,0,0,7); ctx.fill();
    ctx.strokeStyle='#6d532e'; ctx.lineWidth=1.2; ctx.stroke();
    for(let i=0;i<5;i++){
      ctx.fillStyle='#c9b8e8';
      ctx.beginPath(); ctx.ellipse(bx+40+(i%3)*4, base-3-(i/3|0)*4, 2.8,1.8, 0.5, 0, 7); ctx.fill();
    }
  } else if(el<90){
    // the plops: beans arc from basket into the soil, one after another
    for(let i=0;i<5;i++){
      const t0=i*16, tt=(el-t0)/22;
      const tx=bx-24+i*12;
      if(tt<0){ ctx.fillStyle='#c9b8e8'; ctx.beginPath(); ctx.ellipse(bx+42,base-3,2.8,1.8,0.5,0,7); ctx.fill(); continue; }
      if(tt>=1){ ctx.fillStyle='#5a4630'; ctx.beginPath(); ctx.ellipse(tx,base,4.5,2.6,0,0,7); ctx.fill(); continue; }
      const ax=bx+42+(tx-(bx+42))*tt, ay=(base-3)-Math.sin(tt*Math.PI)*22+(3)*tt;
      ctx.fillStyle='#c9b8e8'; ctx.beginPath(); ctx.ellipse(ax,ay,2.8,1.8,tt*3,0,7); ctx.fill();
    }
  } else {
    // five mounds, then the slow climb
    for(let i=0;i<5;i++){
      const sx=bx-24+i*12;
      ctx.fillStyle='#5a4630'; ctx.beginPath(); ctx.ellipse(sx,base,4.5,2.6,0,0,7); ctx.fill();
      const gp=Math.min(1, Math.max(0,(p-0.02-i*0.008)/0.9));      // each bean slightly out of step
      if(gp<=0) continue;
      const h=6+gp*(TH-12);
      const sway=Math.sin(frame*0.02+i*1.7)*(2+gp*3);
      // winding vine: two-segment quadratic wiggle up its string
      ctx.strokeStyle='#8be26a'; ctx.lineWidth=2.2+gp*1.2;   // light stem — pops against dark leaves (CVD-safe by luminance)
      ctx.beginPath(); ctx.moveTo(sx,base-1);
      ctx.quadraticCurveTo(sx+7+sway, base-h*0.4, sx-4+sway*0.5, base-h*0.7);
      ctx.quadraticCurveTo(sx-7+sway, base-h*0.9, sx+sway*0.6, base-h);
      ctx.stroke();
      // leaves along the vine (kept dark so stem/fruit stand off them)
      const nl=Math.floor(gp*7);
      for(let L=1;L<=nl;L++){
        const ly=base-(h*L/(nl+1)), lx=sx+Math.sin(L*2.1+i)*6+sway*0.4;
        ctx.fillStyle= L%2? '#3a7a30' : '#2f6b28';
        ctx.beginPath(); ctx.ellipse(lx,ly,4.6,3,L*0.8+sway*0.05,0,7); ctx.fill();
      }
      // flowers, then pods
      if(p>0.55 && p<0.9){
        ctx.fillStyle='#f2e8f8';
        ctx.beginPath(); ctx.arc(sx+sway*0.5, base-h+3, 2.2, 0, 7); ctx.fill();
        ctx.fillStyle='#e070a0'; ctx.beginPath(); ctx.arc(sx+sway*0.5, base-h+3, 1, 0, 7); ctx.fill();
      }
      if(p>0.8){
        const np=p>=1?3:2;
        for(let pod=0;pod<np;pod++){
          const py=base-h*(0.45+pod*0.22), px2=sx+4+sway*0.3;
          // bright yellow wax-bean pods with a dark outline — unmissable at any color vision
          ctx.strokeStyle='#4a3c0c'; ctx.lineWidth=4.6; ctx.lineCap='round';
          ctx.beginPath(); ctx.moveTo(px2,py); ctx.quadraticCurveTo(px2+3, py+7+pod, px2+1.5, py+11+pod); ctx.stroke();
          ctx.strokeStyle= p>=1? '#ffd23f':'#cddc5a'; ctx.lineWidth=3;
          ctx.beginPath(); ctx.moveTo(px2,py); ctx.quadraticCurveTo(px2+3, py+7+pod, px2+1.5, py+11+pod); ctx.stroke();
        }

      const pul=0.35+Math.sin(frame*0.07)*0.2;
      const g=ctx.createRadialGradient(bx,base-TH*0.5,6,bx,base-TH*0.5,50);
      g.addColorStop(0,'rgba(255,210,63,'+pul.toFixed(2)+')'); g.addColorStop(1,'rgba(255,210,63,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(bx,base-TH*0.5,50,0,7); ctx.fill();
    }
  }
  if(Math.hypot(PL.x-bx,PL.y-(d.y+24))<54){
    const msg = el<0? '[SPACE] plant the five beans'
      : p>=1? '[SPACE] harvest — you earned this'
      : p>0.8? 'pods swelling...' : p>0.55? 'first flowers' : p>0.15? 'climbing, slowly' : 'settling in';
    drawLabel(msg, bx, base+18, '#ffffff');
  }
}

    }

      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,base-h*0.6,22,0,7); ctx.fill();
    }

  if(Math.hypot(PL.x-x,PL.y-(d.y+24))<50){
    drawLabel(ripe? '[SPACE] pick the ripe ones' : p>=1? 'fruit ripening...' : p>0.5? 'flowering' : 'a tomato seedling', x, base+16, '#ffffff');

/* -------- WINDOWS OUT OF THE VALLEY (2026-08-19) --------
   Links to the games that live OUTSIDE Grishnak. Per the mineral-mind lore
   these are interfaces like any other face — a watching lens far from any
   wall, a book that keeps itself. SPACE opens the real page in a new tab. */
/* THE VARIANCE MONOLITH (Scott, 2026-08-22, v2 — his call: "maybe it should
   just be a code animation that you make, as a loop"). The slab IS a monitor,
   standing where a monitor has no business standing, and the screen plays a
   tiny cartoon of the clerk's evening on repeat: chat opens and scrolls, chat
   closes, the spreadsheet scrolls past one amber cell, mail opens, a few
   characters get typed, mail closes. No art file, no dependency — the whole
   face is drawn here, so it can never be missing. */
const VAR_W=120, VAR_H=75;
/* the glitch beat (Scott, 2026-08-22): mid-loop, the little office tears for
   a moment and GRISHNAK looks out of the monitor — then everything is fine.
   The two games noticing each other, exactly once per loop. */
let vGlitchImg=null;
(function(){ try{ const im=new Image(); im.onload=()=>{ vGlitchImg=im; };
  im.src='images/grishnak-threat.png'; }catch(e){} })();
function drawVarianceScreen(px,py,w,h){
  const LOOP=960, tt=playFrames%LOOP;
  ctx.save();
  ctx.beginPath(); ctx.rect(px,py,w,h); ctx.clip();
  const bg=ctx.createLinearGradient(px,py,px+w,py+h);          // the desktop
  bg.addColorStop(0,'#3f5a6e'); bg.addColorStop(1,'#2c4152');
  ctx.fillStyle=bg; ctx.fillRect(px,py,w,h);
  ctx.fillStyle='#9fb4c2';                                      // two desk icons
  ctx.fillRect(px+4,py+5,5,5); ctx.fillRect(px+4,py+15,5,5);
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.fillRect(px+3,py+11,7,1.4); ctx.fillRect(px+3,py+21,7,1.4);
  ctx.fillStyle='#26303a'; ctx.fillRect(px,py+h-6,w,6);         // taskbar
  ctx.fillStyle='#7fb3e8'; ctx.fillRect(px+2,py+h-4.6,6,3);     // start
  ctx.fillStyle='#8fa2b3'; ctx.fillRect(px+w-12,py+h-4.4,9,2.6);// the clock, stuck at 5:12
  /* one window at a time: [start, open+live+close, drawer] */
  const acts=[[60,284,chatW],[344,284,sheetW],[628,324,mailW]];
  for(const [at,len,fn] of acts){
    if(tt<at||tt>=at+len)continue;
    const lt=tt-at, k=lt<14? lt/14 : (lt>len-10? Math.max(0,(len-lt)/10) : 1);
    fn(lt, k*k*(3-2*k));                                        // smoothstep in and out
  }
  function frameW(wx,wy,ww,wh,k,tint){
    const cw=ww*k, ch=wh*k, cx=wx+(ww-cw)/2, cy=wy+(wh-ch)/2;
    ctx.fillStyle='rgba(10,14,20,.35)'; ctx.fillRect(cx+2,cy+2,cw,ch);
    ctx.fillStyle='#eef2f5'; ctx.fillRect(cx,cy,cw,ch);
    ctx.fillStyle=tint; ctx.fillRect(cx,cy,cw,4*k);
    ctx.fillStyle='#e05050'; ctx.fillRect(cx+cw-3.5*k,cy+1.2*k,2*k,1.8*k);
    return [cx,cy,cw,ch];
  }
  function chatW(lt,k){
    const [cx,cy,cw,ch]=frameW(px+w-60,py+6,52,46,k,'#3b6a52');
    if(k<1)return;
    ctx.save(); ctx.beginPath(); ctx.rect(cx+2,cy+6,cw-4,ch-8); ctx.clip();
    const n=Math.min(7,1+((lt-14)/38|0)), rise=Math.max(0,(n-4))*8;
    for(let i=0;i<n;i++){ const mine=i%2, by=cy+8+i*8-rise;
      ctx.fillStyle=mine?'#d9efd2':'#cfe3f5';
      rr(ctx, mine?cx+cw-26:cx+4, by, 22, 5.4, 2.5); ctx.fill(); }
    ctx.restore();
  }
  function sheetW(lt,k){
    const [cx,cy,cw,ch]=frameW(px+16,py+8,66,50,k,'#2f6b4f');
    if(k<1)return;
    ctx.fillStyle='#dfe7ee'; ctx.fillRect(cx+2,cy+5,cw-4,4);     // the formula bar
    ctx.fillStyle='#f7fafc'; ctx.fillRect(cx+14,cy+5.8,26,2.4);
    ctx.save(); ctx.beginPath(); ctx.rect(cx+2,cy+10,cw-4,ch-12); ctx.clip();
    const off=((lt-14)*0.22)%7;
    ctx.strokeStyle='#c4cfd8'; ctx.lineWidth=0.8;
    for(let r=0;r<9;r++){ const yy=cy+10+r*7-off;
      ctx.beginPath(); ctx.moveTo(cx+2,yy); ctx.lineTo(cx+cw-2,yy); ctx.stroke(); }
    for(let c=1;c<5;c++){ const xx=cx+2+c*(cw-4)/5;
      ctx.beginPath(); ctx.moveTo(xx,cy+10); ctx.lineTo(xx,cy+ch-2); ctx.stroke(); }
    /* column Q: the one amber cell drifting up with the scroll */
    const qy=cy+10+((4*7-((lt-14)*0.22))%(7*9)+7*9)%(7*9)-off;
    ctx.fillStyle='rgba(242,183,60,'+(0.5+0.4*Math.sin(lt*0.12)).toFixed(2)+')';
    ctx.fillRect(cx+2+4*(cw-4)/5+0.6, qy+0.6, (cw-4)/5-1.2, 5.8);
    ctx.restore();
  }
  function mailW(lt,k){
    const [cx,cy,cw,ch]=frameW(px+30,py+10,62,48,k,'#3b4c8a');
    if(k<1)return;
    ctx.fillStyle='#d5dde4';
    ctx.fillRect(cx+4,cy+7,cw-20,2.4); ctx.fillRect(cx+4,cy+11.4,cw-30,2.4);
    ctx.fillStyle='#c4cfd8';
    for(let i=0;i<3;i++) ctx.fillRect(cx+4,cy+18+i*5,cw-8-(i===2?18:0),2.2);
    const typed=Math.min(cw-14,Math.max(0,(lt-160)*0.32));       // a few characters, typed
    ctx.fillStyle='#8a99a8'; ctx.fillRect(cx+4,cy+33,typed,2.2);
    if(lt>150&&(lt>>4)%2){ ctx.fillStyle='#3a4249'; ctx.fillRect(cx+5+typed,cy+31.6,1.2,5); }
  }
  /* THE TEAR: glitch, the face, glitch, back to work — dead middle of the loop */
  const G0=468, F0=474, F1=490, G2=496;
  if(tt>=G0&&tt<G2){
    const rnd=n=>{ const s=Math.sin(n*127.1+13.7)*43758.5453; return s-Math.floor(s); };
    if(tt>=F0&&tt<F1){                                           // the face, looking out
      ctx.fillStyle='#07080c'; ctx.fillRect(px,py,w,h);
      const jx=((tt|0)%2)*2-1;                                   // it won't hold still
      if(vGlitchImg){
        const sc=Math.max(w/vGlitchImg.width,h/vGlitchImg.height)*1.15;
        const dw=vGlitchImg.width*sc, dh=vGlitchImg.height*sc;
        ctx.drawImage(vGlitchImg, px+(w-dw)/2+jx, py+(h-dh)/2, dw, dh);
      } else {                                                   // no file: the eyes suffice
        ctx.fillStyle='#141018';
        ctx.beginPath(); ctx.ellipse(px+w/2+jx,py+h*0.62,w*0.34,h*0.52,0,0,7); ctx.fill();
        for(const ex of [-13,13]){
          const eg=ctx.createRadialGradient(px+w/2+ex+jx,py+h*0.45,0.5,px+w/2+ex+jx,py+h*0.45,7);
          eg.addColorStop(0,'#ffd9a0'); eg.addColorStop(0.5,'#ff4a3a'); eg.addColorStop(1,'rgba(255,74,58,0)');
          ctx.fillStyle=eg; ctx.beginPath(); ctx.arc(px+w/2+ex+jx,py+h*0.45,7,0,7); ctx.fill();
        }
      }
      ctx.fillStyle='rgba(224,80,80,.1)'; ctx.fillRect(px,py,w,h);
      for(let yy=py+((tt|0)%3);yy<py+h;yy+=3){ ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(px,yy,w,1); }
    } else {                                                     // the tear itself
      const base=(tt|0)*17;
      for(let i=0;i<9;i++){
        const by=py+rnd(base+i)*h, bh=1+rnd(base+i+50)*3.5, dx=(rnd(base+i+90)-0.5)*14;
        ctx.fillStyle=['rgba(127,208,232,.55)','rgba(224,80,80,.55)','rgba(242,183,60,.5)','rgba(255,255,255,.7)'][i%4];
        ctx.fillRect(px+Math.max(0,dx), by, w-Math.abs(dx), bh);
      }
      if(tt===G0||tt===G2-1){ ctx.fillStyle='rgba(255,255,255,.85)'; ctx.fillRect(px,py,w,h); }
    }
  }
  ctx.fillStyle='rgba(160,200,240,'+(0.03+0.03*Math.sin(playFrames*0.11)).toFixed(3)+')';
  ctx.fillRect(px,py,w,h);                                       // the faint screen breath
  ctx.restore();
}
/* THE WRECK — the derelict from MONTY ZOOM's vault, now nose-down in the
   north strip of the VILLAGE FIELDS. Same hull as the caves drew, plus the
   dirt it ploughed up and the furrow it left coming in. Boarding it is the
   only way into OMEGA RUN. */
function drawWreck(d){
  const x=d.x+16, y=d.y+HUD+22;
  const near=Math.hypot(PL.x-(d.x+16),PL.y-(d.y+24))<56;
  // the furrow it cut coming down, before the mound
  ctx.strokeStyle='rgba(60,44,26,.45)'; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x-46,y-14); ctx.quadraticCurveTo(x-30,y-4,x-16,y+2); ctx.stroke();
  // the mound of ploughed earth around the buried nose
  const mg=ctx.createLinearGradient(0,y-4,0,y+10);
  mg.addColorStop(0,'#7a5c38'); mg.addColorStop(1,'#4e3a22');
  ctx.fillStyle=mg;
  ctx.beginPath(); ctx.ellipse(x-8,y+6,20,7,0,0,7); ctx.fill();
  ctx.fillStyle='rgba(30,20,10,.35)';
  ctx.beginPath(); ctx.ellipse(x-14,y+7,8,3,0,0,7); ctx.fill();
  // faint power glow — it never quite died

function drawDigsite(d){
  /* THE DIG: a staked pit two tiles across. Every layer dug telescopes the
     interior one shade darker and one ledge deeper, the spoil heap grows to
     match, and at the bottom of layer six the warm slab glows — the same
     amber breath as the door at the bottom of the well, because it is the
     same note. */
  const L=Math.min(flags.digLayer||0, DIG_LAYERS.length);
  const px=d.x+2, py=d.y+HUD+4, pw=60, phh=26;
  const dg=ctx.createLinearGradient(0,py,0,py+phh);
  dg.addColorStop(0,'#6a5844'); dg.addColorStop(1, L? '#160e06':'#4a3c2c');
  ctx.fillStyle=dg; rr(ctx,px,py,pw,phh,4); ctx.fill();
  ctx.strokeStyle='#8a7458'; ctx.lineWidth=2; rr(ctx,px,py,pw,phh,4); ctx.stroke();
  for(let i=1;i<=L;i++){                                          // ledges going down
    const ins=i*3.4;
    ctx.strokeStyle='rgba(20,12,4,'+(0.25+i*0.08).toFixed(2)+')'; ctx.lineWidth=1.2;
    rr(ctx,px+ins,py+ins*0.8,pw-ins*2,phh-ins*1.6,3); ctx.stroke();
  }
  if(L>=DIG_LAYERS.length){                                       // the slab
    const p=0.5+0.3*Math.sin(playFrames*0.035);
    ctx.fillStyle='#c98a2c'; rr(ctx,px+22,py+11,16,7,2); ctx.fill();
    const wg=ctx.createRadialGradient(px+30,py+14,1,px+30,py+14,18);
    wg.addColorStop(0,'rgba(255,180,80,'+(0.45*p).toFixed(2)+')'); wg.addColorStop(1,'rgba(255,180,80,0)');
    ctx.fillStyle=wg; ctx.beginPath(); ctx.arc(px+30,py+14,18,0,7); ctx.fill();
  }
  if(L>=3){                                                       // the ladder out
    ctx.strokeStyle='#a8834e'; ctx.lineWidth=1.8; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(px+6,py-8); ctx.lineTo(px+9,py+12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px+13,py-8); ctx.lineTo(px+16,py+12); ctx.stroke();
    for(let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(px+6.7+i*0.8,py-5+i*5); ctx.lineTo(px+13.7+i*0.8,py-5+i*5); ctx.stroke(); }
  }
  ctx.strokeStyle='#5a4028'; ctx.lineWidth=2.4; ctx.lineCap='round';   // stakes + rope
  const stakes=[[px-3,py-2],[px+pw+3,py-2],[px-3,py+phh+2],[px+pw+3,py+phh+2]];
  for(const [sx,sy] of stakes){ ctx.beginPath(); ctx.moveTo(sx,sy+3); ctx.lineTo(sx,sy-9); ctx.stroke(); }
  ctx.strokeStyle='rgba(200,180,140,.7)'; ctx.lineWidth=1.1;
  ctx.beginPath(); ctx.moveTo(px-3,py-9); ctx.quadraticCurveTo(px+pw/2,py-5, px+pw+3,py-9); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(px-3,py+phh-7); ctx.quadraticCurveTo(px+pw/2,py+phh-3, px+pw+3,py+phh-7); ctx.stroke();
  const hp=6+L*1.6;                                               // the spoil heap earns its keep
  const hg=ctx.createRadialGradient(px+pw+14,py+phh-2,1,px+pw+14,py+phh,hp);
  hg.addColorStop(0,'#948f83'); hg.addColorStop(1,'#5d5850');
  ctx.fillStyle=hg; ctx.beginPath(); ctx.ellipse(px+pw+14,py+phh-1,hp,hp*0.55,0,Math.PI,0); ctx.closePath(); ctx.fill();
  const lf=0.75+Math.sin(frame*0.11)*0.15;                        // lantern on the near stake
  const lg2=ctx.createRadialGradient(px+pw+3,py+phh-8,1,px+pw+3,py+phh-8,10);
  lg2.addColorStop(0,'rgba(255,214,110,'+(0.7*lf).toFixed(2)+')'); lg2.addColorStop(1,'rgba(255,214,110,0)');
  ctx.fillStyle=lg2; ctx.beginPath(); ctx.arc(px+pw+3,py+phh-8,10,0,7); ctx.fill();
  ctx.fillStyle='#ffe9a0'; rr(ctx,px+pw+1,py+phh-11,4,5,1); ctx.fill();
  if(Math.hypot(PL.x-(d.x+32),PL.y-(d.y+24))<62 && (frame>>4)%2){
    const msg = L>=DIG_LAYERS.length ? 'the slab hums' : digVisit ? 'dug for today' : '[SPACE] dig — layer '+(L+1)+' of '+DIG_LAYERS.length;
    drawLabel(msg, d.x+32, py-16, L>=DIG_LAYERS.length ? '#ffc95e' : '#ffffff');
  }
}

      ctx.fillStyle=rg;
      ctx.beginPath(); ctx.arc(x+ox,y+oy,rad,0,7); ctx.fill();
      ctx.strokeStyle='rgba(30,28,24,.4)'; ctx.lineWidth=1.2; ctx.stroke();

function drawChest(c){
  /* Scott, 2026-08-18: "we need a better graphic for plundered treasure
     chests." The old open state was the closed chest with its lid nudged up —
     it read as a chest you had not tried yet, which is the one thing a
     plundered chest must never say. The new state tells the whole story at a
     glance: lid thrown ALL the way back on its hinge (pale inner face showing,
     torn scrap of red lining), a black interior with nothing in it, the hasp
     dangling open, two dull coins dropped in the dirt — whoever emptied it
     missed those and you will not bother — and a cobweb already growing
     between lid and box. The sparkle stays closed-only: shine means promise. */
  const x=c.x, y=c.y+HUD;
  const sd=(Math.floor(c.x*13+c.y*7))%2 ? 1 : -1;   // per-chest mirror, stable
  if(c.open){
    // lid, hinged at the back edge and lying fully open behind the box
    const ig=ctx.createLinearGradient(0,y-26,0,y-14);
    ig.addColorStop(0,'#caa065'); ig.addColorStop(1,'#9c7440');
    ctx.fillStyle=ig;
    ctx.beginPath();
    ctx.moveTo(x-10,y-13); ctx.lineTo(x-12,y-25); ctx.lineTo(x+12,y-25); ctx.lineTo(x+10,y-13);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(40,25,10,.6)'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.fillStyle='#7a3040';                               // torn lining scrap
    ctx.beginPath();
    ctx.moveTo(x-8,y-24); ctx.lineTo(x-2,y-24); ctx.lineTo(x-4,y-21);
    ctx.lineTo(x+1,y-22); ctx.lineTo(x-1,y-18); ctx.lineTo(x-7,y-19);
    ctx.closePath(); ctx.fill();
  }
  // box body
  const bg=ctx.createLinearGradient(0,y-14,0,y);
  bg.addColorStop(0,'#9a6a34'); bg.addColorStop(1,'#6d4520');
  ctx.fillStyle=bg; rr(ctx,x-11,y-11,22,11,2.5); ctx.fill();
  ctx.strokeStyle='rgba(40,25,10,.6)'; ctx.lineWidth=1.3; ctx.stroke();
  if(c.open){
    // empty interior, front lip catching a little light
    ctx.fillStyle='#160c03'; rr(ctx,x-9,y-11,18,5,2); ctx.fill();
    ctx.strokeStyle='rgba(210,170,110,.35)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x-9,y-6.5); ctx.lineTo(x+9,y-6.5); ctx.stroke();
    // hasp knocked open, hanging off the front face
    ctx.fillStyle='#c9a23c'; rr(ctx,x-2,y-7,4,5,1); ctx.fill();
    ctx.strokeStyle='rgba(120,85,10,.8)'; ctx.lineWidth=1; ctx.stroke();
    // the two coins they missed — dull, no glow, not worth kneeling for
    ctx.fillStyle='#a8862f';
    ctx.beginPath(); ctx.ellipse(x+sd*15,y-1,3,1.6,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+sd*19,y+1,2.6,1.4,0,0,7); ctx.fill();
    ctx.strokeStyle='rgba(60,45,10,.5)'; ctx.lineWidth=0.8;
    ctx.beginPath(); ctx.ellipse(x+sd*15,y-1,3,1.6,0,0,7); ctx.stroke();
    // cobweb: one sagging strand from lid corner to box corner, plus a wisp
    ctx.strokeStyle='rgba(220,225,235,.30)'; ctx.lineWidth=0.8;
    ctx.beginPath(); ctx.moveTo(x-sd*11,y-24);
    ctx.quadraticCurveTo(x-sd*13,y-16, x-sd*10,y-10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-sd*11,y-24); ctx.lineTo(x-sd*6,y-18); ctx.stroke();
  } else {
    const lg=ctx.createLinearGradient(0,y-17,0,y-9);
    lg.addColorStop(0,'#b8813f'); lg.addColorStop(1,'#8f6228');
    ctx.fillStyle=lg;
    rr(ctx,x-11,y-16,22,7,3); ctx.fill(); ctx.strokeStyle='rgba(40,25,10,.6)'; ctx.stroke();
    ctx.fillStyle='#ffd23e'; rr(ctx,x-2.5,y-12,5,6,1.5); ctx.fill();
    ctx.strokeStyle='rgba(120,85,10,.8)'; ctx.lineWidth=1; ctx.stroke();
    if((frame>>4)%3===0){
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x+9,y-19,1.5,0,7); ctx.fill();
    }
  }
}
function drawHeartShape(x,y,s,fill){
  ctx.beginPath();
  ctx.moveTo(x,y+s*0.9);
  ctx.bezierCurveTo(x-s*1.3,y-s*0.1, x-s*0.7,y-s*1.1, x,y-s*0.35);
  ctx.bezierCurveTo(x+s*0.7,y-s*1.1, x+s*1.3,y-s*0.1, x,y+s*0.9);
  ctx.fillStyle=fill; ctx.fill();
}
function drawHeartItem(h){

    ctx.fillStyle='#d4b06a'; ctx.beginPath(); ctx.ellipse(-7,0,2,3,0,0,7); ctx.fill();
    ctx.fillStyle='#8a6a3a'; ctx.beginPath(); ctx.ellipse(-7,0,1,1.6,0,0,7); ctx.fill();
    ctx.restore();

    const sg=ctx.createRadialGradient(x-2,y-5,1,x,y-3,6);

    gg.addColorStop(0,'rgba(255,220,90,.5)'); gg.addColorStop(1,'rgba(255,220,90,0)');
    ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(x,y-4,8,0,7); ctx.fill();
    const cg=ctx.createRadialGradient(x-1.5,y-5.5,0.5,x,y-4,5);
    cg.addColorStop(0,'#ffe98a'); cg.addColorStop(1,'#e0a818');
    ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(x,y-4,5,0,7); ctx.fill();
    ctx.strokeStyle='#a87808'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(x,y-4,3.2,0,7); ctx.stroke();

    ctx.strokeStyle='rgba(120,80,30,.5)'; ctx.lineWidth=1.1; ctx.stroke();
    ctx.strokeStyle='rgba(120,80,30,.7)'; ctx.lineWidth=1.3; ctx.lineCap='round';
    for(const dx of [-4,0,4]){ ctx.beginPath(); ctx.moveTo(x+dx-1,y-7); ctx.lineTo(x+dx+1,y-3); ctx.stroke(); }
  }
}
function drawPerson(x,y,bob,robe0,robe1,head){
  const Y=y+HUD;
  const bg=ctx.createLinearGradient(0,Y-22,0,Y);
  bg.addColorStop(0,robe0); bg.addColorStop(1,robe1);
  ctx.beginPath();
  ctx.moveTo(x-7,Y); ctx.quadraticCurveTo(x-8,Y-16+bob, x-5,Y-20+bob);
  ctx.lineTo(x+5,Y-20+bob); ctx.quadraticCurveTo(x+8,Y-16+bob, x+7,Y);
  ctx.closePath(); outlined(bg);
  ctx.beginPath(); ctx.arc(x,Y-25+bob,6.5,0,7); outlined(head);
}
function drawNPC(n){
  const x=n.x, y=n.y, bob=Math.sin(frame*0.05+x)*1;
  const Y=y+HUD;
  if(n.who==='lamp'){
    /* the Lamplighter: long coat the color of wet ash, hood, a small unlit
       lantern in the left hand, weight leaned off the left leg (the limp). */
    const lean=1.2;
    ctx.fillStyle='#5a5654';                                     // coat
    ctx.beginPath(); ctx.moveTo(x-9+lean,Y); ctx.lineTo(x-7+lean,Y-24); ctx.lineTo(x+7,Y-24); ctx.lineTo(x+10,Y); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#4c4846';                                     // hood
    ctx.beginPath(); ctx.arc(x+lean,Y-26+bob*0.4,7,Math.PI,0); ctx.fill();
    ctx.fillRect(x-7+lean,Y-26+bob*0.4,14,5);
    ctx.fillStyle='#181614';                                     // hood shadow, no face
    ctx.beginPath(); ctx.ellipse(x+lean,Y-24+bob*0.4,4.6,3.4,0,0,7); ctx.fill();
    ctx.strokeStyle='#3a3634'; ctx.lineWidth=1.6;                // coat seam
    ctx.beginPath(); ctx.moveTo(x+lean,Y-22); ctx.lineTo(x+1,Y-2); ctx.stroke();
    ctx.strokeStyle='#6a5a40'; ctx.lineWidth=1.4;                // lantern, left hand
    ctx.beginPath(); ctx.moveTo(x-8+lean,Y-14); ctx.lineTo(x-11,Y-9); ctx.stroke();
    ctx.fillStyle='#2c2a28'; rr(ctx,x-14,Y-9,6,8,1.5); ctx.fill();
    ctx.fillStyle='rgba(90,86,80,.9)'; ctx.fillRect(x-13,Y-7.5,4,5);   // glass: UNLIT
    if(Math.hypot(PL.x-n.x,PL.y-n.y)<52 && (frame>>4)%2) drawLabel('!', x, Y-40, '#c8c8d0');
    return;

  if(n.who==='yogi'){

    const gl=ctx.createRadialGradient(x,cy+2,2,x,cy+2,34);
    gl.addColorStop(0,'rgba(180,210,255,'+pul.toFixed(2)+')'); gl.addColorStop(1,'rgba(180,210,255,0)');
    ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(x,cy+2,34,0,7); ctx.fill();
    if(yogiImg.complete && yogiImg.naturalWidth){
      const w=64, h=w*yogiImg.naturalHeight/yogiImg.naturalWidth;

      ctx.fillStyle='#c9b8e8'; ctx.beginPath(); ctx.arc(x,cy,10,0,7); ctx.fill();
    }
    // a couple of drifting motes of calm
    for(let i=0;i<3;i++){

      ctx.fillStyle='rgba(210,225,255,'+(0.3+0.2*Math.sin(a*2)).toFixed(2)+')';
      ctx.beginPath(); ctx.arc(mx,my,1.4,0,7); ctx.fill();

    if(britSit>0){
      drawLabel('sitting', x, cy-42, '#bfd6ff');
    } else if(Math.hypot(PL.x-n.x,PL.y-n.y)<56 && (frame>>4)%2){
      drawLabel('[SPACE] sit with her', x, cy-42, '#dfeaff');
    }
    return;
  }
  if(n.who==='surr'){
    /* THE SURRENDERED: faded bandit leathers gone grey, a white cloth tied on
       the right arm (the surrender, worn), no weapon — each mid-task. The work
       rhythm IS the sprite: diggers swing shovels, the cook stirs, the

    const ph=Math.sin(frame*0.055+x*0.7);

    drawPerson(x,y,work,'#8a8074','#655e54','#d8a878');

    ctx.fillStyle='#e8e6e0'; rr(ctx,x+4.5,Y-16+work*0.5,4,3.4,1); ctx.fill();   // the armband
    ctx.strokeStyle='rgba(90,85,75,.7)'; ctx.lineWidth=0.8; rr(ctx,x+4.5,Y-16+work*0.5,4,3.4,1); ctx.stroke();
    if(n.pose==='dig'){

      ctx.beginPath(); ctx.moveTo(x+6,Y-14+work); ctx.lineTo(x+13,Y-2+dip*0.4); ctx.stroke();
      ctx.fillStyle='#9aa0aa';
      ctx.beginPath(); ctx.moveTo(x+11,Y-3+dip*0.4); ctx.lineTo(x+17,Y-1+dip*0.4); ctx.lineTo(x+15,Y+3+dip*0.4); ctx.lineTo(x+10,Y+1+dip*0.4); ctx.closePath(); ctx.fill();
      if(ph>0.86){ ctx.fillStyle='rgba(138,116,88,.7)';        // a spadeful in the air
        for(const [ox,oy] of [[15,-6],[18,-9],[13,-10]]){ ctx.beginPath(); ctx.arc(x+ox,Y+oy,1.3,0,7); ctx.fill(); } }
    } else if(n.pose==='fire'){
      ctx.strokeStyle='#7a5c34'; ctx.lineWidth=2; ctx.lineCap='round';   // stirring stick
      ctx.beginPath(); ctx.moveTo(x+6,Y-13+bob); ctx.lineTo(x+14+ph*1.5,Y-1); ctx.stroke();
    } else if(n.pose==='stack'){
      ctx.save(); ctx.translate(x,Y-13+bob); ctx.rotate(-0.08);          // an armful of wood

      ctx.fillStyle='#d4b06a'; ctx.beginPath(); ctx.ellipse(-9,0,2,3,0,0,7); ctx.fill();
      ctx.restore();
    } else {
      ctx.strokeStyle='#c9bfa8'; ctx.lineWidth=1.4;                      // tent rope, coiling
      ctx.beginPath(); ctx.arc(x-10,Y-6+work*0.5,4,0.6,5.4); ctx.stroke();
    }
    if(Math.hypot(PL.x-n.x,PL.y-n.y)<52 && (frame>>4)%2) drawLabel('!', x, Y-38, '#dfe6d8');
    return;
  }
  if(n.who==='elder'){
    drawPerson(x,y,bob,'#efece4','#c9c4b8','#eab98a');
    ctx.fillStyle='#e8e4da';   // beard
    ctx.beginPath(); ctx.moveTo(x-4,Y-23+bob); ctx.quadraticCurveTo(x,Y-14+bob,x+4,Y-23+bob); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#1a1a20'; ctx.beginPath(); ctx.arc(x-2.5,Y-26+bob,1.1,0,7); ctx.arc(x+2.5,Y-26+bob,1.1,0,7); ctx.fill();
    ctx.strokeStyle='#8a6a3a'; ctx.lineWidth=2.4; ctx.lineCap='round';   // staff
    ctx.beginPath(); ctx.moveTo(x+10,Y); ctx.lineTo(x+10,Y-26); ctx.stroke();
    ctx.fillStyle='#5ad4c8'; ctx.beginPath(); ctx.arc(x+10,Y-28,2.4,0,7); ctx.fill();
  } else if(n.who==='farmer'){
    drawPerson(x,y,bob,'#5a7cae','#3d5a85','#eab98a');
    ctx.fillStyle='#1a1a20'; ctx.beginPath(); ctx.arc(x-2.5,Y-25+bob,1.1,0,7); ctx.arc(x+2.5,Y-25+bob,1.1,0,7); ctx.fill();
    const hg=ctx.createLinearGradient(0,Y-34,0,Y-27);
    hg.addColorStop(0,'#e8d088'); hg.addColorStop(1,'#c4a858');
    ctx.fillStyle=hg;
    ctx.beginPath(); ctx.ellipse(x,Y-29+bob,10,3,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x,Y-31+bob,5.5,3.4,0,0,7); ctx.fill();
    ctx.strokeStyle='rgba(120,95,40,.6)'; ctx.lineWidth=1; ctx.stroke();
  } else {
    drawPerson(x,y,bob,'#8a6a48','#6a4c30','#eab98a');
    ctx.fillStyle='#1a1a20'; ctx.beginPath(); ctx.arc(x-2.5,Y-25+bob,1.1,0,7); ctx.arc(x+2.5,Y-25+bob,1.1,0,7); ctx.fill();
    const hg=ctx.createLinearGradient(0,Y-34,0,Y-28);
    hg.addColorStop(0,'#d5d0c6'); hg.addColorStop(1,'#a8a396');

    ctx.beginPath(); ctx.arc(x,Y-29+bob,6,Math.PI,0); ctx.closePath(); ctx.fill();

  if(Math.hypot(PL.x-n.x,PL.y-n.y)<52 && (frame>>4)%2){

function drawFoe(f){
  const x=f.x, y=f.y+HUD;
  const fl = f.flash>0 && (f.flash>>1)%2;
  const wob=Math.sin(f.wt*0.2+x)*1;
  if(f.t==='wolf'){
    /* v2 (Scott: "wolves dont look at all like wolves"): what was missing was
       everything that MAKES a wolf — legs, a long muzzle, tall ears, a bushy
       low tail, a lean tucked waist — and it always faced right no matter
       where it walked. Nose-first now, four trotting legs, teeth when hunting. */
    const C=c=> fl?'#fff':c;
    ctx.save(); ctx.translate(x,y); ctx.scale(f.face||1,1);
    const tr=f.anim||0;
    ctx.strokeStyle=C('#565662'); ctx.lineWidth=2.6; ctx.lineCap='round';
    for(let i=0;i<2;i++){                                  // legs, diagonal trot pairs
      const sw=Math.sin(tr+i*Math.PI)*2.6;
      ctx.beginPath(); ctx.moveTo(-8+i*3,-8); ctx.lineTo(-8+i*3+sw,-0.5); ctx.stroke();   // rear
      ctx.beginPath(); ctx.moveTo( 6+i*3,-9); ctx.lineTo( 6+i*3-sw,-0.5); ctx.stroke();   // fore
    }
    const bg=ctx.createLinearGradient(0,-16,0,-6);
    bg.addColorStop(0, C('#9a9aa8')); bg.addColorStop(1, C('#6a6a78'));
    ctx.beginPath();                                       // lean body: deep chest, tucked waist
    ctx.moveTo(-13,-9);
    ctx.quadraticCurveTo(-12,-14.5, -5,-15.5);             // rump up over the back
    ctx.quadraticCurveTo(3,-16.5, 8,-15);                  // shoulder
    ctx.quadraticCurveTo(11,-13.5, 11,-9);                 // down the chest
    ctx.quadraticCurveTo(6,-6.5, -2,-7);                   // belly tucks up
    ctx.quadraticCurveTo(-9,-7.5, -13,-9);
    ctx.closePath(); outlined(bg);
    ctx.fillStyle=C('#585866');                            // the dark saddle along the spine
    ctx.beginPath();
    ctx.moveTo(-11,-11.5); ctx.quadraticCurveTo(-4,-15.8, 7,-14.6);
    ctx.quadraticCurveTo(2,-13.2, -6,-12.4); ctx.closePath(); ctx.fill();
    ctx.fillStyle=C('#7e7e8c');                            // bushy tail, hung low
    ctx.beginPath();
    ctx.moveTo(-12,-12);
    ctx.quadraticCurveTo(-19,-11+wob, -21,-5.5+wob);
    ctx.quadraticCurveTo(-18.5,-4.5+wob, -17,-6+wob);
    ctx.quadraticCurveTo(-15.5,-9, -11,-9.5);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(20,20,28,.5)'; ctx.lineWidth=0.8; ctx.stroke();
    // head: skull + LONG muzzle, ears tall
    ctx.fillStyle=C('#8a8a98');
    ctx.beginPath();                                       // neck ruff wedge
    ctx.moveTo(6,-16); ctx.lineTo(10.5,-18.5); ctx.lineTo(12,-12); ctx.lineTo(7,-11); ctx.closePath(); ctx.fill();
    const hb=ctx.createLinearGradient(0,-21,0,-12);
    hb.addColorStop(0, C('#9a9aa8')); hb.addColorStop(1, C('#72727e'));
    ctx.beginPath();                                       // skull and muzzle in one wedge
    ctx.moveTo(9,-19.5);
    ctx.quadraticCurveTo(14,-20.5, 16,-17.5);
    ctx.lineTo(21.5,-14.6);                                // muzzle top, long
    ctx.lineTo(21.5,-12.8);                                // blunt nose end
    ctx.quadraticCurveTo(16,-11.8, 12.5,-12);              // jawline back
    ctx.quadraticCurveTo(8.5,-13, 9,-19.5);
    ctx.closePath(); outlined(hb);
    ctx.fillStyle=C('#22222c');                            // nose
    ctx.beginPath(); ctx.arc(21,-13.8,1.3,0,7); ctx.fill();
    if(f.aggroed && !fl){                                  // hunting: the jaw shows teeth
      ctx.strokeStyle='#2a1216'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(13,-12.2); ctx.lineTo(20,-12.6); ctx.stroke();
      ctx.fillStyle='#e8e4da';
      for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(14+i*2.2,-12.3); ctx.lineTo(15+i*2.2,-11); ctx.lineTo(16+i*2.2,-12.2); ctx.closePath(); ctx.fill(); }
    }
    ctx.fillStyle=C('#72727e');                            // two tall ears, one behind

    ctx.fillStyle=C('#3a3a46');
    ctx.beginPath(); ctx.moveTo(13,-19.4); ctx.lineTo(14,-22.4); ctx.lineTo(14.9,-18.9); ctx.closePath(); ctx.fill();

  } else if(f.t==='boar'){
    /* v2: a boar is a WEDGE — huge shoulder hump sloping to small hips, no

    const C=c=> fl?'#fff':c;
