/* ---------------- THE CROP FIELD ----------------
   SOUTH MEADOW is a wheat field drawn stalk by stalk (~40,000 of them),
   filling the screen inside the apple-tree borders — full height, from the
   left border to x=580, with a notch cut around the sky-door pen (top
   right) — with perspective: stalks scale up toward the viewer
   (0.68x back row -> 1.2x front), and circle designs live in an UNSQUASHED
   ground plane rendered at 0.62 vertical foreshortening — so every circle
   appears as the ellipse it should. Stalks vary by hash: height, lean,
   thickness, straw tone, and one of three head shapes (plain, awned spike,
   heavy nodding head). Flattened stalks lie along their design's LAY
   direction (a swirl), and their brightness follows the angle between lay
   and the light (upper-left) — the combed shading that makes real crop
   circles read from a hill. The MAGIC WAND button stamps a design (typed
   requests come later); CLEAR stands the field back up.
   THE WHEAT DOES NOT SQUIRM (Scott, 2026-08-12): every stalk is ONE fixed
   exemplar. (A gentle breeze is a later, separate feature.) When the wand
   fires, the design WEAVES ITSELF IN over a few seconds — an unseen
   microwave-blast tool working shape by shape, sweeping each disc/ring
   around its swirl. How that stays cheap at this density is documented at
   the DOUBLE RESOLUTION note below. */
const CROP={x:32, y:32, w:548, h:320, sq:0.62};    // nearly the whole screen (world px)
const CROP_NOTCH={lx:340, lz:102};                 // top-right cut-out for the sky-door pen
const CROP_SCR=8, CROP_TOP=22;                     // screen; canvas headroom for stalk tops
const CROP_SHAPE_LEN=95, CROP_SHAPE_DT=65;         // frames: default weave length / stagger
/* DOUBLE RESOLUTION (Scott, 2026-08-12): 208 stalk rows and half the
   horizontal step — ~40,000 stalks. At that count a per-frame re-render is
   off the table, so the weave changed architecture: TWO cached canvases —
   cropStand (the field standing) and cropFlat (the finished pattern) — each
   built in 26-row chunks across frames, and the weave itself is a cheap
   clip-path reveal: pie-wedge sweeps around each disc/ring (matching the
   swirl), growing rects along bars, compositing cropFlat over cropStand.
   The clip IS the microwave front; a faint warm beam rides just behind it. */
const CROP_ROWS=208, CROP_CHUNK=26;
let cropShapes=[], cropAnim=null;                  // cropAnim = {t, total} while weaving
let cropNext=0;                                    // the wand cycles its repertoire
let cropStandRow=0, cropFlatRow=0;                 // chunked-builder progress (rows done)
const cropStand=document.createElement('canvas'), cropFlat=document.createElement('canvas');
cropStand.width=cropFlat.width=(CROP.w+12)*SCALE;
cropStand.height=cropFlat.height=(CROP.h+CROP_TOP+8)*SCALE;
/* stalks (and wash) are skipped inside the pen notch */
function cropInNotch(lx,lz){ return lx>CROP_NOTCH.lx && lz<CROP_NOTCH.lz; }

/* screen depth -> unsquashed ground depth */
function cropGz(z){ return (z-CROP.y)/CROP.sq; }

/* If a design flattens this spot: its lay angle (ground space) AND its
   flatten-time — the frame, from the wand firing, at which the unseen tool
   reaches this stalk. Shapes go down one after another (i*CROP_SHAPE_DT);
   discs and rings weave AROUND their swirl (angular sweep, slight
   inward/outward lag), bars run along their length. Else null. */
/* membership + lay only — timing now lives in the reveal path, not here */
function cropLayInfo(gx,gz){
  for(let i=0;i<cropShapes.length;i++){
    const s=cropShapes[i];
    /* bbox fast-reject — with ~50-shape designs (the Julia) this is what
       keeps a 40k-stalk render affordable */
    if(s.bx0===undefined){
      const R= s.kind==='disc'? s.r : s.kind==='ring'? s.r1 : s.len+s.hw;
      s.bx0=s.cx-R; s.bx1=s.cx+R; s.bz0=s.cz-R; s.bz1=s.cz+R;
    }
    if(gx<s.bx0||gx>s.bx1||gz<s.bz0||gz>s.bz1) continue;
    const dx=gx-s.cx, dz=gz-s.cz, d=Math.hypot(dx,dz);
    if(s.kind==='disc' && d<=s.r){
      /* the photos' detail: a small STANDING tuft at every disc centre */
      if(s.r>12 && d<=Math.min(3.2, s.r*0.14)) continue;
      return {lay: Math.atan2(dz,dx)+s.dir*(Math.PI/2+0.35), s, d};
    }
    if(s.kind==='ring' && d>=s.r0 && d<=s.r1) return {lay: Math.atan2(dz,dx)+s.dir*(Math.PI/2+0.2), s, d};
    if(s.kind==='bar'){                             // straight corridor from (cx,cz), angle a
      const ca=Math.cos(s.a), sa=Math.sin(s.a);
      const u=dx*ca+dz*sa, v=-dx*sa+dz*ca;
      if(u>=0&&u<=s.len&&Math.abs(v)<=s.hw) return {lay:s.a, s, d};
    }
  }
  return null;
}
/* per-shape brightness variation — in the photos no two circles read the
   same shade of cream */
function cropAssignBri(S){ S.forEach((s,i)=>{ s.bri=0.93+((i*37)%17)/17*0.14; }); return S; }
function cropLayAt(gx,gz){ const f=cropLayInfo(gx,gz); return f? f.lay : null; }
/* per-shape weave window: [start, start+length] frames */
function cropShapeWindow(s,i){
  return [s.t0!==undefined? s.t0 : i*CROP_SHAPE_DT,
          s.len2!==undefined? s.len2 : CROP_SHAPE_LEN];
}
/* when the last stalk of a design goes down (drives cropAnim.total) */
function cropWeaveTotal(sh){
  let m=0;
  for(let i=0;i<sh.length;i++){ const [w0,wl]=cropShapeWindow(sh[i],i); m=Math.max(m,w0+wl); }
  return m+24;
}
/* Append the REVEAL region for weave-times tStart..tEnd to the current ctx
   path (screen coords): a pie wedge sweeping around each disc/ring in its
   swirl direction, a growing rect along each bar. With tStart=-1 this is
   "everything the tool has done by tEnd" — the clip through which cropFlat
   shows; with tStart=tEnd-18 it is the thin working band the warm beam
   tints. */
function cropRevealPath(g,tStart,tEnd){
  for(let i=0;i<cropShapes.length;i++){
    const s=cropShapes[i], [w0,wl]=cropShapeWindow(s,i);
    let f1=(tEnd-w0)/wl; if(f1<=0) continue; f1=Math.min(1,f1);
    let f0=Math.max(0,(tStart-w0)/wl); if(f0>=1) continue;
    const cx=CROP.x+s.cx, cy=CROP.y+s.cz*CROP.sq+HUD;
    if(s.kind==='disc'||s.kind==='ring'){
      const R=(s.kind==='disc'? s.r : s.r1)+2.5;
      if(f0<=0 && f1>=1){
        g.moveTo(cx+R,cy); g.ellipse(cx,cy,R,R*CROP.sq,0,0,Math.PI*2,false);
        continue;
      }
      /* the sweep starts at ground angle PI and runs with s.dir; the y-squash
         maps ground angles straight onto ellipse parameters */
      const a0= s.dir>0? -Math.PI+f0*2*Math.PI : Math.PI-f0*2*Math.PI;
      const a1= s.dir>0? -Math.PI+f1*2*Math.PI : Math.PI-f1*2*Math.PI;
      g.moveTo(cx,cy);
      g.ellipse(cx,cy,R,R*CROP.sq,0,a0,a1,s.dir<0);
      g.closePath();
    } else {
      const ca=Math.cos(s.a), sa=Math.sin(s.a)*CROP.sq;   // along, on screen
      const px=-Math.sin(s.a), pz=Math.cos(s.a)*CROP.sq;  // across, on screen
      const u0=s.len*f0, u1=s.len*f1, hw=s.hw+2;
      g.moveTo(cx+ca*u0+px*hw, cy+sa*u0+pz*hw);
      g.lineTo(cx+ca*u1+px*hw, cy+sa*u1+pz*hw);
      g.lineTo(cx+ca*u1-px*hw, cy+sa*u1-pz*hw);
      g.lineTo(cx+ca*u0-px*hw, cy+sa*u0-pz*hw);
      g.closePath();
    }
  }
}
/* the wand's repertoire — each click weaves the next design. The typed
   what-do-you-want box will land here later. */
function cropDefaultDesign(){
  const cx=CROP.w/2, cz=(CROP.h/CROP.sq)/2;        // ground-space centre of the field
  return cropAssignBri([
    {kind:'disc', cx, cz, r:68, dir:1, orb:true},
    {kind:'ring', cx, cz, r0:88, r1:104, dir:-1, orb:true},
    {kind:'bar',  cx:cx+104, cz, a:0,       len:40, hw:6},
    {kind:'disc', cx:cx+164, cz, r:20, dir:-1, orb:true},
    {kind:'bar',  cx:cx-144, cz, a:Math.PI, len:40, hw:6},
    {kind:'disc', cx:cx-164, cz, r:20, dir:1, orb:true}
  ]);
}
/* THE TRIPLE JULIA SET — rebuilt against the Windmill Hill 1996 photo
   (intake/triplejuliacropcircle.jpg): each arm is a CHAIN of near-tangent
   circles (spacing derived from consecutive radii, not a fixed angle step),
   curling ~292 degrees, with small satellite circles flanking the chain the
   way the real formation trails them. 124 discs, 3-fold symmetry. All three
   arms weave CONCURRENTLY; an orb of light rides each arm's working front. */
function cropJuliaDesign(){
  /* REBUILT 2026-08-18 against the probe render. The first build packed 124
     discs so tightly that the three arms collided into one unreadable knot:
     fifteen r>14 circles inside ground radius 90 is a blob, whatever the
     mathematics say. This one keeps the same grammar — a tangent chain of
     shrinking circles per arm, three-fold symmetry, satellites trailing the
     chain — but the chain STEPS OUT faster than it shrinks, so each arm
     stays clear of its neighbours and the spiral actually reads. 55 discs:
     centre + 3 arms of 14 + 12 satellites. */
  const cx=CROP.w*0.44, cz=(CROP.h/CROP.sq)*0.58;
  const S=[{kind:'disc', cx, cz, r:22, dir:1, t0:0, len2:30, orb:true}];
  for(let arm=0;arm<3;arm++){
    const base=arm*2.0944+0.5;                     // 120 degrees apart
    let th=0;
    for(let j=0;j<14;j++){
      const d=55*Math.exp(0.08*j);                 // log-spiral radius
      const r=Math.max(7.5, 15*Math.exp(-0.05*j)); // shrinking circles, floored
      if(j>0){ const rp=Math.max(7.5,15*Math.exp(-0.05*(j-1))); th+=(r+rp)/d; }  // tangent chain
      const a=base+th;
      S.push({kind:'disc', cx:cx+Math.cos(a)*d, cz:cz+Math.sin(a)*d, r,
              dir:1, t0:30+j*13, len2:26, orb:true});
      if(j>=2 && j<=9 && j%2===0){                 // sparse satellites, outer side only
        const sr=2.4+r*0.14;
        S.push({kind:'disc', cx:cx+Math.cos(a)*(d+r+sr+2.5), cz:cz+Math.sin(a)*(d+r+sr+2.5),
                r:sr, dir:-1, t0:34+j*13, len2:16});
      }
    }
  }
  return cropAssignBri(S);
}

/* Render rows [from,to) of the field into a canvas — the chunked builder
   both cached canvases share. withDesign=false -> everything stands
   (cropStand); true -> the finished pattern (cropFlat). At from===0 the
   canvas is wiped and (withDesign) the pressed-earth wash goes down. */
function cropRenderRows(cnv, withDesign, from, to){
  const LIGHT=-2.2;                                 // light from the upper-left
  const g=cnv.getContext('2d');
  g.setTransform(SCALE,0,0,SCALE,0,0);
  const OX=6, OY=CROP_TOP;
  if(from===0){
    g.clearRect(0,0,CROP.w+12,CROP.h+CROP_TOP+8);
    // TRAMLINES — the drill's paired wheel tracks. Every reference photo
    // has them, running straight through formations; nothing says "real
    // field" louder. Drawn under the stalks; the gaps let them show.
    g.strokeStyle='rgba(44,52,20,.22)'; g.lineWidth=1.3;
    for(let tx=16; tx<CROP.w-4; tx+=27){
      for(const off of [0,3.2]){
        const lx=tx+off, zTop= cropInNotch(lx,1)? CROP_NOTCH.lz : 0;
        g.beginPath(); g.moveTo(OX+lx,OY+zTop); g.lineTo(OX+lx,OY+CROP.h); g.stroke();
      }
    }
  }
  if(withDesign){
    // pressed-earth wash for THIS chunk's depth band, so the gaps between
    // lying stalks read as soil rather than untouched meadow
    const zA= from<=0? 0 : Math.floor(2+(from/(CROP_ROWS-1))*(CROP.h-6))-2;
    const zB= to>=CROP_ROWS? CROP.h : Math.ceil(2+(to/(CROP_ROWS-1))*(CROP.h-6))+2;
    /* the floor is a MAT of lying straw, not a pit: near-opaque pale base
       with a sparse soil speckle, so the comb strokes on top shade a bright
       surface instead of fighting a dark one (probe render, 2026-08-18) */
    for(let z=Math.max(1,zA);z<zB;z+=2) for(let x=1;x<CROP.w;x+=2){
      if(cropInNotch(x,z)) continue;
      if(cropLayInfo(x,cropGz(CROP.y+z))){
        g.fillStyle= hash2(x*3,z*5)<0.12? 'rgba(124,101,55,.8)' : 'rgba(223,199,118,.95)';
        g.fillRect(OX+x,OY+z,2,2);
      }
    }
  }
  // stalks, back row to front, so nearer wheat overlaps farther wheat.
  // ONE exemplar each: everything below hangs only on position hashes.
  // DOUBLE RESOLUTION: 208 rows, half the step of the first build.
  for(let zi=from;zi<to && zi<CROP_ROWS;zi++){
    const zt=zi/(CROP_ROWS-1);
    const z=2+zt*(CROP.h-6)+(hash2(zi,7)-0.5)*1.4;  // screen depth in the field
    const sc=0.68+0.52*zt;                          // perspective: near = bigger
    const step=2.2+0.8*zt;                          // and a touch sparser up close
    for(let x=2+((zi%4)*0.6); x<CROP.w-2; x+=step){
      if(cropInNotch(x,z)) continue;                // the pen keeps its yard
      const hv=hash2(Math.floor(x*7)+zi*131, zi*17);
      const hv2=hash2(zi*29+Math.floor(x*3), 401);
      const sx=x+(hv-0.5)*1.8, szz=z+(hv2-0.5)*1.4;
      const h=(8.5+hv*5.5)*sc;                      // varied height
      const lean=(hv2-0.5)*2.6-0.4*hv;              // varied set lean — fixed for life
      const th=(0.6+hv2*0.5)*sc;                    // varied thickness (finer at 2x density)
      const tone=Math.floor(hv*97)%3;
      const fi= withDesign? cropLayInfo(sx, cropGz(CROP.y+szz)) : null;
      if(!fi){
        // STANDING: darker stem, lit head (contrast deepened to photo levels)
        g.strokeStyle=['#7d6926','#897432','#716021'][tone];
        g.lineWidth=th;
        g.beginPath(); g.moveTo(OX+sx,OY+szz); g.lineTo(OX+sx+lean,OY+szz-h); g.stroke();
        const hx=OX+sx+lean, hy=OY+szz-h;
        g.fillStyle=['#d8ba5a','#e2c66a','#cfae4e'][tone];
        if(hv2<0.45){                               // plain head
          g.fillRect(hx-1*sc,hy-2.4*sc,2*sc,3.2*sc);
        } else if(hv2<0.8){                         // awned spike
          g.fillRect(hx-0.8*sc,hy-2.2*sc,1.6*sc,3*sc);
          g.strokeStyle='rgba(226,198,106,.6)'; g.lineWidth=0.5;
          g.beginPath(); g.moveTo(hx,hy-2*sc); g.lineTo(hx+1.8*sc,hy-4.4*sc);
          g.moveTo(hx,hy-1.2*sc); g.lineTo(hx-1.6*sc,hy-3.6*sc); g.stroke();
        } else {                                    // heavy, nodding head
          g.beginPath(); g.ellipse(hx+0.8*sc,hy-0.6*sc,1.6*sc,2.4*sc,0.5,0,7); g.fill();
        }
      } else {
        // FLATTENED: pale straw lying along the lay, combed shading from
        // the lay angle vs the light; foreshortened on screen. Photo-tuned:
        // per-circle brightness (bri), and concentric swirl BANDS inside
        // larger discs — the ring texture every aerial shot shows.
        const lay=fi.lay, fs=fi.s;
        let br=(0.85+0.16*Math.cos(lay-LIGHT))*(fs.bri||1);
        if(fs.kind==='disc' && fs.r>10) br+=0.032*Math.sin((fi.d/fs.r)*Math.PI*3);
        const L=h*0.92;
        const ex=Math.cos(lay)*L, ez=Math.sin(lay)*L*CROP.sq;
        g.strokeStyle='rgba('+Math.round(Math.min(255,231*br))+','+Math.round(Math.min(255,207*br))+','+Math.round(120*br)+',.9)';
        g.lineWidth=th;
        g.beginPath(); g.moveTo(OX+sx,OY+szz); g.lineTo(OX+sx+ex,OY+szz+ez); g.stroke();
        g.fillStyle='rgba('+Math.round(Math.min(255,249*br))+','+Math.round(Math.min(255,226*br))+','+Math.round(142*br)+',.85)';
        g.fillRect(OX+sx+ex-0.7,OY+szz+ez-0.7,1.4,1.4);
      }
    }
  }
  // EDGE-WALL SHADOW — in the photos the standing crop casts a thin dark
  // line just inside every circle's rim. One stroke per shape, drawn once
  // the last chunk lands.
  if(withDesign && to>=CROP_ROWS){
    g.strokeStyle='rgba(58,48,22,.22)'; g.lineWidth=2;
    for(const s of cropShapes){
      if(s.kind==='disc' && s.r>10){
        g.beginPath(); g.ellipse(OX+s.cx,OY+s.cz*CROP.sq,s.r-1.5,(s.r-1.5)*CROP.sq,0,0,Math.PI*2); g.stroke();
      } else if(s.kind==='ring'){
        g.beginPath(); g.ellipse(OX+s.cx,OY+s.cz*CROP.sq,s.r0+1.4,(s.r0+1.4)*CROP.sq,0,0,Math.PI*2); g.stroke();
        g.beginPath(); g.ellipse(OX+s.cx,OY+s.cz*CROP.sq,s.r1-1.4,(s.r1-1.4)*CROP.sq,0,0,Math.PI*2); g.stroke();
      }
    }
  }
}
function drawCropField(){
  const DX=CROP.x-6, DY=CROP.y-CROP_TOP+HUD, DW=CROP.w+12, DH=CROP.h+CROP_TOP+8;
  // chunked builders: a few rows per frame, no hitches
  if(cropStandRow<CROP_ROWS){ cropRenderRows(cropStand,false,cropStandRow,cropStandRow+CROP_CHUNK); cropStandRow+=CROP_CHUNK; }
  if(cropShapes.length && cropFlatRow<CROP_ROWS){ cropRenderRows(cropFlat,true,cropFlatRow,cropFlatRow+CROP_CHUNK); cropFlatRow+=CROP_CHUNK; }
  // the weave clock only runs once the finished pattern is ready to reveal
  if(cropAnim && !paused && cropFlatRow>=CROP_ROWS){
    cropAnim.t++;
    if(cropAnim.t>=cropAnim.total) cropAnim=null;   // fully woven — pure cropFlat from here
  }
  if(!cropShapes.length){ ctx.drawImage(cropStand,DX,DY,DW,DH); return; }
  if(!cropAnim && cropFlatRow>=CROP_ROWS){ ctx.drawImage(cropFlat,DX,DY,DW,DH); return; }
  // mid-weave: the standing field, with the pattern showing through the
  // reveal clip — the clip boundary IS the tool's working front
  ctx.drawImage(cropStand,DX,DY,DW,DH);
  const t=cropAnim? cropAnim.t : 0;
  if(t>0){
    ctx.save(); ctx.beginPath();
    cropRevealPath(ctx,-1,t);
    ctx.clip(); ctx.drawImage(cropFlat,DX,DY,DW,DH); ctx.restore();
    // the warm beam riding the front — microwave-fresh
    ctx.save(); ctx.beginPath();
    cropRevealPath(ctx,t-16,t);
    ctx.clip(); ctx.fillStyle='rgba(255,222,150,.16)'; ctx.fillRect(DX,DY,DW,DH); ctx.restore();
    drawCropOrbs(t);
  }
}
/* ORBS OF LIGHT — the classic eyewitness account: small bright spheres
   circling low over the crop while it lays down. One rides each active
   main shape's working front (satellites don't get one); short ghost trail
   behind. They ARE the unseen tool, almost seen. */
function drawCropOrbs(t){
  let drawn=0;
  for(let i=0;i<cropShapes.length && drawn<5;i++){
    const s=cropShapes[i]; if(!s.orb) continue;
    const [w0,wl]=cropShapeWindow(s,i);
    const f=(t-w0)/wl; if(f<=0||f>=1) continue;
    drawn++;
    for(let k=3;k>=0;k--){                          // k=0 is the orb, rest trail
      const fk=Math.max(0,f-k*0.035);
      let ox,oy;
      if(s.kind==='bar'){
        ox=CROP.x+s.cx+Math.cos(s.a)*s.len*fk;
        oy=CROP.y+(s.cz+Math.sin(s.a)*s.len*fk)*CROP.sq+HUD;
      } else {
        const R=(s.kind==='disc'? s.r : (s.r0+s.r1)/2)*0.8;
        const a= s.dir>0? -Math.PI+fk*2*Math.PI : Math.PI-fk*2*Math.PI;
        ox=CROP.x+s.cx+Math.cos(a)*R;
        oy=CROP.y+(s.cz+Math.sin(a)*R)*CROP.sq+HUD;
      }
      oy-=7+Math.sin(frame*0.2+i)*1.6;              // hovering just above the crop
      if(k===0){
        const gl=ctx.createRadialGradient(ox,oy,0.5,ox,oy,9);
        gl.addColorStop(0,'rgba(255,250,225,.95)'); gl.addColorStop(0.35,'rgba(255,228,160,.5)');
        gl.addColorStop(1,'rgba(255,228,160,0)');
        ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(ox,oy,9,0,7); ctx.fill();
        ctx.fillStyle='#fffbe8'; ctx.beginPath(); ctx.arc(ox,oy,2.2,0,7); ctx.fill();
      } else {
        ctx.fillStyle='rgba(255,236,180,'+(0.28-k*0.08).toFixed(2)+')';
        ctx.beginPath(); ctx.arc(ox,oy,1.6,0,7); ctx.fill();
      }
    }
  }
}
/* THE WAND is a world object now (Scott, 2026-08-12): a low stone plinth at
   the field's bottom-left corner. Walk to it, press SPACE. Each press cycles
   Julia -> classic -> stand-the-field-back-up -> around again. */
function cropWandActivate(){
  const mode=cropNext%3;
  if(mode===2){
    cropShapes=[]; cropAnim=null; cropFlatRow=0;
    sfx.pick&&sfx.pick();
    toast('The wheat stands back up, pretending nothing happened.');
  } else {
    cropShapes= mode===0? cropJuliaDesign() : cropDefaultDesign();
    cropFlatRow=0;                                 // rebuild the finished pattern in chunks
    cropAnim={t:0, total:cropWeaveTotal(cropShapes)};
    sfx.task&&sfx.task();
    toast(mode===0? 'The wand hums a chord. Out in the wheat, three spirals begin to unfurl.'
                  : 'The wand hums. Somewhere above, something switches on — and the wheat begins to lie down.');
  }
  cropNext++;
}
function drawCropWand(d){
  const x=d.x+16, y=d.y+HUD+28;
  ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x,y+2,14,4,0,0,7); ctx.fill();
  // the plinth — a low weathered stone in the wheat
  const pg=ctx.createLinearGradient(0,y-12,0,y+2);
  pg.addColorStop(0,'#b8b2a2'); pg.addColorStop(1,'#8a857a');
  ctx.fillStyle=pg; rr(ctx,x-13,y-11,26,13,3); ctx.fill();
  ctx.strokeStyle='rgba(40,36,28,.5)'; ctx.lineWidth=1.3; ctx.stroke();
  ctx.fillStyle='#cfc9b8'; rr(ctx,x-11,y-13,22,4,2); ctx.fill();
  // the wand itself, resting at an angle
  ctx.save(); ctx.translate(x,y-14); ctx.rotate(-0.55);
  ctx.strokeStyle='#6d4e24'; ctx.lineWidth=2.8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-8,5); ctx.lineTo(8,-6); ctx.stroke();
  ctx.strokeStyle='#96713a'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(-7,4.4); ctx.lineTo(7,-5.6); ctx.stroke();
  ctx.restore();
  // twinkling tip
  const tw=0.55+0.45*Math.sin(frame*0.15), tx=x+7, ty=y-21;
  const gl=ctx.createRadialGradient(tx,ty,0.5,tx,ty,10);
  gl.addColorStop(0,'rgba(220,190,255,'+(0.5*tw).toFixed(2)+')'); gl.addColorStop(1,'rgba(220,190,255,0)');
  ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(tx,ty,10,0,7); ctx.fill();
  ctx.fillStyle='rgba(232,210,255,'+tw.toFixed(2)+')';
  ctx.beginPath(); ctx.moveTo(tx,ty-4.4); ctx.lineTo(tx+1.4,ty-1.4); ctx.lineTo(tx+4.4,ty);
  ctx.lineTo(tx+1.4,ty+1.4); ctx.lineTo(tx,ty+4.4); ctx.lineTo(tx-1.4,ty+1.4);
  ctx.lineTo(tx-4.4,ty); ctx.lineTo(tx-1.4,ty-1.4); ctx.closePath(); ctx.fill();
  drawLabel('THE WAND', x, y-32, '#d8c8f0');
  if(Math.hypot(PL.x-x,PL.y-(d.y+24))<52){
    const mode=cropNext%3;
    drawLabel(mode===2? '[SPACE] let the field rest' : '[SPACE] '+(mode===0?'the triple julia':'the old classic'), x+4, y+16, '#ffffff');
  }
}

/* ---------------- THE SLUICE GATES ----------------
   The Riverlands' west bank, and the replacement for the mined ford
   (Scott, 2026-08-15). The minesweeper was a modal bolted onto a screen
   EDGE — a menu you had to clear before the game would let you walk. This
   is the same job done in the world instead. A drainage channel cuts the
   bank from treeline to treeline, and four gate wheels on the near side
   decide whether it runs.

   The catch is the linkage: a gate never moves alone, it throws its
   neighbours with it. Rods run between them in plain sight, because a
   puzzle whose shape you cannot see is not a puzzle, it is a lock. Shut
   every gate and the channel drains; walk the bed and cross.

   FRESH EVERY CROSSING (Scott's call): the moment you are clear on the far
   bank the gates wind open behind you and the water comes back, so the way
   home is its own puzzle. The board is scrambled by replaying random turns
   from the SOLVED state, which makes it always solvable — never a wall,
   and never twice the same shape. */
const SLU_SCR=6;                          // RIVERLANDS
const SLU_C0=4, SLU_C1=5;                 // the channel's two columns
const SLU_R0=1, SLU_R1=10;                // treeline to treeline
const SLU_GC=3, SLU_ROWS=[2,4,7,9];       // the four wheels, on the near bank
const SLU_FILL=0.06;                      // below this the bed is dry enough to walk
let sluGates=[false,false,false,false];   // true = OPEN, water running
let sluLevel=0;                           // 0 drained .. 1 full, animated
let sluFlooded=false;                     // is the cut currently solid
let sluSide=-1;                           // which bank the player was last clear on
let sluSpin=[0,0,0,0];                    // extra kick on the wheel you just turned
let sluFlash=[0,0,0,0];                   // ringed for a moment = this pull moved me

function sluOpen(){ let n=0; for(const g of sluGates) if(g) n++; return n; }
/* a gate never moves alone — it takes its neighbours with it */
function sluTurn(i){
  for(const j of [i-1,i,i+1]) if(j>=0 && j<sluGates.length) sluGates[j]=!sluGates[j];
}
function sluScramble(){
  /* replay random turns from the SOLVED board. Every turn is its own
     inverse, so whatever comes out can always be undone — the player can
     never be handed a crossing that will not open. */
  for(let guard=0; guard<24; guard++){
    sluGates=[false,false,false,false];
    const turns=3+Math.floor(Math.random()*4);
    for(let k=0;k<turns;k++) sluTurn(Math.floor(Math.random()*sluGates.length));
    if(sluOpen()>0) break;                // never hand it over already solved
  }
  if(sluOpen()===0) sluTurn(1);
  sluSpin=[0,0,0,0]; sluFlash=[0,0,0,0]; sluLevel=1;
}
function sluSetFlood(on){
  if(on===sluFlooded) return;
  sluFlooded=on;
  for(let r=SLU_R0;r<=SLU_R1;r++) for(const c of [SLU_C0,SLU_C1]){
    if(on) solid.add(key(c,r)); else solid.delete(key(c,r));
  }
}
function sluReset(){
  sluScramble();
  sluFlooded=false; sluSetFlood(true);
  for(const r of SLU_ROWS) solid.add(key(SLU_GC,r));   // the machinery is solid
  /* 0 = bank not yet known. loadScreen runs BEFORE the transition drops the
     player on the new edge, so reading PL.x here would record the bank he is
     LEAVING and announce a re-arm the instant he arrived. The first tick
     that finds him clear of the cut adopts his bank in silence. */
  sluSide = 0;
}
/* nearest wheel wins, never the first one in range — the Village Fields
   corn bug (Cameron, beta 2026-08-15) was exactly this mistake */
function sluGateNear(){
  if(curScr!==SLU_SCR) return -1;
  let best=-1, bd=46;
  for(let i=0;i<SLU_ROWS.length;i++){
    const dd=Math.hypot(PL.x-(SLU_GC*T+16), PL.y-(SLU_ROWS[i]*T+22));
    if(dd<bd){ bd=dd; best=i; }
  }
  return best;
}
function sluPull(i){
  sluTurn(i); sluSpin[i]=18;
  /* ring every wheel this pull moved. The linkage is drawn in rods already,
     but a rod is a diagram — the flash is the consequence, and one turn now
     teaches "a gate never moves alone" without a line of text. */
  for(const j of [i-1,i,i+1]) if(j>=0 && j<sluGates.length) sluFlash[j]=22;
  sfx.task&&sfx.task();
  if(sluOpen()===0) toast('The last gate drops. Downstream, the channel starts to run dry.');
}
function sluTick(){
  const target=sluOpen()/sluGates.length;
  sluLevel += (target-sluLevel)*0.12;
  if(Math.abs(sluLevel-target)<0.004) sluLevel=target;
  for(let i=0;i<sluSpin.length;i++) if(sluSpin[i]>0) sluSpin[i]--;
  for(let i=0;i<sluFlash.length;i++) if(sluFlash[i]>0) sluFlash[i]--;
  sluSetFlood(sluLevel>SLU_FILL);
  /* caught in the cut when it fills: washed up the bank, not killed. A
     puzzle that can take a life for dawdling is a puzzle nobody re-reads. */
  if(sluFlooded && !boxFree(PL.x,PL.y,PL.w,PL.h)){
    unstick(PL);
    toast('The channel fills. You scramble up the bank ahead of it.');
  }
  /* fresh every crossing: once you are CLEAR on the far bank, the sappers
     wind it open again behind you. Clear, not merely across — re-arming it
     under someone still standing in the bed would be the ford's old sin. */
  const side = PL.x < (SLU_C0-1)*T ? -1 : PL.x > (SLU_C1+2)*T ? 1 : 0;
  if(side!==0 && sluSide===0) sluSide=side;          // just arrived: note it, say nothing
  else if(side!==0 && side!==sluSide){
    sluSide=side; sluScramble(); sluSetFlood(true);
    sfx.denied&&sfx.denied();
    toast('Behind you the gates wind open and the channel fills again.');
  }
}

/* ---- the cut, drawn from above: depth reads as colour and opacity, never
   as a water line. A rectangle filling from its bottom edge is a SIDE view
   and would promise dry bed at the top that you cannot walk on. ---- */
function drawSluiceChannel(){
  const x0=SLU_C0*T, w=(SLU_C1-SLU_C0+1)*T;
  const y0=SLU_R0*T+HUD, h=(SLU_R1-SLU_R0+1)*T;
  const bg=ctx.createLinearGradient(x0,y0,x0+w,y0);
  bg.addColorStop(0,'#393126'); bg.addColorStop(0.5,'#574c3b'); bg.addColorStop(1,'#393126');
  ctx.fillStyle=bg; ctx.fillRect(x0,y0,w,h);
  ctx.strokeStyle='rgba(20,14,8,.30)'; ctx.lineWidth=1;
  for(let y=y0+7;y<y0+h;y+=11){ ctx.beginPath(); ctx.moveTo(x0+2,y); ctx.lineTo(x0+w-2,y); ctx.stroke(); }
  ctx.fillStyle='#6d6152'; ctx.fillRect(x0-3,y0,3,h); ctx.fillRect(x0+w,y0,3,h);
  if(sluLevel>0.001){
    const lv=Math.min(1,sluLevel);
    ctx.globalAlpha=0.42+0.58*lv;
    const wg=ctx.createLinearGradient(x0,y0,x0+w,y0);
    wg.addColorStop(0,'#2b66a8'); wg.addColorStop(0.5,'#3b83c8'); wg.addColorStop(1,'#2b66a8');
    ctx.fillStyle=wg; ctx.fillRect(x0,y0,w,h);
    /* the race: streaks running the length of the cut, faster the deeper it is */
    ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=1.6; ctx.lineCap='round';
    for(let k=0;k<12;k++){
      const sx=x0+5+((k*23)%(w-10));
      const sp=(frame*(0.9+2.6*lv)+k*37)%(h+40)-20;
      ctx.beginPath(); ctx.moveTo(sx, y0+sp); ctx.lineTo(sx, y0+Math.min(h,sp+13)); ctx.stroke();
    }
    ctx.globalAlpha=1;
  } else {
    /* drained: the bed dries pale and cracked, so "you may walk here" is
       something you can see rather than something you have to test */
    ctx.strokeStyle='rgba(214,198,164,.30)'; ctx.lineWidth=1.2;
    for(let k=0;k<10;k++){
      const cy=y0+14+k*(h-24)/9, cx=x0+6+((k*17)%(w-14));
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+9,cy+5); ctx.lineTo(cx+4,cy+11); ctx.stroke();
    }
  }
  // the linkage rods, so the chain between the wheels is never a secret
  ctx.strokeStyle='rgba(96,82,62,.9)'; ctx.lineWidth=3;
  for(let i=0;i<SLU_ROWS.length-1;i++){
    const x=SLU_GC*T+16;
    ctx.beginPath();
    ctx.moveTo(x-5, SLU_ROWS[i]*T+HUD+26);
    ctx.lineTo(x-5, SLU_ROWS[i+1]*T+HUD+6);
    ctx.stroke();
  }
}
function drawSluiceGate(i){
  const x=SLU_GC*T+16, y=SLU_ROWS[i]*T+HUD+16, open=sluGates[i];
  if(sluFlash[i]>0){
    const a=sluFlash[i]/22;
    ctx.strokeStyle='rgba(255,231,140,'+(0.12+0.55*a).toFixed(3)+')'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(x, y-4, 17+(1-a)*9, 0, 7); ctx.stroke();
  }
  ctx.fillStyle='#6d6152'; rr(ctx,x-13,y-14,26,28,3); ctx.fill();
  ctx.strokeStyle='#39312a'; ctx.lineWidth=2; ctx.stroke();
  const lift=open? 8 : 0;                       // hauled up = water runs
  ctx.fillStyle= open? '#8a7448' : '#3f5c7c';
  ctx.fillRect(x-9, y-7-lift, 18, 15);
  ctx.strokeStyle='rgba(18,14,9,.65)'; ctx.lineWidth=1.4;
  ctx.strokeRect(x-9, y-7-lift, 18, 15);
  ctx.save();
  ctx.translate(x, y-19);
  /* a wheel only turns when water is driving it. Open = whirling, shut =
     dead still — so which gates are running is readable from the far bank
     with no text at all. It used to drift slowly in BOTH states, which is
     exactly as informative as not moving. */
  ctx.rotate((open? frame*0.075 : 0) + i*1.7 + (sluSpin[i]>0? (18-sluSpin[i])*0.36 : 0));
  ctx.strokeStyle= open? '#e0c47a' : '#8fb8dd'; ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.arc(0,0,7,0,7); ctx.stroke();
  ctx.lineWidth=1.8;
  for(let k=0;k<4;k++){
    const th=k*Math.PI/2;
    ctx.beginPath(); ctx.moveTo(Math.cos(th)*2,Math.sin(th)*2);
    ctx.lineTo(Math.cos(th)*7,Math.sin(th)*7); ctx.stroke();
  }
  ctx.restore();
}
function drawSluicePrompt(){
  if(curScr!==SLU_SCR) return;
  const n=sluOpen();
  const gi=sluGateNear();
  if(gi>=0) drawLabel('[SPACE] turn the wheel', SLU_GC*T+16, SLU_ROWS[gi]*T+4+HUD, '#ffffff');
  /* the GOAL, stated before the puzzle instead of after it. The old line was
     "N gates still running", which only means something to a player who
     already knows that shutting them all drains the cut — and the one piece
     of text that did explain it fired on the turn that SOLVED it. Scott,
     2026-08-16: "I dont get the new barrier with the 4 water wheels — how to
     solve it or what it does." */
  if(PL.x < (SLU_C1+5)*T)
    drawLabel(n>0? ('SHUT ALL '+SLU_ROWS.length+' GATES TO DRAIN THE CUT — '+n+' still running')
                 : 'The bed is dry. Cross while it lasts.',
              RW/2, SLU_R1*T+30+HUD, n>0? '#8fb8dd' : '#a9e0a0');
}

/* ---------------- GAIT ----------------
   Cameron, beta 2026-08-15: "Character moonwalks when moving left or right. No
   exceptions." He was right, and the "no exceptions" was the tell: it was the
   shared sprite, not a screen. The old walk swung both feet ±1.2px in BODY
   space on a ~12-frame cycle while the body glided about 28px across the ground
   in the same time — so the feet slid backwards underneath it on every single
   step, which is the definition of a moonwalk.
   A walk cycle cannot be authored in body space. The planted foot has to hold
   still in WORLD space, so that is what these do: stepGait() plants a foot at a
   world x and leaves it there for half a cycle; footOffsets() subtracts the
   body's x to get the screen offset. The slide is zero by construction rather
   than by tuning, at any speed, up any slope. */
const GAIT_RATE=0.62, GAIT_MAX=6, GAIT_LIFT=3;
function stepGait(gdx, tf){
  const half=Math.PI/GAIT_RATE;               // frames in one half-cycle
  /* the first step out of a standstill has to plant a foot before it can hold
     one still, or the body walks a whole half-stride away from a plant left
     sitting underneath where it was standing */
  if(PL.gaitP===0){
    PL.gaitStride=Math.max(-GAIT_MAX,Math.min(GAIT_MAX,gdx*half/2));
    PL.gaitPlant=PL.x+PL.gaitStride;
    PL.gaitPrev=PL.x-PL.gaitStride;
  }
  const was=Math.floor(PL.gaitP/Math.PI);
  PL.gaitP+=GAIT_RATE*tf;
  if(Math.floor(PL.gaitP/Math.PI)===was) return;
  PL.gaitStance^=1;
  PL.gaitPrev=PL.gaitPlant;                   // the foot that just came off the ground
  /* land the new one HALF a stride ahead, so by the end of its stance it sits
     half a stride behind — the body walks through the middle of its own step.
     gdx is the per-frame travel with the slope divided out, so a slog uphill
     takes shorter steps rather than sliding. */
  PL.gaitStride=Math.max(-GAIT_MAX,Math.min(GAIT_MAX,gdx*half/2));
  PL.gaitPlant=PL.x+PL.gaitStride;
}
function resetGait(){
  PL.gaitP=0; PL.gaitStance=0; PL.gaitStride=0;
  PL.gaitPlant=PL.x; PL.gaitPrev=PL.x;
}
function footOffsets(){
  if(!PL.walkT) return {a:0, b:0, la:0, lb:0};
  const u=(PL.gaitP%Math.PI)/Math.PI;         // 0..1 through this half-cycle
  const cl=v=>Math.max(-GAIT_MAX-3,Math.min(GAIT_MAX+3,v));
  const stance=cl(PL.gaitPlant-PL.x);         // pinned: shrinks as the body passes it
  const swing =cl((PL.gaitPrev-PL.x)*(1-u)+PL.gaitStride*u);
  const lift=Math.sin(u*Math.PI)*GAIT_LIFT;
  return PL.gaitStance===0? {a:stance, b:swing, la:0, lb:lift}
                          : {a:swing, b:stance, la:lift, lb:0};
}

/* ---------------- PLAYER UPDATE ---------------- */
function updatePlayer(){
  if(shopOpen){ shopInput(); return; }
  if(cyOpen){ cypherInput(); return; }
  if(wellOpen){ wellInput(); return; }
  if(gardenOpen) return;                    // DOM input owns the keyboard
  if(phaseT>0){ phaseT--; if(phaseT>44) return; }   // feet arrive before control does
  const d=dirHeld();
  PL.runT = (d.x||d.y) ? (PL.runT||0)+1 : 0;
  const spd = 2.2 + (PL.runT>72 ? Math.min(1.1,(PL.runT-72)/25) : 0);  // sprint after holding ~1.2s
  if(PL.kb.x||PL.kb.y){
    moveBox(PL,PL.kb.x,PL.kb.y);
    PL.kb.x*=0.8; PL.kb.y*=0.8;
    if(Math.abs(PL.kb.x)<0.3) PL.kb.x=0;
    if(Math.abs(PL.kb.y)<0.3) PL.kb.y=0;
  }
  if(PL.swing<=0 && (d.x||d.y)){
    const n=Math.hypot(d.x,d.y);
    const tf=slopeFactor(PL.x,PL.y);           // 20° slope = slog, 40° = 1/3 speed
    moveBox(PL, d.x/n*spd*tf, d.y/n*spd*tf);
    PL.fx=d.x; PL.fy=d.y; PL.walkT+=0.25*tf;
    stepGait(d.x/n*spd, tf);              // world-anchored feet: no moonwalk
    if(tf<1){                                   // sweat beads on the climb
      PL.sweatT=(PL.sweatT||0)+1;
      if(PL.sweatT % (tf<0.5?7:16) === 0){
        particles.push({x:PL.x-5+Math.random()*10, y:PL.y-32, vx:(Math.random()-0.5)*0.8, vy:0.7, life:20, color:'#d8ecff'});
      }
    }
    // keep walking into a boulder to shove it (slower uphill)
    const pb=pushAt(PL.x+Math.sign(d.x)*4, PL.y+Math.sign(d.y)*4, PL.w, PL.h, null);
    if(pb){
      const pf=0.5*slopeFactor(pb.x,pb.y);
      const ndx=Math.sign(d.x)*pf, ndy=Math.sign(d.y)*pf;
      if(ndx && tryFillGap(pb, pb.x+ndx, pb.y)){}
      else if(ndx && boxFree(pb.x+ndx,pb.y,pb.w,pb.h) && !pushAt(pb.x+ndx,pb.y,pb.w,pb.h,pb)){ pb.x+=ndx; pb.dust=6; }
      if(pushables.includes(pb)){
        if(ndy && tryFillGap(pb, pb.x, pb.y+ndy)){}
        else if(ndy && boxFree(pb.x,pb.y+ndy,pb.w,pb.h) && !pushAt(pb.x,pb.y+ndy,pb.w,pb.h,pb)){ pb.y+=ndy; pb.dust=6; }
      }
      checkSockets();
    }
  } else if(!d.x&&!d.y){ PL.walkT=0; resetGait(); }
  if(PL.iframes>0) PL.iframes--;
  if(britSit>0) britSit--;

  // action
  if(held[' '] && !PL.actLatch){
    PL.actLatch=true;
    if(!interact()){ PL.swing=14; PL.swingHit=false; sfx.swing(); }
  }
  if(!held[' ']) PL.actLatch=false;

  if(PL.swing>0){
    PL.swing--;
    if(PL.swing===8 && !PL.swingHit){ PL.swingHit=true; applySwing(); }
  }

  // pickups magnet + collect
  for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i];
    p.x+=p.vx; p.y+=p.vy; p.vx*=0.85; p.vy*=0.85;
    const dx=PL.x-p.x, dy=PL.y-p.y, dist=Math.hypot(dx,dy);
    if(p.settle>0){ p.settle--; }
    else if(dist<30){ p.x+=dx/dist*2.6; p.y+=dy/dist*2.6; }
    if(dist<12 && p.settle<=0){
      pickups.splice(i,1);
      if(p.type==='wood'){ res.wood=Math.min(99,res.wood+1); sfx.pick(); }
      else if(p.type==='stone'){ res.stone=Math.min(99,res.stone+1); sfx.pick(); }
      else if(p.type==='gold'){ res.gold=Math.min(999,res.gold+1); sfx.coin(); }
      else if(p.type==='heart'){ PL.hp=Math.min(PL.maxhp,PL.hp+1); sfx.heart(); }
      else if(p.type==='bread'){ PL.hp=Math.min(PL.maxhp,PL.hp+2); sfx.heart(); addFloat(PL.x,PL.y-30,'+2 ♥','#ff6a6a'); }
    }
  }
  // summit diamonds
  for(let i=diamonds.length-1;i>=0;i--){
    const dm=diamonds[i];
    if(Math.hypot(PL.x-dm.x,PL.y-dm.y)<22){
      diamonds.splice(i,1); flags['diam'+dm.id]=true;
      res.gold=Math.min(999,res.gold+15);
      sfx.chest(); addFloat(dm.x,dm.y-18,'+15 gold','#bfeffc');
      puff(dm.x,dm.y,'#bfeffc',6);
    }
  }
  // colored keys (Montezuma style)
  for(let i=keyItems.length-1;i>=0;i--){
    const kk=keyItems[i];
    if(Math.hypot(PL.x-kk.x,PL.y-kk.y)<22){
      keyItems.splice(i,1); flags['kt_'+kk.kcol]=true; keysHeld.push(kk.kcol);
      sfx.chest(); addFloat(kk.x,kk.y-20,kk.kcol.toUpperCase()+' KEY!',KEYCOL[kk.kcol]);
      puff(kk.x,kk.y,KEYCOL[kk.kcol],8);
    }
  }
  // locked doors swing open at a touch — if you carry the key
  for(let i=doors.length-1;i>=0;i--){
    const dr=doors[i];
    if(Math.hypot(PL.x-dr.x,PL.y-dr.y)<32){
      const ki=keysHeld.indexOf(dr.kcol);
      if(ki>=0){
        keysHeld.splice(ki,1); flags['door_'+dr.kcol]=true;
        solid.delete(key(dr.c,dr.r)); doors.splice(i,1);
        sfx.build(); addFloat(dr.x,dr.y-28,'UNLOCKED!',KEYCOL[dr.kcol]);
        puff(dr.x,dr.y-10,KEYCOL[dr.kcol],10);
        saveGame();
      } else if(frame%90===0){
        addFloat(dr.x,dr.y-28,'needs the '+dr.kcol+' key','#ffb0b0');
        /* the gold door says WHERE (Scott, 2026-08-21): its key is an arcade
           prize, and the arcade door stands on this very screen */
        if(dr.kcol==='gold') toast('THE GOLD KEY IS EARNED IN THE FIREBALL MAZE \u2014 through the arcade door in this camp.');
      }
    }
  }
  // heart containers
  for(let i=hearts.length-1;i>=0;i--){
    const h=hearts[i];
    if(Math.hypot(PL.x-h.x,PL.y-h.y)<20){
      hearts.splice(i,1); flags['heart'+h.id]=true;
      PL.maxhp+=2; PL.hp=PL.maxhp; sfx.heart();
      addFloat(h.x,h.y-20,'MAX HEALTH UP!','#ff6a6a');
    }
  }

  if(curScr===SLU_SCR) sluTick();

  // transitions
  const col=curScr%GRIDW, row=Math.floor(curScr/GRIDW);
  let moved=false;
  /* The Town Square's east edge is an ORDINARY edge again (Scott,
     2026-08-15). What used to stop you here — the mined ford's minesweeper
     — now lives inside the Riverlands as THE SLUICE GATES, a thing you
     walk up to rather than a menu that opens on top of you. */
  /* THE WOODS RUN is OPT-IN now (Scott, 2026-08-16). It used to fire
     automatically at both of Wolf Woods' doors, which made the top-left cell
     of the map a compulsory interruption between two places instead of a
     place — and made the screen behind it unreachable. Softening the run in
     response to "demandingly tricky" only turned the toll into a corridor you
     still could not decline. So the intercepts are gone: the doors are
     ordinary doors, screen 0 is THE WOLF ROUNDS, and the run is a signpost on
     its bank (kind:'runhead') that you walk up to and choose. Opting in is
     what buys the run the right to be difficult again. */
  if(PL.x>RW-2 && col<GRIDW-1){ loadScreen(curScr+1); PL.x=6; moved=true; }
  else if(PL.x<2 && col>0){ loadScreen(curScr-1); PL.x=RW-6; moved=true; }
  else if(PL.y>RH-2 && row<GRIDH-1){ loadScreen(curScr+GRIDW); PL.y=8; moved=true; }
  else if(PL.y<8 && row>0){ loadScreen(curScr-GRIDW); PL.y=RH-8; moved=true; }
  PL.x=Math.max(2,Math.min(RW-2,PL.x)); PL.y=Math.max(6,Math.min(RH-2,PL.y));
  if(moved){ unstick(PL); PL.iframes=Math.max(PL.iframes,45); dialog=null; saveGame(); }

  // NPC proximity dialog
  dialog=null;
  for(const n of npcs){
    if(Math.hypot(PL.x-n.x,PL.y-n.y)<52) dialog=npcDialog(n.who, n);
  }
}

/* sword reach, squared. Nearest-node-wins makes the exact radius forgiving —
   what matters is that ONE node is chosen and it is the closest one. */
const REACH2=30*30;
/* YOU CUT WHAT YOU FACE.
   Cameron, beta 2026-08-15: "Village Fields hitboxes make invisible walls that
   destroy corn nowhere near you when hit." That fix — nearest node wins, not
   first-in-map-order — was right and was not enough. Scott, 2026-08-16: "the
   crops that need to be cut still don't match up with the actual location the
   player needs to be while hacking at them... you have to hack at the empty
   space which actually cuts the crops above/to the right of the player."
   The remaining fault is that a 30px reach radius on a 32px grid is not a
   TILE. The player's y inside his own tile ranges over 22px (box h=10 in a 32
   cell), so standing high in a tile puts the row ABOVE nearer to the swing
   point than the row he is facing into — and nearest-wins then does exactly
   the wrong thing, confidently. Measured across every legal standing position
   and facing in Village Fields: 43.6% of swings felled the wrong tile, and the
   single commonest error was the reported one, off by (0,-1) facing left or
   right, 1,428 of 3,374.
   No radius fixes that, because at 30px on a 32px grid the ambiguity is real.
   So the swing targets a TILE: the one you are facing, from your tile and your
   facing, with one concession for standing on a boundary line. */
function facedTile(){
  const fxn=PL.fxn(), fyn=PL.fyn();
  const horiz=Math.abs(fxn)>Math.abs(fyn);
  return { c:Math.floor(PL.x/T)+(horiz? (fxn<0?-1:1):0),
           r:Math.floor(PL.y/T)+(horiz? 0:(fyn<0?-1:1)),
           horiz };
}
function nodeAt(c,r){
  for(const nd of nodes) if(nd.c===c && nd.r===r) return nd;
  return null;
}
function swingNode(){
  const f=facedTile();
  let nd=nodeAt(f.c, f.r);
  if(nd) return nd;
  /* the one concession: within 8px of a tile line, which row or column you are
     "in" is genuinely ambiguous to the player too, so the faced tile on the
     other side of that line counts as well. Never a tile behind or beside. */
  const oy=PL.y-Math.floor(PL.y/T)*T, ox=PL.x-Math.floor(PL.x/T)*T;
  if(f.horiz){
    if(oy<8) nd=nodeAt(f.c, f.r-1);
    if(!nd && oy>T-8) nd=nodeAt(f.c, f.r+1);
  } else {
    if(ox<8) nd=nodeAt(f.c-1, f.r);
    if(!nd && ox>T-8) nd=nodeAt(f.c+1, f.r);
  }
  return nd;
}
function applySwing(){
  const cx=PL.x+PL.fxn()*24, cy=PL.y-8+PL.fyn()*24;   // enemies are not on tiles
  {
    const nd=swingNode();
    if(nd){
      const nx=nd.c*T+16, ny=nd.r*T+16;
      nd.hp--; nd.shake=8;
      if(nd.kind==='tree'){ sfx.chop(); puff(nx,ny-10,'#4a7c2e',4); }
      else if(nd.kind==='corn'){ sfx.chop(); puff(nx,ny-12,'#9cc46a',5); }
      else { sfx.mine(); puff(nx,ny-6,'#9a938a',4); }
      if(nd.hp<=0){
        // corn regrows in ~15s (live, see updateFields); trees/rocks on re-entry
        chopped.set(nd.id, playFrames + (nd.kind==='tree'?2700:nd.kind==='corn'?900:3600));
        solid.delete(key(nd.c,nd.r));
        nodes.splice(nodes.indexOf(nd),1);
        if(nd.kind!=='corn'){
          const type=nd.kind==='tree'?'wood':'stone';
          for(let i=0;i<3;i++) dropPickup(nx,ny,type);
          addFloat(nx,ny-24,'+3 '+type.toUpperCase(), type==='wood'?'#e8b878':'#e0dbd0');
        }
      }
      return; // one node per swing
    }
  }
  // enemies
  for(const f of foes){
    if(Math.abs(f.x-cx)<32 && Math.abs(f.y-cy)<32){
      if(f.rail){
        /* the rounds do not break — a hit buys ground, not a corpse */
        f.flash=8; f.hurt=10; sfx.hit();
        f.rail.at -= f.rail.dir*36/RAILS[f.rail.ring].per;
        f.rail.stun=45;
        if(!flags.sawRailWolf){
          flags.sawRailWolf=true;
          toast('It gives ground and keeps its place in the round. These ones never die — they can only be pushed.');
        }
        continue;
      }
      f.hp--; f.flash=8; f.hurt=10; sfx.hit();
      const kn=Math.hypot(f.x-PL.x,f.y-PL.y)||1;
      f.kbx=(f.x-PL.x)/kn*5; f.kby=(f.y-PL.y)/kn*5;
      if(f.hp<=0) killFoe(f);
    }
  }
}
/* VILLAGE FIELDS ambience — the corn regrows while you watch (unless someone
   is standing in the row), the ducks patrol their trough, and the radioactive
   tomato waits behind the east stalks for anyone curious enough to chop in. */
function updateFields(){
  if(curScr!==9) return;
  if(playFrames%30===0){
    for(const [id,resp] of chopped){
      if(playFrames<resp || !id.startsWith('9:')) continue;
      const parts=id.split(':'); const c=+parts[1], r=+parts[2];
      if(SCREENS[9].map[r][c]!=='C') continue;
      const bx=c*T+16, by=r*T+16;
      if(Math.abs(PL.x-bx)<28 && Math.abs(PL.y-by)<28) continue;
      if(foes.some(f=>Math.abs(f.x-bx)<26 && Math.abs(f.y-by)<26)) continue;
      if(ducks.some(d=>Math.abs(d.x-bx)<24 && Math.abs(d.y-by)<24)) continue;
      chopped.delete(id);
      nodes.push({kind:'corn', id, c, r, hp:1, shake:0});
      solid.add(key(c,r));
      puff(bx, by-6, '#9cc46a', 5);
    }
  }
  for(let i=decos.length-1;i>=0;i--){
    const d=decos[i];
    if(d.kind!=='radtomato') continue;
    if(Math.hypot(PL.x-(d.x+16), PL.y-(d.y+20))<20){
      decos.splice(i,1); flags.radtomato=true;
      PL.hp=PL.maxhp;
      puff(d.x+16, d.y+16, '#8aff6a', 10); sfx.chest();
      addFloat(d.x+16, d.y-8, 'FULL HEALTH', '#8aff6a');
      toast('You eat the radioactive tomato. Full health. There is a faint hum now. It is probably nothing.');
      saveGame();
    }
  }
  /* ducklings imprint on proximity and trail you along your own breadcrumb
     path (so they only ever walk ground you walked). A boar getting close, or
     losing you past 150px — regrown corn between you counts — spooks one into
     flying back to its lost spot. Reaching mom is permanent (saved flag). */
  playerTrail.unshift({x:PL.x, y:PL.y});
  if(playerTrail.length>240) playerTrail.length=240;
  let fi=0;
  for(const dk of ducks){
    if(dk.kind==='mom' || dk.st==='home'){
      const rad = dk.kind==='mom'?68:40;
      if(--dk.wt<=0){ dk.wt=90+Math.random()*160; dk.tx=dk.hx+(Math.random()*rad-rad/2); dk.ty=dk.hy+(Math.random()*26-8); }
      const dx=dk.tx-dk.x, dy=dk.ty-dk.y, dn=Math.hypot(dx,dy);
      if(dn>2){ dk.x+=dx/dn*0.35; dk.y+=dy/dn*0.35; dk.fx=dx<0?-1:1; dk.step+=0.2; }
      if(dk.quackT>0) dk.quackT--;
      else if(dk.kind==='mom' && Math.hypot(PL.x-dk.x,PL.y-dk.y)<40){
        const lost=ducks.filter(d=>d.kind==='kid'&&d.st!=='home').length;
        addFloat(dk.x, dk.y-16, lost? 'QUACK! ('+lost+' missing)' : 'quack.', '#f0e6c8');
        dk.quackT=300+Math.random()*200;
      }
    }
    else if(dk.st==='lost'){
      if(--dk.wt<=0){ dk.wt=80+Math.random()*140; dk.tx=dk.lx+(Math.random()*24-12); dk.ty=dk.ly+(Math.random()*16-8); }
      const dx=dk.tx-dk.x, dy=dk.ty-dk.y, dn=Math.hypot(dx,dy);
      if(dn>2){ dk.x+=dx/dn*0.3; dk.y+=dy/dn*0.3; dk.fx=dx<0?-1:1; dk.step+=0.18; }
      if(Math.hypot(PL.x-dk.x,PL.y-dk.y)<26){
        dk.st='follow'; addFloat(dk.x, dk.y-14, 'peep!', '#ffe9a0'); sfx.pick();
      }
    }
    else if(dk.st==='follow'){
      dk.fi=fi++;
      const tgt=playerTrail[Math.min(playerTrail.length-1, 16+dk.fi*13)];
      const dx=tgt.x-dk.x, dy=tgt.y-dk.y, dn=Math.hypot(dx,dy);
      if(dn>3){ const sp=Math.min(2.6, 0.9+dn*0.04); dk.x+=dx/dn*sp; dk.y+=dy/dn*sp; dk.fx=dx<0?-1:1; dk.step+=0.3; }
      /* Scott, 2026-08-16: "one duckling trapped up north of fence where I cant
         do anything about it." Duckling 0 is found at c14r1 — NORTH of the corn
         wall at rows 3-4, which spans the whole field — and home is the trough
         at c12r8, south of it. A scare used to fly it all the way back to where
         it was FOUND, so every panic undid the entire escort through the corn.
         Worse, a boar is posted at c12r9, ONE TILE from the trough: the scare
         radius fired every single time you got the duckling home, and nothing
         in the game said the boars had to go first. That is not a puzzle, it is
         a wall with no sign on it.
         Two fixes. A duckling within sight of its mother does not panic — it is
         home, and that is the whole point of a mother. And a scare costs a
         MOMENT, not the journey: it bolts a little way clear and waits where it
         lands, the same rule the Woods Run got on 2026-08-15. */
      const mom=ducks[0];
      const nearMum=Math.hypot(mom.x-dk.x, mom.y-dk.y)<90;
      const boar=nearMum? null : foes.find(f=>f.t==='boar' && Math.hypot(f.x-dk.x,f.y-dk.y)<30);
      if(boar || Math.hypot(PL.x-dk.x,PL.y-dk.y)>190){
        const th=boar||PL;
        const ax=dk.x-th.x, ay=dk.y-th.y, an=Math.hypot(ax,ay)||1;
        const fxp=Math.max(20,Math.min(RW-20, dk.x+ax/an*46));
        const fyp=Math.max(20,Math.min(RH-20, dk.y+ay/an*46));
        const ok=walkable(fxp,fyp);
        dk.lx=ok?fxp:dk.x; dk.ly=ok?fyp:dk.y;
        dk.st='fly'; addFloat(dk.x, dk.y-14, 'PEEP!!', '#ffb060');
      } else {
        if(Math.hypot(mom.x-dk.x, mom.y-dk.y)<34){
          dk.st='home'; flags['duckhome'+dk.i]=true;
          dk.hx=mom.hx; dk.hy=mom.hy+6; dk.wt=1;
          addFloat(dk.x, dk.y-14, 'peep peep!', '#ffe9a0'); puff(dk.x,dk.y,'#ffe9a0',5);
          if([0,1,2].every(n=>flags['duckhome'+n]) && !flags.ducksHome){
            flags.ducksHome=true;
            PL.maxhp+=2; PL.hp=PL.maxhp;   // hp is in HALF-hearts — +2 = one heart
            sfx.win(); addFloat(mom.x, mom.y-24, '+1 MAX HEART', '#ff6a6a');
            toast('All three ducklings home. The mother duck looks at you the way nobody has in years. +1 max heart.');
          }
          saveGame();
        }
      }
    }
    else if(dk.st==='fly'){
      const dx=dk.lx-dk.x, dy=dk.ly-dk.y, dn=Math.hypot(dx,dy);
      if(dn<4){ dk.st='lost'; dk.wt=1; }
      else { dk.x+=dx/dn*3; dk.y+=dy/dn*3; dk.fx=dx<0?-1:1; dk.step+=0.6; }
    }
  }
}

/* TOWN HALL ambience — every so often a half-size townsperson comes out of
   the hall door, either strolls the plaza path or sits on a bench a while,
   then heads back inside. Never more than two out at once. */
function updateCitizens(){
  if(curScr!==5){ citizens.length=0; citizenT=Math.min(citizenT,240); return; }
  const DOOR={x:8*T+16, y:3*T+8};
  if(--citizenT<=0){
    citizenT=700+Math.floor(Math.random()*900);
    if(citizens.length<2){
      const hv=Math.random();
      const c={x:DOOR.x, y:DOOR.y, fx:1, step:0, tone:Math.floor(Math.random()*3),
               sitT:0, sit:null, wp:[]};
      if(hv<0.4){                          // a stroll down the plaza and back
        c.wp=[{x:10*T+16,y:4*T+16},{x:10*T+16,y:7*T+16},{x:10*T+16,y:4*T+16},{x:DOOR.x,y:DOOR.y}];
      } else {                             // out to a bench for a sit
        const b= hv<0.7? {x:8*T+16,y:4*T+22} : {x:12*T+16,y:4*T+22};
        c.sit={x:b.x+(citizens.length? 7:-7), y:b.y};
        c.wp=[{x:c.sit.x, y:c.sit.y}];
      }
      citizens.push(c);
    }
  }
  for(let i=citizens.length-1;i>=0;i--){
    const c=citizens[i];
    if(c.sitT>0){
      if(--c.sitT===0){ c.sit=null; c.wp=[{x:DOOR.x,y:DOOR.y}]; }
      continue;
    }
    const t=c.wp[0];
    if(!t){
      if(c.sit){ c.sitT=600+Math.floor(Math.random()*700); continue; }
      citizens.splice(i,1); continue;      // back at the door — goes inside
    }
    const dx=t.x-c.x, dy=t.y-c.y, dn=Math.hypot(dx,dy);
    if(dn<2.5) c.wp.shift();
    else { c.x+=dx/dn*0.5; c.y+=dy/dn*0.5; if(Math.abs(dx)>0.8) c.fx=dx<0?-1:1; c.step+=0.22; }
  }
}

PL.fxn=function(){ const n=Math.hypot(PL.fx,PL.fy)||1; return PL.fx/n; };
PL.fyn=function(){ const n=Math.hypot(PL.fx,PL.fy)||1; return PL.fy/n; };

function killFoe(f){
  foes.splice(foes.indexOf(f),1);
  killed.add(f.id); slain++;
  puff(f.x,f.y-8,'#ddd',8);
  if(f.t==='bandit'){ const n=3+Math.floor(Math.random()*3); for(let i=0;i<n;i++) dropPickup(f.x,f.y,'gold'); }
  else if(Math.random()<0.3) dropPickup(f.x,f.y,'heart');
  if(f.t==='boss'){
    sfx.win(); bossDead=playFrames;
    for(let i=0;i<12;i++) dropPickup(f.x,f.y,'gold');
    addFloat(f.x,f.y-30,'THE WARLORD FALLS!','#ffd23e');
    saveGame();
  }
  // task jingles
  if(f.t==='boar' && curScr===9 && !foes.some(x=>x.t==='boar')){ sfx.task(); toast('Fields safe! Talk to the farmer.'); }
}

function dropPickup(x,y,type){
  const a=Math.random()*6.28;
  pickups.push({x,y,type,vx:Math.cos(a)*2.5,vy:Math.sin(a)*2.5,settle:20});
}

/* ---------------- INTERACT (Space priority) ---------------- */
function interact(){
  const ix=PL.x+PL.fxn()*18, iy=PL.y+PL.fyn()*18;
  if(curScr===SLU_SCR){
    const gi=sluGateNear();
    if(gi>=0){ sluPull(gi); return true; }
  }
  // cave mouth + arcade entrance
  for(const d of decos){
    if(d.kind==='cavemouth' && window.CaveLayer && Math.hypot(PL.x-(d.x+16),PL.y-(d.y+24))<52){
      startCaveTrans('in'); return true;
    }
    if(d.kind==='trail' && Math.hypot(PL.x-(d.x+16),PL.y-(d.y+24))<48){
      if(d.gate && !flags[d.gate]){ toast('The way is sealed — push the boulders onto their sockets first.'); sfx.denied(); return true; }
      startWarp(()=>{ loadScreen(d.to); PL.x=d.tx*T+16; PL.y=d.ty*T+24; unstick(PL); PL.iframes=45; });
      return true;
    }
    if(d.kind==='runhead' && Math.hypot(PL.x-(d.x+16),PL.y-(d.y+24))<50){
      openWoodsRun(d.side); return true;
    }
    if(d.kind==='arcadedoor' && Math.hypot(PL.x-(d.x+16),PL.y-(d.y+24))<52){
      startWarp(()=>{
        arcadeFrom={scr:curScr, x:PL.x, y:PL.y};
        loadScreen(12); PL.x=10*T+16; PL.y=9*T+20; unstick(PL); PL.iframes=45;
      });
      return true;
    }
    if(d.kind==='rosedoor' && window.RoseLayer && Math.hypot(PL.x-(d.x+16),PL.y-(d.y+24))<48){
      startRoseTrans('in'); return true;
    }
    if(d.kind==='riverraft' && window.RiverLayer && Math.hypot(PL.x-(d.x+8),PL.y-(d.y+24))<50){
      startRiverTrans('in'); return true;
    }
    if(d.kind==='well' && curScr===5 && Math.hypot(PL.x-(d.x+16),PL.y-(d.y+24))<48){
      wellOpen=true; wellSel=0; sfx.task && sfx.task(); return true;
    }
    if(d.kind==='gratbed'){
      /* a nearby FLOWER wins over the sign: SPACE re-reads its gratitude */
      const gs=flags.garden||[];
      for(let i=0;i<gs.length;i++){
        const pos=flowerPos(i, flowerSpec(gs[i]));
        if(Math.hypot(PL.x-pos.x, PL.y-pos.y)<16){
          toast('"'+gs[i].m+'"'); sfx.pick(); return true;
        }
      }
      const bx0=GARDEN.c*T-12, bx1=(GARDEN.c+GARDEN.cols)*T+12;
      const by0=GARDEN.r*T-16, by1=(GARDEN.r+GARDEN.rows)*T+16;
      if(PL.x>bx0 && PL.x<bx1 && PL.y>by0 && PL.y<by1){
        if(gs.length>=GARDEN.cap){ toast('The garden is full of thanks. It remembers every one — walk among them with SPACE.'); sfx.task&&sfx.task(); }
        else openGarden();
        return true;
      }
    }
    if(d.kind==='wellrope' && Math.hypot(PL.x-(d.x+16),PL.y-(d.y+24))<48){
      startWarp(()=>{ loadScreen(5); PL.x=6*T+16; PL.y=8*T+20; unstick(PL); PL.iframes=45; });
      return true;
    }
    if(d.kind==='threaddoor' && Math.hypot(PL.x-(d.x+16),PL.y-(d.y+40))<52){
      toast('The door is older than the well. It is warm to the touch, and it hums, faintly. It does not open.');
      sfx.task && sfx.task(); return true;
    }
    if(d.kind==='statue' && Math.hypot(PL.x-(d.x+16),PL.y-(d.y+24))<48){

      const known=cyKnownSet();

    if(d.kind==='digsite' && Math.hypot(PL.x-(d.x+32),PL.y-(d.y+24))<62){

      }

      const lay=DIG_LAYERS[L];

      if(lay.pay) lay.pay(d.x+32, d.y+40);
      if(L===4){ PL.hp=PL.maxhp; addFloat(d.x+32, d.y-14, 'you sit with it a while — fully healed', '#bfd6ff'); }

    }
    if(d.kind==='trellis' && Math.hypot(PL.x-(d.x+16),PL.y-(d.y+24))<52){
      if(!flags.beansAt){
        flags.beansAt=playFrames;
        toast('Five beans, five little holes. Now the slow part.');
        return true;
      }
      const el=playFrames-flags.beansAt;
      if(el>=BEAN_MATURE){
        const first=!flags.beanHarvests;
        flags.beanHarvests=(flags.beanHarvests||0)+1;
        delete flags.beansAt;
        PL.hp=PL.maxhp;
        if(first){ PL.maxhp+=1; PL.hp=PL.maxhp; addFloat(PL.x,PL.y-34,'MAX HEALTH UP!','#ff6a6a'); sfx.heart(); }
        else sfx.chest();
        addFloat(d.x+16,d.y-20,'bean stew — fully healed','#9fdc7f');

        puff(d.x+16,d.y+10,'#9fdc7f',10);
        saveGame();
        return true;
      }
      toast(el<3600? 'The beans are settling in. Patience.' : 'Not ready. Good things climb slowly.');
      sfx.pick();
      return true;
    }
    if(d.kind==='tomato' && Math.hypot(PL.x-(d.x+16),PL.y-(d.y+24))<48){
      const tel=playFrames-(flags.tomatoAt||playFrames);
      const ripeAt=TOMATO_MATURE+(flags.tomatoHarvests||0)*TOMATO_REGROW;
      if(tel>=ripeAt){
        flags.tomatoHarvests=(flags.tomatoHarvests||0)+1;

      } else {
        toast(tel<TOMATO_MATURE*0.3? 'The seedling is thinking about it.' : 'Green fruit yet. The sun knows what it\'s doing.');
        sfx.pick();
      }
      return true;
    }
    if(d.kind==='cropwand' && Math.hypot(PL.x-(d.x+16),PL.y-(d.y+24))<48){
      cropWandActivate();
      return true;
    }
    if(d.kind==='board' && Math.hypot(PL.x-(d.x+16),PL.y-(d.y+24))<48){
      const notes=[
        'NOTICE: the Arcade keeper pays gold for deeds, not promises.',
        'LOST: one rose-colored key. If found, the bandits stole it first.',
        'The miller wants wood. The miller ALWAYS wants wood.',
        'Heard in the tavern: a door in the north woods that was not there before.',
        'CROPS grow slow on purpose. Complaints to the sun.',
        'The ferryman of the drowned Archive accepts full sentences only.'
      ];
      toast(notes[Math.floor(playFrames/3600)%notes.length]);
      sfx.pick();
      return true;
    }
    if(d.kind==='teleport' && Math.hypot(PL.x-(d.x+16),PL.y-(d.y+24))<48){
      if(!(bossDead>0)){ toast('The waystone is dark — it will not wake until the Warlord falls.'); sfx.denied(); return true; }
      startWarp(()=>{ PL.x=d.tx*T+16; PL.y=d.ty*T+24; unstick(PL); PL.iframes=30; });
      return true;
    }
  }
  // arcade cabinets
  for(const p of portals){
    if(Math.hypot(PL.x-p.x,PL.y-p.y)<42){
      const def=PORTAL_DEF[p.key];
      if(p.key==='exit'){
        startWarp(()=>{
          const back=arcadeFrom||{scr:11, x:16*T+16, y:2*T+8};
          loadScreen(back.scr); PL.x=back.x; PL.y=back.y; unstick(PL); PL.iframes=45;
        });
        return true;
      }
      if(p.key==='remnants'){
        startWarp(()=>{ loadScreen(17); PL.x=10*T+16; PL.y=9*T+20; unstick(PL); PL.iframes=45; });
        return true;
      }
      if(p.key==='arcback'){
        startWarp(()=>{ loadScreen(12); PL.x=16*T+16; PL.y=7*T+20; unstick(PL); PL.iframes=45; });
        return true;
      }
      if(p.key==='terminal'){
        const left=archiveLeft();
        if(left.length){
          addFloat(p.x,p.y-58,left.length+' golden ring'+(left.length>1?'s still seal':' still seals')+' him','#ffd76e');
          toast('Break the rings: '+left.join(' · '));
          sfx.denied();
        } else if(window.ArchiveLayer){
          startArchiveTrans('in'); return true;
        } else {
          addFloat(p.x,p.y-58,'ADVENTURE! OPENS...','#7fdb7f');
          toast('The keeper is free. His story machine arrives soon.');
          sfx.task();
        }
        return true;
      }
      if(!def.ok()){ addFloat(p.x,p.y-38,'LOCKED: '+def.req,'#ffb0b0'); sfx.denied(); return true; }
      if(p.key==='shop'){
        shopOpen=true; shopSel=0; sfx.task && sfx.task();
        return true;
      }
      if(p.key==='caverns' && window.CaveLayer){ startCaveTrans('in'); return true; }
      if(p.key==='fireball' && window.MazeLayer){ startMazeTrans('in'); return true; }
      if(p.key==='sentinel' && window.SentinelLayer){ startSentinelTrans('in'); return true; }
      if(p.key==='squirrel' && window.SquirrelLayer){ startSquirrelTrans('in'); return true; }
      if(p.key==='robotron' && window.RobotronLayer){ startRobotronTrans('in'); return true; }
      if(p.key==='chess' && window.ChessLayer){ startChessTrans('in'); return true; }
      if(p.key==='breakout' && window.BreakoutLayer){ startBreakoutTrans('in'); return true; }
      if(p.key==='hazy' && window.HazyLayer){ startHazyTrans('in'); return true; }
      if(p.key==='moonwalk' && window.MoonwalkLayer){ startMoonwalkTrans('in'); return true; }
      if(p.key==='pacsphere' && window.PacsphereLayer){ startPacsphereTrans('in'); return true; }
      if(p.key==='contraption' && window.ContraptionLayer){ startContraptionTrans('in'); return true; }
      if(p.key==='jungle' && window.JungleLayer){ startLayerTrans('in', window.JungleLayer, 'jungle', 'play'); return true; }
      if(p.key==='quarry' && window.QuarryLayer){ startQuarryTrans('in'); return true; }
      if(p.key==='workings' && window.WorkingsLayer){ startWorkingsTrans('in'); return true; }
      if(p.key==='highroads' && window.HighMazeLayer){ startHighTrans('in'); return true; }
      addFloat(p.x,p.y-38,'UNLOCKED — cabinet arriving soon!','#ffe9a0'); sfx.task();
      return true;
    }
  }
  // chest
  for(const c of chests){
    if(!c.open && Math.hypot(c.x-ix,c.y-iy)<30){
      if(c.lock==='wolves' && foes.some(f=>f.t==='wolf')){ addFloat(c.x,c.y-24,'sealed while wolves prowl...','#aab'); sfx.denied(); return true; }
      c.open=true; openedChests.add(c.id);
      for(let i=0;i<c.gold;i++) dropPickup(c.x,c.y,'gold');
      sfx.chest(); return true;
    }
  }
  // build spot
  for(const s of spots){
    if(built.has(s.key)) continue;
    if(Math.hypot(s.x-PL.x,s.y-PL.y)<46){
      const b=BUILDS[s.key];
      if(res.wood>=(b.wood||0) && res.stone>=(b.stone||0) && res.gold>=(b.gold||0)){
        res.wood-=b.wood||0; res.stone-=b.stone||0; res.gold-=b.gold||0;
        built.add(s.key); sfx.build(); toast(b.done);
        puff(s.x,s.y-10,'#ffd23e',10);
        if(s.key==='gate'){ for(const c of [9,10,11]) solid.delete(key(c,3)); }
        saveGame();
      } else {
        const need=[];
        if((b.wood||0)>res.wood) need.push((b.wood-res.wood)+' wood');
        if((b.stone||0)>res.stone) need.push((b.stone-res.stone)+' stone');
        if((b.gold||0)>res.gold) need.push((b.gold-res.gold)+' gold');
        addFloat(s.x,s.y-30,'need '+need.join(', '),'#ffb0b0'); sfx.denied();
      }
      return true;
    }
  }
  // boat travel
  if(curScr===4 && built.has('boat')){
    const onIsland = PL.x>4*T && PL.x<7*T+16 && PL.y>3*T+16 && PL.y<6*T+16;
    const nearBoat = Math.hypot(PL.x-(11.5*T),PL.y-(6.5*T))<52;
    if(nearBoat && !onIsland){ PL.x=5.5*T; PL.y=5.5*T; unstick(PL); sfx.pick(); toast('You row to the island.'); return true; }
    if(onIsland){ PL.x=12*T+16; PL.y=6*T+24; unstick(PL); sfx.pick(); toast('Back ashore.'); return true; }
  }
  // farmer reward
  /* Cameron, beta 2026-08-15: "Going near Brit prompts you to sit with her
     using spacebar, yet you only attempt (and fail) to murder her upon
     pressing it." Dead right — interact() had no yogi branch at all, so SPACE
     fell straight through to the sword swing while the label promised a seat.
     A prompt the game does not honour is worse than no prompt. */
  /* OLD CINDER reads the old letters — one glyph a visit, his own cadence */
  for(const n of npcs){
    if(n.who==='surr' && n.i===3 && Math.hypot(PL.x-n.x,PL.y-n.y)<52){
      const k=flags.cyKnown||0;
      if(k>=CY_TEACH.length){
        toast('OLD CINDER: "That is all five I know. The reading is yours now — the tallies give the order."');
      } else if(cinderTaught){
        toast('OLD CINDER: "One a visit, friend. The old letters tire me worse than the digging."');
      } else {
        cinderTaught=true; flags.cyKnown=k+1;
        const L=CY_TEACH[k];
        toast('OLD CINDER scratches a shape in the spoil — '+CY_DESC[L]+'. "That one is '+L+'. Dug past enough of them to know. The stone soldiers west of the bridge wear the same cutting."');
        saveGame();
      }
      sfx.task&&sfx.task(); return true;
    }
  }
  for(const n of npcs){
    if(n.who==='yogi' && Math.hypot(PL.x-n.x,PL.y-n.y)<56){
      sitWithBrit(n);
      return true;
    }
  }
  for(const n of npcs){
    if(n.who==='farmer' && !flags.farmReward && Math.hypot(PL.x-n.x,PL.y-n.y)<52 && !foes.some(f=>f.t==='boar')){
      flags.farmReward=true;
      for(let i=0;i<8;i++) dropPickup(n.x,n.y,'gold');
      sfx.task(); return true;
    }
  }
  return false;
}

/* Sitting with Brit. She is the game's calm, so this pays in calm and not in
   loot: the halo swells, she says something chosen for you, and you get your
   breath back. Rate-limited so it is a rest, not a health fountain. */
let britSit=0;
function sitWithBrit(n){
  britSit=150;
  PL.walkT=0; resetGait();
  const line=npcDialog('yogi');
  toast(line.text);
  sfx.task && sfx.task();
  puff(n.x, n.y-18, '#bfd6ff', 8);
  const cool = playFrames - (flags.britSatAt||-99999);
  if(PL.hp<PL.maxhp && cool>1800){          // once every ~30s of play
    flags.britSatAt=playFrames;
    PL.hp=Math.min(PL.maxhp, PL.hp+1);
    addFloat(PL.x, PL.y-34, 'you sit a while', '#bfd6ff');
    sfx.heart && sfx.heart();
  } else {
    addFloat(PL.x, PL.y-34, 'you sit a while', '#bfd6ff');
  }
  saveGame();
}

/* ---------------- NPC DIALOG ---------------- */
/* THE SURRENDERED — five of the Warlord's men, named, disarmed, working. Each
   holds one piece of the only story the game ever tells about WHY: hunger as
   recruitment, the fortress he would not sleep in, coins from nowhere, the dig
   he ordered and then stopped, the mason's line about holding something down.
   A player who talks to all five can assemble the whole account; none of them
   has it alone. Lines rotate on the same ~15s clock as the Lamplighter. */
/* THE SURRENDERED (rewritten 2026-08-20 — Scott: "npcs in warlord camp need
   more common simpler things to say - mystery and hints are fine but they sound
   like obscure ai writing").

   The old set was 15 variations on one rhetorical move: a flat statement
   followed by an inverted twist. "Canvas comes down honest." "Stacks the same
   as a stolen one." Nobody talks like that, and a whole camp doing it reads as
   a machine that learned one trick.

   These are men who lost, doing chores. Most of what they say is weather,
   backs, food and jokes. The HINTS are still here — the coins, the warm stone,
   the mason who knew what the fortress was for, the Lamplighter pointer — but
   one per speaker, said plainly, the way you'd actually mention an odd thing
   while stacking wood. They also now line up with the dig layers and the well
   door instead of running as a separate mystery. Keep lines under ~85 chars:
   the bubble wraps by measured width and grows, but short reads better. */
const SURR_LINES=[
  {name:'BRACKEN', lines:[
    "Morning. Mind the tent pegs \u2014 they're everywhere and they don't move.",
    "He burned the mill first. Starve a valley and it follows whoever has the pot.",
    "My back is gone. Never thought I'd miss standing about doing nothing.",
    "Taking the tents down is better work than putting them up ever was."]},
  {name:'MIDGE', lines:[
    "Stew's thin, but there's plenty of it. Sit down if you want some.",
    "We keep a fire now. He never let us \u2014 said it drew eyes. Never said whose.",
    "I still flinch when anyone shouts. Give it a year, I expect.",
    "We found crates of socks in his tent. Hundreds. Nobody can explain it."]},
  {name:'FEN', lines:[
    "This wood is for the town. First pile I've stacked that was mine to give.",
    "He paid us in old coins. Green ones, faces nobody knew. Whole chests of them.",
    "Mind that sword near the guy ropes. I've cut through two already today.",
    "Rain's coming. My knee says so, and my knee has never once been wrong."]},
  {name:'OLD CINDER', lines:[
    "One layer a visit, friend. My back sets the pace, not you.",
    "We dug here for years. He never wanted treasure. He wanted the floor.",
    "There's warm stone down at the bottom. Warm. In ground like this.",
    "There's tea if you want it. I'll warn you now, it's terrible."]},
  {name:'WRY', lines:[
    "He was a mason before all this. Said the walls were built to hold something down.",
    "Same hole we dug for him, better reasons. That's the whole job.",

/* THE DIG — six layers, oldest last. Rewards are modest on purpose: the find
   is the lore, the loot is a courtesy. Layer 5 pays in feeling, not goods. */
const DIG_LAYERS=[

   pay:(x,y)=>{ for(let i=0;i<10;i++) dropPickup(x,y,'gold'); }},
  {t:'Charcoal, a hand deep, wall to wall. The whole hill burned once — all at once — long before any story the valley still tells.', pay:null},
  {t:'A carved toy soldier, small as a thumb. This was a town before it was a fortress. Somebody grew up here.', pay:null},
  {t:'The spades ring — and it is not bedrock. A worked slab, warm as a kettle, humming one low note. The diggers set their shovels down and will not take them up again.', pay:null}

function npcDialog(who,n){
  if(who==='surr'){
    const S=SURR_LINES[(n&&n.i)||0]||SURR_LINES[0];
    return {name:S.name, text:S.lines[Math.floor(playFrames/900)%S.lines.length]};
  }
  if(who==='elder'){
    if(!built.has('mill')) return {name:'ELDER', text:"The Warlord's bandits wrecked our valley. Rebuild the MILL first — 8 wood, 4 stone. Swing your sword at trees and rocks!"};
    if(!built.has('bridge')) return {name:'ELDER', text:"Bless you! Now rebuild the BRIDGE in the Riverlands east of here (12 wood) — it leads to the Warlord's camp."};
    if(!built.has('gate')) return {name:'ELDER', text:"The Warlord hides in the Dark Fortress, south-east. Clear the rubble at his gate with 8 stone... and end this."};
    if(!bossDead) return {name:'ELDER', text:"The whole valley believes in you. Finish him, Covert!"};
    return {name:'ELDER', text:"Our hero! The valley is free!"};
  }
  if(who==='farmer'){
    if(foes.some(f=>f.t==='boar')) return {name:'FARMER', text:"Boars are eating everything! Drive them off my fields!"};
    if(!flags.farmReward) return {name:'FARMER', text:"You did it! Here — take this gold. (SPACE)"};
    if(!built.has('farm')) return {name:'FARMER', text:"Rebuild my FARM (6 wood, 2 stone) and I'll bake you bread that heals."};
    return {name:'FARMER', text:"Bread's on the house, friend. Grab it when you see it!"};
  }
  if(who==='miner'){
    if(!built.has('quarry')) return {name:'MINER', text:"My hoist is busted. Fix it with 10 wood and I'll haul you +1 stone every 15 seconds."};
    return {name:'MINER', text:"Rock steady! Stone's coming up regular now."};
  }
  if(who==='lamp'){
    /* the Lamplighter — the THREAD's wanderer, once per world. Wet-ash coat,
       left limp, small unlit lantern. Never explained. */
    const lines=[
      "Does it still remember the sea?",
      "The light remembers what the world forgets.",
      "Beneath the valley there is an archive, and in it a cistern that does not ripple. This water knew how, once. That is why I came down.",
      "Nine coins. Ninety-nine. Nine hundred ninety-nine. You counted. Something counted with you.",
      "The Warlord's door and that one hum the same note. I would not knock on either.",
      "This is the square, seen from underneath. Most places have an underneath. Few sell tickets."
    ];
    const i=Math.floor(playFrames/900)%lines.length;
    return {name:'THE LAMPLIGHTER', text:lines[i]};
  }
  if(who==='yogi'){
    /* Every line is TRUE of the actual dependency graph — take her literally
       and you are never sent somewhere that does not pay out.

       Plainer since 2026-08-20 (Scott: "give the floating sage more coherent
       language too - it can be hint-ish but not so roundabout and flowery").
       She was written in the Brit Marling register and it had drifted from
       oracular into simply unusable: "Wood becomes a bridge, a bridge becomes
       an east you have not seen..." is a real dependency chain that nobody can
       act on. Quiet and knowing is the character; obscure is not. A HINT THAT
       CANNOT BE FOLLOWED IS NOT A HINT. Same note Scott gave the camp NPCs and
       the wall lore the same day — see PLAIN-VOICE LAW in the roadmap. */
    const wisdom=[
      "The cabinets unlock from work you do outdoors, not from waiting here.",
      "The keeper's rings are not locks, they are a count. Break them anywhere and he will know.",
      "The terminal cannot be walked to, and what is in it is not earned there.",
      "The miner thinks the hoist is for stone. It is for what the dark was hiding.",
      "You will see the water long before you meet what lives under it.",
      "The Warlord is not guarding treasure. He is guarding a door, and it is still warm.",
      "New cabinets turn up in the square first. The Arcade is where they end up later.",
      "In the workings, nothing has ever killed you that you did not set moving first.",
      "The rock is not in a hurry. Down there, you do not have to be either.",
      "Every room you have not reached is waiting on something you already started.",
      "Wood makes the bridge, the bridge opens the east, and the east has a door in it.",
      "The text adventure and the valley are the same place. One of them just will not draw itself.",
      "An open loop is a small weight you carry everywhere. Close the little ones.",
      "Joy is not the reward for finishing. It is the fuel. Do not save it for the end.",
      "The closer you get to the end, the louder the fear. That is how you know you are close."
    ];
    const i=Math.floor(playFrames/900)%wisdom.length;   // shifts every ~15s
    return {name:'BRIT, THE FLOATING SAGE', text:wisdom[i]};
  }
  return null;
}

/* ---------------- OBJECTIVE LINE ---------------- */
function objective(){
  switch(curScr){
    case 0: { const left=hearts.length + chests.filter(c=>!c.open).length;
              return left? 'Two rounds of wolves — the islet at the centre is worth reaching'
                         : 'The islet is stripped. The rounds turn on without you.'; }
    case 2: return built.has('quarry')?'A dark cave mouth yawns in the cliff...':'Repair the quarry hoist (10 wood)';
    case 4: return built.has('boat')?'Row to the island (SPACE at the boat)':'Build a boat to reach the island (15 wood, 5 gold)';
    case 5: return !built.has('mill')?'Rebuild the mill (8 wood, 4 stone)':'';
    case 6: return built.has('bridge')?'':'Rebuild the bridge (12 wood)';
    case 9: { const b=foes.filter(f=>f.t==='boar').length; if(b>0) return 'Drive off the boars: '+b+' left'; return built.has('farm')?'':'Rebuild the farm (6 wood, 2 stone)'; }
    case 7: if(bossDead>0) return 'The Surrendered are striking the camp — they will talk'; break;
    case 11: {
      if(!built.has('gate')) return 'Clear the gate rubble (8 stone)';
      if(!bossDead) return 'DEFEAT THE WARLORD';
      const dl=flags.digLayer||0;
      return dl>=DIG_LAYERS.length ? '' : 'THE DIG: '+dl+' of '+DIG_LAYERS.length+' layers down — one spade-depth per visit';
    }
    case 12: { const n=archiveLeft().length; return n? ('Cabinets await — '+n+' golden ring'+(n>1?'s still seal':' still seals')+' the keeper') : 'The keeper is free — choose a cabinet'; }
    case 13: {
      const n=diamonds.length;
      if(n>0) return 'Summit diamonds: '+n+' left — shove the boulders aside';
      return flags.summitSockets ? 'The summit is stripped bare' : 'Push the boulders onto their sockets to go further';
    }
    case 14: {
      const g=gaps.filter(gp=>!flags['gapfill:'+gp.id]).length;
      return g>0 ? ('Bridge the gap: shove '+g+' boulder'+(g>1?'s':'')+' in') : 'The bridge holds — cross to the heart';
    }
    /* short on purpose: the objective line shares the HUD with the resource
       counters, and the long first draft printed straight across the gold */
    case 15: return flags.cypherSolved? '' : 'Five soldiers keep one word';
  }
  if(!built.has('mill')) return 'Visit the Elder in the Town Square';
  if(!built.has('bridge')) return 'Rebuild the bridge in the Riverlands (12 wood)';
  if(!built.has('gate')) return 'Reach the Dark Fortress (south-east)';
  return bossDead?'':'Defeat the Warlord in the Dark Fortress';
}

/* ---------------- ENEMIES ---------------- */
function updateFoes(){
  for(const f of foes){
    const d=ENEMY_DEF[f.t];
    if(f.flash>0) f.flash--;
    if(f.rail){
      const R=f.rail;
      if(R.stun>0) R.stun--;
      else R.at += R.dir*R.spd/RAILS[R.ring].per;
      const p=railPos(R.ring, R.at);
      if(Math.abs(p.x-f.x)>0.05) f.face= p.x<f.x? -1:1;   // a wolf walks nose-first
      f.anim += R.stun>0? 0 : R.spd*0.16;
      f.x=p.x; f.y=p.y;
      const rdx=PL.x-f.x, rdy=PL.y-f.y, rd=Math.hypot(rdx,rdy)||1;
      if(PL.iframes<=0 && rd<20){
        PL.hp-=d.dmg; PL.iframes=60; sfx.hurt();
        PL.kb.x=rdx/rd*6; PL.kb.y=rdy/rd*6;
        if(PL.hp<=0) playerDown();
      }
      continue;
    }
    if(f.kbx||f.kby){
      moveBox(f,f.kbx,f.kby); f.kbx*=0.75; f.kby*=0.75;
      if(Math.abs(f.kbx)<0.3){f.kbx=0;f.kby=0;}
      continue;
    }
    const dx=PL.x-f.x, dy=PL.y-f.y, dist=Math.hypot(dx,dy)||1;
    const spd=f.spd||d.spd, wspd=f.wspd||d.wspd, aggro=f.aggro||d.aggro;
    let vx=0, vy=0;
    if(f.t==='boss'){
      f.dashT++;
      if(f.dash>0){ f.dash--; vx=f.dashDX*3.2; vy=f.dashDY*3.2; }
      else if(f.dashT>240 && dist<300){ f.dash=32; f.dashT=0; f.dashDX=dx/dist; f.dashDY=dy/dist; sfx.boss(); }
      else { vx=dx/dist*spd; vy=dy/dist*spd; }
    } else if(dist<aggro){
      vx=dx/dist*spd; vy=dy/dist*spd;
    } else {
      f.wt--;
      if(f.wt<=0){ f.wt=60+Math.random()*90; const a=Math.random()*6.28; f.dir={x:Math.cos(a),y:Math.sin(a)}; if(Math.random()<0.3) f.dir={x:0,y:0}; }
      vx=f.dir.x*wspd; vy=f.dir.y*wspd;
    }
    if(Math.abs(vx)>0.05) f.face= vx<0? -1:1;             // nose-first, both species
    f.anim += Math.hypot(vx,vy)*0.16;                     // gait phase scales with pace
    f.aggroed = dist<aggro;                               // the wolf shows its teeth
    const ftf=slopeFactor(f.x,f.y);
    moveBox(f,vx*ftf,vy*ftf);
    f.x=Math.max(10,Math.min(RW-10,f.x)); f.y=Math.max(14,Math.min(RH-6,f.y));
    // contact damage
    if(PL.iframes<=0 && dist<20){
      PL.hp-=d.dmg; PL.iframes=60; sfx.hurt();
      const kn=dist||1; PL.kb.x=(PL.x-f.x)/kn*6; PL.kb.y=(PL.y-f.y)/kn*6;
      if(PL.hp<=0) playerDown();
    }
  }
}
function playerDown(){
  sfx.die();
  const lost=Math.min(res.gold,5); res.gold-=lost;
  toast(lost>0?('You collapse... you wake in the village (-'+lost+' gold)'):'You collapse... you wake in the village');
  loadScreen(5); PL.x=10*T+16; PL.y=6*T+24; unstick(PL);
  PL.hp=PL.maxhp; PL.iframes=120; PL.kb.x=0; PL.kb.y=0;
  state='play';   // works from the caverns too — you wake above ground
}
